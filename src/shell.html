<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚔ AICG : Lignées</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
color: #e8ecf4;
background:
radial-gradient(1100px 500px at 80% -10%, rgba(38, 166, 154, .22), transparent 60%),
radial-gradient(900px 500px at -10% 110%, rgba(124, 77, 255, .20), transparent 55%),
radial-gradient(700px 400px at 110% 90%, rgba(52, 168, 83, .10), transparent 55%),
#0b0e14;
min-height: 100vh;
line-height: 1.45;
}
h2 { font-size: 1.25rem; margin: 14px 0 8px; letter-spacing: .02em; }
h3 { font-size: 1.05rem; margin: 12px 0 6px; }
h4 { font-size: .95rem; margin: 12px 0 4px; color: #bfe8ff; }
p { margin: 6px 0; }
a { color: #4dd0e1; text-decoration: none; }
ul { list-style: none; }
.muted { color: #93a0b5; font-size: .84em; }
.vspace { height: 18px; }

header {
position: sticky; top: 0; z-index: 40;
display: flex; align-items: center; justify-content: space-between;
padding: 10px 16px;
background: rgba(10, 14, 22, .92);
border-bottom: 1px solid rgba(77, 208, 225, .22);
backdrop-filter: blur(6px);
}
.brand { font-weight: 800; letter-spacing: .04em; }
.pts-badge {
font-weight: 700; font-size: .85rem; color: #ffd54f;
background: rgba(255, 213, 79, .12);
border: 1px solid rgba(255, 213, 79, .4);
border-radius: 999px; padding: 4px 12px;
}
nav {
position: sticky; top: 45px; z-index: 39;
display: flex; gap: 2px; padding: 6px 6px;
/* Lot 4 : safe-area (PWA installée, encoche) — recalculée au resize par le navigateur */
padding-left: calc(6px + env(safe-area-inset-left));
padding-right: calc(6px + env(safe-area-inset-right));
background: rgba(10, 14, 22, .92);
border-bottom: 1px solid rgba(124, 77, 255, .22);
}
nav a {
flex: 1 1 0; padding: 7px 3px; border-radius: 10px; text-align: center;
color: #aeb9cc; font-size: .78rem; font-weight: 600; white-space: nowrap;
}
nav a.on { color: #06131a; background: linear-gradient(135deg, #4dd0e1, #7c4dff); box-shadow: 0 0 12px rgba(77, 208, 225, .45); }
#app { max-width: 760px; margin: 0 auto; padding: 12px 14px 60px; }

.btn {
display: inline-flex; align-items: center; justify-content: center; cursor: pointer; user-select: none;
min-height: 44px; /* lot 7 menus v2 : cibles tactiles >= 44 px */
padding: 9px 16px; border-radius: 12px; border: 1px solid rgba(77, 208, 225, .35);
background: linear-gradient(180deg, #1a2233, #131927);
color: #cfe9f2; font-weight: 700; font-size: .9rem; text-align: center;
transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: scale(.97); }
.btn:disabled, .btn.off { opacity: .45; cursor: not-allowed; }
.btn.big {
padding: 12px 22px; font-size: 1rem; border: none;
background: linear-gradient(135deg, #ff9f43, #ff6b6b);
color: #1a0c05; box-shadow: 0 4px 18px rgba(255, 122, 51, .35);
}
.btn.gold { background: linear-gradient(135deg, #ffd54f, #ff9f43); color: #241303; border: none; }
.btn.small { padding: 6px 10px; font-size: .8rem; border-radius: 9px; }
.btn.ctrl { padding: 7px 12px; font-size: .8rem; }
.btn-hero {
display: inline-block; padding: 14px 26px; border-radius: 14px;
background: linear-gradient(135deg, #26a69a, #7c4dff);
color: #fff; font-weight: 800; font-size: 1.02rem;
box-shadow: 0 6px 22px rgba(124, 77, 255, .45);
transition: transform .12s ease;
}
.btn-hero:active { transform: scale(.97); }
.btn-link { background: none; border: none; color: #4dd0e1; cursor: pointer; font-size: .85em; text-decoration: underline; padding: 0 4px; }
.end-action { display: block; margin: 14px auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }

.card {
position: relative; width: 100%;
aspect-ratio: 5 / 7;
border-radius: 11px;
background: linear-gradient(180deg, #1a2133, #10151f 60%, #0d1118);
box-shadow: 0 3px 10px rgba(0, 0, 0, .5);
border: 2px solid #4a5468;
overflow: hidden;
display: flex; flex-direction: column;
transition: transform .15s ease, box-shadow .15s ease, filter .2s ease;
}

.card.o-Feu { border-color: #ff7043; }
.card.o-Eau { border-color: #4fc3f7; }
.card.o-Terre { border-color: #66bb6a; }
.card.o-Ombre { border-color: #9575cd; }
.card.o-Lumière { border-color: #ffd54f; }


.card.r-C { filter: saturate(.92); }
.card.r-N { filter: saturate(.88); }

.card.r-UC { box-shadow: 0 3px 12px rgba(97, 214, 145, .28), inset 0 0 0 1.5px rgba(140, 240, 180, .08); }
.card.r-R { box-shadow: 0 3px 12px rgba(63, 140, 255, .30), inset 0 0 0 1.5px rgba(255,255,255,.06); border-width: 2px; }
.card.r-SR { box-shadow: 0 4px 16px rgba(176, 107, 255, .42), inset 0 0 0 1.5px rgba(255,255,255,.08); }
.card.r-UR { box-shadow: 0 5px 20px rgba(255, 159, 67, .5), inset 0 0 0 1.5px rgba(255,220,150,.25); }
.card.r-L {
border-color: #ffd54f;
box-shadow: 0 6px 24px rgba(255, 213, 79, .55), inset 0 0 22px rgba(255, 213, 79, .18);
animation: holo 3.2s ease-in-out infinite;
}
@keyframes holo {
0%, 100% { filter: saturate(1) brightness(1); }
50% { filter: saturate(1.25) brightness(1.12); }
}
.art { position: relative; height: 56%; overflow: hidden; background: #0d1119; }
.art-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
/* v3.4 : carte Exception — sweep or 60° (Repos) / rouge sombre (Obscures), halo discret */
.art-img.exception { filter: drop-shadow(0 0 6px rgba(255, 200, 80, .45)); }
.art-img.exception::after { content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(60deg, transparent 30%, rgba(255, 200, 80, .18) 50%, transparent 70%); }
@media (prefers-reduced-motion: no-preference) {
  .art-img.exception { animation: exception-sheen 4s ease-in-out infinite; }
}
@keyframes exception-sheen {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 200, 80, .3)); }
  50% { filter: drop-shadow(0 0 10px rgba(255, 200, 80, .6)); }
}
.glyph {
position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
font-size: 2.1rem; opacity: .92;
background: radial-gradient(circle at 50% 40%, rgba(77, 208, 225, .14), transparent 70%);
}
.rar-chip {
position: absolute; top: 5px; left: 5px; z-index: 3;
font-size: .62rem; font-weight: 800; letter-spacing: .06em;
padding: 2px 7px; border-radius: 999px;
background: rgba(8, 11, 17, .82); border: 1px solid rgba(255, 255, 255, .14);
}
.rar-chip::before { content: '◆ '; } /* Lot 4 : bande de rareté = losange + couleur, jamais couleur seule */
.r-C .rar-chip { color: #9aa5b5; }
.r-N .rar-chip { color: #8d99ad; }
.r-UC .rar-chip { color: #61d691; }
.r-R .rar-chip { color: #45a3ff; }
.r-SR .rar-chip { color: #b06bff; }
.r-UR .rar-chip { color: #ff9f43; }
.r-L .rar-chip { color: #ffd54f; }
.lvl-chip {
position: absolute; top: 5px; right: 5px; z-index: 3;
font-size: .62rem; font-weight: 800;
padding: 2px 7px; border-radius: 999px;
color: #06131a; background: linear-gradient(135deg, #ffd54f, #ff9f43);
}
.badge {
position: absolute; z-index: 3; font-size: .6rem; font-weight: 800;
padding: 2px 8px; border-radius: 999px;
top: 26px; left: 50%; transform: translateX(-50%);
background: rgba(8, 11, 17, .85); border: 1px solid rgba(255, 255, 255, .16);
}
.badge.boss { color: #241303; background: linear-gradient(135deg, #ffd54f, #ff9f43); border: none; }
/* lot 8 refonte v2 (suite 40) : marqueur SHINY — paillettes ✨ animées, DISTINCT des thèmes
   Repos (sweep or 60°), Obscures (liseré rouge sombre) et des rares (105° de rotation) */
.card.shiny .art { box-shadow: inset 0 0 14px rgba(255, 215, 0, .55); }
.card.shiny::after {
content: '✨'; position: absolute; top: 3px; right: 4px; z-index: 4;
font-size: 15px; line-height: 1; pointer-events: none;
text-shadow: 0 0 6px #ffd700, 0 0 12px #ffb300;
animation: shinySparkle 1.1s ease-in-out infinite;
}
.badge.shiny { color: #241303; background: linear-gradient(135deg, #fff3b0, #ffd54f 55%, #ffb300); border: none; }
.badge.exception { top: 46px; color: #241303; background: linear-gradient(135deg, #fff3b0, #ffd54f 55%, #ffb300); border: none; }
.chip.shiny-chip { background: linear-gradient(135deg, #fff3b0, #ffd54f); color: #241303; font-weight: 800; }
.owned-badge.shiny-badge { background: linear-gradient(135deg, #ffd54f, #ffb300); color: #241303; }
.owned-badge.exception-badge { background: linear-gradient(135deg, #ffd54f, #ffb300); color: #241303; }
@keyframes shinySparkle {
0%, 100% { transform: scale(1) rotate(0deg); opacity: .85; }
50% { transform: scale(1.4) rotate(25deg); opacity: 1; }
}
.owned-badge {
position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 5;
font-size: .64rem; font-weight: 800;
padding: 2px 8px; border-radius: 999px;
color: #06131a; background: linear-gradient(135deg, #4dd0e1, #26a69a);
box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
}
.cardbody { padding: 5px 7px 2px; text-align: center; }
.name { font-size: .74rem; font-weight: 800; line-height: 1.15; }
.meta { display: flex; justify-content: center; gap: 6px; font-size: .6rem; color: #93a0b5; margin-top: 2px; flex-wrap: wrap; }
/* v0.35 : .role-chip supprim\u00e9 \u2014 fin de la m\u00e9canique support/attaque */
.role-chip-x {
display: inline-block; margin-top: 3px; font-size: .58rem; font-weight: 700;
padding: 1px 7px; border-radius: 999px; border: 1px solid;
}
.cardfoot {
margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px 7px;
padding: 4px 6px 6px; font-size: .66rem; font-weight: 700;
}
.cardfoot .hp { color: #ff8a9e; }
.cardfoot .sh { color: #40c4ff; }
.cardfoot .mana { color: #b39dff; }

/* pied de stats v2 (pions de combat) : PV, ATQ, mana actuel/total + icônes d'état */
.pied {
position: relative; z-index: 2; margin-top: 0;
display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 5px;
padding: 2px 4px 4px; font-size: .62rem; font-weight: 700;
background: linear-gradient(180deg, rgba(8, 11, 17, .55), rgba(8, 11, 17, .95));
}
.pied .hp { color: #ff8a9e; }
.pied .mana { color: #b39dff; }
.pied .atk { color: #e8ecf4; }
.pied .st-ic { font-size: .58rem; }
.pied .st-ic.up { color: #69f0ae; }
.pied .st-ic.down { color: #ff5c6c; }
.pied .st-ic.sh { color: #40c4ff; }
.card.battle.unit-art .pied { margin-top: 0; }

.card.unit-art .art { position: absolute; inset: 0; height: 100%; z-index: 0; }
body.in-combat .card.unit-art .art { filter: brightness(1.12) contrast(1.04); }
.card.unit-art .cardbody {
position: relative; z-index: 2;
background: linear-gradient(180deg, transparent, rgba(8, 11, 17, .88) 45%);
padding-top: 30px;
}
.card.unit-art .cardfoot {
position: relative; z-index: 2;
background: linear-gradient(180deg, rgba(8, 11, 17, .55), rgba(8, 11, 17, .95));
}

.card.battle .meta { display: none; }
.card.battle .name { font-size: .7rem; }
.card.battle.unit-art .cardbody {
margin-top: auto;
background: linear-gradient(180deg, transparent, rgba(8, 11, 17, .92));
padding-top: 14px;
}
.card.battle.unit-art .cardfoot { margin-top: 0; }
.card.big { width: 190px; }
.card.locked, .card.mystery { filter: grayscale(1) brightness(.6); }
.unit.ko .card { filter: grayscale(1) brightness(.45); opacity: .55; transform: scale(.96); }
.dragged { opacity: .45; }

#controls {
display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
margin: 10px 0; padding: 8px; border-radius: 12px;
background: rgba(16, 21, 33, .75); border: 1px solid rgba(77, 208, 225, .18);
}
#controls label { font-size: .8rem; color: #93a0b5; display: flex; gap: 6px; align-items: center; }
#controls input { width: 64px; background: #0d1119; color: #e8ecf4; border: 1px solid #2a3242; border-radius: 8px; padding: 5px 7px; }
#controls #fight { margin-left: auto; }
.enemy-zone, .team-zone { margin: 8px 0; }
.enemy-zone { border-radius: 14px; padding: 6px; background: rgba(124, 77, 255, .05); }
.team-zone { border-radius: 14px; padding: 6px; background: rgba(38, 166, 154, .07); }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 6px 0; min-height: 60px; }
.unit { flex: 0 0 auto; width: clamp(84px, 16vw, 112px); position: relative; cursor: pointer; }
.unit .card { width: 100%; }
.unit.boss { flex: 0 0 auto; width: clamp(112px, 22vw, 148px); }
.unit.casting { z-index: 5; }
.unit.casting .card { transform: scale(1.08); box-shadow: 0 0 22px rgba(255, 213, 79, .8); }
.unit.targeted .card { box-shadow: 0 0 0 3px #ffd54f, 0 0 18px rgba(255, 213, 79, .6); }
/* ciblage v2 : contour doré pulsant, pastille visée, curseur de visée */
.unit.targeted { cursor: crosshair; }
.unit.targeted .card { animation: targetPulse 1s ease-in-out infinite; }
@keyframes targetPulse {
  0%, 100% { box-shadow: 0 0 0 3px #ffd54f, 0 0 14px rgba(255, 213, 79, .5); }
  50% { box-shadow: 0 0 0 4px #ffe082, 0 0 26px rgba(255, 213, 79, .85); }
}
/* zone de 2 au survol : la voisine contiguë s'allume avec la carte visée */
.unit.zone2 .card { box-shadow: 0 0 0 2px #ffd54f, 0 0 12px rgba(255, 213, 79, .45); }
.unit.zone2::after { content: none; }
/* barre de désignation : libellé (coût/zone) + Annuler, cibles tap >= 44px */
.act-targetbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.act-targetbar .act-lab { margin: 0; flex: 1 1 200px; }
.act-cancel { min-height: 44px; }
@media (prefers-reduced-motion: reduce) {
  .unit.targeted .card, .unit.targeted::after { animation: none !important; }
}
.unit.targeted::after {
content: "🎯"; position: absolute; top: -8px; left: -6px; z-index: 6;
font-size: .95rem; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .6));
animation: bop .6s ease infinite alternate;
}
@keyframes bop { from { transform: translateY(0); } to { transform: translateY(-3px); } }
/* correctifs v2 lot 1 : QUI joue lisible en 1 s — unité active surlignée SUR le terrain (deux camps, tours auto compris), badge ▶ AU-DESSUS de la vignette */
.unit.acting { z-index: 6; }
.unit.acting .card { animation: actingPulse 1.1s ease-in-out infinite; border-color: #ffd54f; }
@keyframes actingPulse {
  0%, 100% { box-shadow: 0 0 0 3px rgba(255, 213, 79, .95), 0 0 14px rgba(255, 213, 79, .55); }
  50% { box-shadow: 0 0 0 5px #ffe082, 0 0 30px rgba(255, 213, 79, .95); }
}
.unit.acting::after {
  content: "\25B6"; position: absolute; top: -14px; left: 50%; transform: translateX(-50%); z-index: 7;
  color: #241303; background: linear-gradient(135deg, #ffe082, #ffd54f); border-radius: 999px;
  font-size: .7rem; font-weight: 900; padding: 2px 7px; white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .65), 0 0 12px rgba(255, 213, 79, .8);
  animation: bop .6s ease infinite alternate;
}
.unit.sq.acting::after { top: -10px; font-size: .55rem; padding: 1px 5px; }

.float {
position: absolute; top: -4px; left: 50%; transform: translateX(-50%); z-index: 8;
font-size: 1.15rem; font-weight: 900; pointer-events: none; white-space: nowrap;
text-shadow: 0 2px 6px rgba(0, 0, 0, .85);
animation: floatup 1.5s ease-out forwards;
}
.float.dmg { color: #ff5252; }
.float.heal { color: #69f0ae; }
.float.buff { color: #ffd54f; }
.float.shield { color: #40c4ff; }
.float.block { color: #40c4ff; font-size: 1rem; }
.float.cast { color: #b39dff; }
/* correctifs v2 lot 1 : étiquette du nom de l'unité active, TOUJOURS au-dessus des dégâts flottants (jamais cumulée) */
.float.who { top: -30px; font-size: .78rem; font-weight: 800; color: #241303; background: linear-gradient(135deg, #ffe082, #ffd54f); padding: 2px 9px; border-radius: 999px; text-shadow: none; box-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
.float.fx-special { font-size: 1.5rem; color: #ffe082; text-shadow: 0 0 14px rgba(255, 213, 79, .95), 0 2px 6px rgba(0,0,0,.85); }
.float.fx-crit { font-size: 1.7rem; color: #ffb300; text-shadow: 0 0 16px rgba(255, 179, 0, .95), 0 2px 6px rgba(0,0,0,.9); }
/* Lot 2 : feedback 3 tiers */
.fx-flash { position: fixed; inset: 0; pointer-events: none; z-index: 90; }
.fx-flash-big { background: rgba(255, 244, 214, .28); animation: fxflash .28s ease-out; }
.fx-flash-med { background: rgba(255, 244, 214, .14); animation: fxflash .22s ease-out; }
.fx-flash-soft { background: rgba(255, 244, 214, .10); } /* option « réduire les flashs » : teinte sans pulsation */
@keyframes fxflash { from { opacity: 1; } to { opacity: 0; } }
.float.pop { animation: floatpop .38s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes floatpop { 0% { transform: translateY(6px) scale(.7); } 100% { transform: translateY(-26px) scale(1); } }
.zoom-pop { animation: zoompop .32s ease-out; }
@keyframes zoompop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
.float.dodge { font-size: 1.3rem; font-weight: 700; color: #b3e5fc; text-shadow: 0 0 12px rgba(179,229,252,.9), 0 2px 6px rgba(0,0,0,.85); }
@keyframes dodgePose { 30% { transform: translateX(-14px) rotate(-6deg); } 60% { transform: translateX(8px); } }
.unit.dodge-pose { animation: dodgePose .5s ease; }
.logline.dodge { color: #b3e5fc; }
@keyframes floatup {
0% { opacity: 0; transform: translateX(-50%) translateY(6px) scale(.7); }
12% { opacity: 1; transform: translateX(-50%) translateY(-4px) scale(1.15); }
30% { transform: translateX(-50%) translateY(-12px) scale(1); }
100% { opacity: 0; transform: translateX(-50%) translateY(-52px) scale(1); }
}
.cast-tag {
position: absolute; top: -22px; left: 50%; transform: translateX(-50%); z-index: 9;
font-size: .68rem; font-weight: 800; white-space: nowrap; pointer-events: none;
color: #06131a; background: linear-gradient(135deg, #b39dff, #4dd0e1);
padding: 3px 10px; border-radius: 999px;
box-shadow: 0 3px 10px rgba(0, 0, 0, .6);
animation: tagin .25s ease;
}
@keyframes tagin { from { opacity: 0; transform: translateX(-50%) translateY(6px); } }
.burst {
position: absolute; inset: -6px; z-index: 7; pointer-events: none;
border: 3px solid rgba(255, 213, 79, .9); border-radius: 50%;
animation: burst .7s ease-out forwards;
}
@keyframes burst { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.shake { animation: shake .26s ease; }
.shake-big { animation: shake-big .38s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
@keyframes shake-big { 20% { transform: translate(-9px, 2px); } 40% { transform: translate(9px, -2px); } 60% { transform: translate(-6px, 1px); } 80% { transform: translate(6px, -1px); } }
.zone-flash { animation: zoneflash .65s ease; }
@keyframes zoneflash { 0% { background: rgba(255, 82, 82, .35); } 100% { background: transparent; } }
#log { min-height: 30px; font-size: .82rem; margin: 8px 0; }
.logline.win { color: #69f0ae; }
.logline.lose { color: #ff8a9e; }

.banner {
position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 60;
font-size: 1.35rem; font-weight: 900; text-align: center; max-width: 88vw;
padding: 16px 26px; border-radius: 16px; pointer-events: none;
animation: bannerin .45s cubic-bezier(.2, 1.4, .4, 1);
}
.banner.win { color: #06131a; background: linear-gradient(135deg, #69f0ae, #26a69a); box-shadow: 0 8px 30px rgba(38, 166, 154, .6); }
.banner.lose { color: #1a0505; background: linear-gradient(135deg, #ff8a9e, #ff5252); box-shadow: 0 8px 30px rgba(255, 82, 82, .6); }
.banner.out { animation: bannerout .8s ease forwards; }
@keyframes bannerin { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }
@keyframes bannerout { to { opacity: 0; transform: translate(-50%, -64%) scale(1.05); } }

.special-overlay {
position: fixed; inset: 0; z-index: 70; pointer-events: none;
display: flex; align-items: flex-start; justify-content: center;
padding-top: 9dvh;
animation: fadein .2s ease;
}
.special-overlay.out { animation: fadeout .35s ease forwards; }
@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
