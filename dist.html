<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>⚔ AICG : Lignées</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
color: #e8ecf4;
background:
radial-gradient(1100px 500px at 80% -10%, rgba(38, 166, 154, .22), transparent 60%),
radial-gradient(900px 500px at -10% 110%, rgba(124, 77, 255, .20), transparent 55%),
radial-gradient(700px 400px at 110% 90%, rgba(52, 168, 83, .10), transparent 55%),
#0b0e14;
min-height: 100vh;
line-height: 1.45;
}
h2 { font-size: 1.25rem; margin: 14px 0 8px; letter-spacing: .02em; }
h3 { font-size: 1.05rem; margin: 12px 0 6px; }
h4 { font-size: .95rem; margin: 12px 0 4px; color: #bfe8ff; }
p { margin: 6px 0; }
a { color: #4dd0e1; text-decoration: none; }
ul { list-style: none; }
.muted { color: #93a0b5; font-size: .84em; }
.vspace { height: 18px; }

header {
position: sticky; top: 0; z-index: 40;
display: flex; align-items: center; justify-content: space-between;
padding: 10px 16px;
background: rgba(10, 14, 22, .92);
border-bottom: 1px solid rgba(77, 208, 225, .22);
backdrop-filter: blur(6px);
}
.brand { font-weight: 800; letter-spacing: .04em; }
.pts-badge {
font-weight: 700; font-size: .85rem; color: #ffd54f;
background: rgba(255, 213, 79, .12);
border: 1px solid rgba(255, 213, 79, .4);
border-radius: 999px; padding: 4px 12px;
}
nav {
position: sticky; top: 45px; z-index: 39;
display: flex; gap: 2px; padding: 6px 6px;
background: rgba(10, 14, 22, .92);
border-bottom: 1px solid rgba(124, 77, 255, .22);
}
nav a {
flex: 1 1 0; padding: 7px 3px; border-radius: 10px; text-align: center;
color: #aeb9cc; font-size: .78rem; font-weight: 600; white-space: nowrap;
}
nav a.on { color: #06131a; background: linear-gradient(135deg, #4dd0e1, #7c4dff); box-shadow: 0 0 12px rgba(77, 208, 225, .45); }
#app { max-width: 760px; margin: 0 auto; padding: 12px 14px 60px; }

.btn {
display: inline-block; cursor: pointer; user-select: none;
padding: 9px 16px; border-radius: 12px; border: 1px solid rgba(77, 208, 225, .35);
background: linear-gradient(180deg, #1a2233, #131927);
color: #cfe9f2; font-weight: 700; font-size: .9rem; text-align: center;
transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: scale(.97); }
.btn:disabled, .btn.off { opacity: .45; cursor: not-allowed; }
.btn.big {
padding: 12px 22px; font-size: 1rem; border: none;
background: linear-gradient(135deg, #ff9f43, #ff6b6b);
color: #1a0c05; box-shadow: 0 4px 18px rgba(255, 122, 51, .35);
}
.btn.gold { background: linear-gradient(135deg, #ffd54f, #ff9f43); color: #241303; border: none; }
.btn.small { padding: 6px 10px; font-size: .8rem; border-radius: 9px; }
.btn.ctrl { padding: 7px 12px; font-size: .8rem; }
.btn-hero {
display: inline-block; padding: 14px 26px; border-radius: 14px;
background: linear-gradient(135deg, #26a69a, #7c4dff);
color: #fff; font-weight: 800; font-size: 1.02rem;
box-shadow: 0 6px 22px rgba(124, 77, 255, .45);
transition: transform .12s ease;
}
.btn-hero:active { transform: scale(.97); }
.btn-link { background: none; border: none; color: #4dd0e1; cursor: pointer; font-size: .85em; text-decoration: underline; padding: 0 4px; }
.end-action { display: block; margin: 14px auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }

.card {
position: relative; width: 100%;
aspect-ratio: 5 / 7;
border-radius: 11px;
background: linear-gradient(180deg, #1a2133, #10151f 60%, #0d1118);
box-shadow: 0 3px 10px rgba(0, 0, 0, .5);
border: 2px solid #4a5468;
overflow: hidden;
display: flex; flex-direction: column;
transition: transform .15s ease, box-shadow .15s ease, filter .2s ease;
}

.card.o-Feu { border-color: #ff7043; }
.card.o-Eau { border-color: #4fc3f7; }
.card.o-Terre { border-color: #66bb6a; }
.card.o-Ombre { border-color: #9575cd; }
.card.o-Lumière { border-color: #ffd54f; }


.card.r-C { filter: saturate(.92); }
.card.r-N { filter: saturate(.88); }

.card.r-UC { box-shadow: 0 3px 12px rgba(97, 214, 145, .28), inset 0 0 0 1.5px rgba(140, 240, 180, .08); }
.card.r-R { box-shadow: 0 3px 12px rgba(63, 140, 255, .30), inset 0 0 0 1.5px rgba(255,255,255,.06); border-width: 2px; }
.card.r-SR { box-shadow: 0 4px 16px rgba(176, 107, 255, .42), inset 0 0 0 1.5px rgba(255,255,255,.08); }
.card.r-UR { box-shadow: 0 5px 20px rgba(255, 159, 67, .5), inset 0 0 0 1.5px rgba(255,220,150,.25); }
.card.r-L {
border-color: #ffd54f;
box-shadow: 0 6px 24px rgba(255, 213, 79, .55), inset 0 0 22px rgba(255, 213, 79, .18);
animation: holo 3.2s ease-in-out infinite;
}
@keyframes holo {
0%, 100% { filter: saturate(1) brightness(1); }
50% { filter: saturate(1.25) brightness(1.12); }
}
.art { position: relative; height: 56%; overflow: hidden; background: #0d1119; }
.art-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.glyph {
position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
font-size: 2.1rem; opacity: .92;
background: radial-gradient(circle at 50% 40%, rgba(77, 208, 225, .14), transparent 70%);
}
.rar-chip {
position: absolute; top: 5px; left: 5px; z-index: 3;
font-size: .62rem; font-weight: 800; letter-spacing: .06em;
padding: 2px 7px; border-radius: 999px;
background: rgba(8, 11, 17, .82); border: 1px solid rgba(255, 255, 255, .14);
}
.r-C .rar-chip { color: #9aa5b5; }
.r-N .rar-chip { color: #8d99ad; }
.r-UC .rar-chip { color: #61d691; }
.r-R .rar-chip { color: #45a3ff; }
.r-SR .rar-chip { color: #b06bff; }
.r-UR .rar-chip { color: #ff9f43; }
.r-L .rar-chip { color: #ffd54f; }
.lvl-chip {
position: absolute; top: 5px; right: 5px; z-index: 3;
font-size: .62rem; font-weight: 800;
padding: 2px 7px; border-radius: 999px;
color: #06131a; background: linear-gradient(135deg, #ffd54f, #ff9f43);
}
.badge {
position: absolute; z-index: 3; font-size: .6rem; font-weight: 800;
padding: 2px 8px; border-radius: 999px;
top: 26px; left: 50%; transform: translateX(-50%);
background: rgba(8, 11, 17, .85); border: 1px solid rgba(255, 255, 255, .16);
}
.badge.boss { color: #241303; background: linear-gradient(135deg, #ffd54f, #ff9f43); border: none; }
.owned-badge {
position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 5;
font-size: .64rem; font-weight: 800;
padding: 2px 8px; border-radius: 999px;
color: #06131a; background: linear-gradient(135deg, #4dd0e1, #26a69a);
box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
}
.cardbody { padding: 5px 7px 2px; text-align: center; }
.name { font-size: .74rem; font-weight: 800; line-height: 1.15; }
.meta { display: flex; justify-content: center; gap: 6px; font-size: .6rem; color: #93a0b5; margin-top: 2px; flex-wrap: wrap; }
/* v0.35 : .role-chip supprim\u00e9 \u2014 fin de la m\u00e9canique support/attaque */
.role-chip-x {
display: inline-block; margin-top: 3px; font-size: .58rem; font-weight: 700;
padding: 1px 7px; border-radius: 999px; border: 1px solid;
}
.cardfoot {
margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px 7px;
padding: 4px 6px 6px; font-size: .66rem; font-weight: 700;
}
.cardfoot .hp { color: #ff8a9e; }
.cardfoot .sh { color: #40c4ff; }
.cardfoot .mana { color: #b39dff; }

/* pied de stats v2 (pions de combat) : PV, ATQ, mana actuel/total + icônes d'état */
.pied {
position: relative; z-index: 2; margin-top: 0;
display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 5px;
padding: 2px 4px 4px; font-size: .62rem; font-weight: 700;
background: linear-gradient(180deg, rgba(8, 11, 17, .55), rgba(8, 11, 17, .95));
}
.pied .hp { color: #ff8a9e; }
.pied .mana { color: #b39dff; }
.pied .atk { color: #e8ecf4; }
.pied .st-ic { font-size: .58rem; }
.pied .st-ic.up { color: #69f0ae; }
.pied .st-ic.down { color: #ff5c6c; }
.pied .st-ic.sh { color: #40c4ff; }
.card.battle.unit-art .pied { margin-top: 0; }

.card.unit-art .art { position: absolute; inset: 0; height: 100%; z-index: 0; }
body.in-combat .card.unit-art .art { filter: brightness(1.12) contrast(1.04); }
.card.unit-art .cardbody {
position: relative; z-index: 2;
background: linear-gradient(180deg, transparent, rgba(8, 11, 17, .88) 45%);
padding-top: 30px;
}
.card.unit-art .cardfoot {
position: relative; z-index: 2;
background: linear-gradient(180deg, rgba(8, 11, 17, .55), rgba(8, 11, 17, .95));
}

.card.battle .meta { display: none; }
.card.battle .name { font-size: .7rem; }
.card.battle.unit-art .cardbody {
margin-top: auto;
background: linear-gradient(180deg, transparent, rgba(8, 11, 17, .92));
padding-top: 14px;
}
.card.battle.unit-art .cardfoot { margin-top: 0; }
.card.big { width: 190px; }
.card.locked, .card.mystery { filter: grayscale(1) brightness(.6); }
.unit.ko .card { filter: grayscale(1) brightness(.45); opacity: .55; transform: scale(.96); }
.dragged { opacity: .45; }

#controls {
display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
margin: 10px 0; padding: 8px; border-radius: 12px;
background: rgba(16, 21, 33, .75); border: 1px solid rgba(77, 208, 225, .18);
}
#controls label { font-size: .8rem; color: #93a0b5; display: flex; gap: 6px; align-items: center; }
#controls input { width: 64px; background: #0d1119; color: #e8ecf4; border: 1px solid #2a3242; border-radius: 8px; padding: 5px 7px; }
#controls #fight { margin-left: auto; }
.enemy-zone, .team-zone { margin: 8px 0; }
.enemy-zone { border-radius: 14px; padding: 6px; background: rgba(124, 77, 255, .05); }
.team-zone { border-radius: 14px; padding: 6px; background: rgba(38, 166, 154, .07); }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 6px 0; min-height: 60px; }
.unit { flex: 0 0 auto; width: clamp(84px, 16vw, 112px); position: relative; cursor: pointer; }
.unit .card { width: 100%; }
.unit.boss { flex: 0 0 auto; width: clamp(112px, 22vw, 148px); }
.unit.casting { z-index: 5; }
.unit.casting .card { transform: scale(1.08); box-shadow: 0 0 22px rgba(255, 213, 79, .8); }
.unit.targeted .card { box-shadow: 0 0 0 3px #ffd54f, 0 0 18px rgba(255, 213, 79, .6); }
/* ciblage v2 : contour doré pulsant, pastille visée, curseur de visée */
.unit.targeted { cursor: crosshair; }
.unit.targeted .card { animation: targetPulse 1s ease-in-out infinite; }
@keyframes targetPulse {
  0%, 100% { box-shadow: 0 0 0 3px #ffd54f, 0 0 14px rgba(255, 213, 79, .5); }
  50% { box-shadow: 0 0 0 4px #ffe082, 0 0 26px rgba(255, 213, 79, .85); }
}
/* zone de 2 au survol : la voisine contiguë s'allume avec la carte visée */
.unit.zone2 .card { box-shadow: 0 0 0 2px #ffd54f, 0 0 12px rgba(255, 213, 79, .45); }
.unit.zone2::after { content: none; }
/* barre de désignation : libellé (coût/zone) + Annuler, cibles tap >= 44px */
.act-targetbar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.act-targetbar .act-lab { margin: 0; flex: 1 1 200px; }
.act-cancel { min-height: 44px; }
@media (prefers-reduced-motion: reduce) {
  .unit.targeted .card, .unit.targeted::after { animation: none !important; }
}
.unit.targeted::after {
content: "🎯"; position: absolute; top: -8px; left: -6px; z-index: 6;
font-size: .95rem; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .6));
animation: bop .6s ease infinite alternate;
}
@keyframes bop { from { transform: translateY(0); } to { transform: translateY(-3px); } }

.float {
position: absolute; top: 12%; left: 50%; transform: translateX(-50%); z-index: 8;
font-size: 1.15rem; font-weight: 900; pointer-events: none; white-space: nowrap;
text-shadow: 0 2px 6px rgba(0, 0, 0, .85);
animation: floatup 1.5s ease-out forwards;
}
.float.dmg { color: #ff5252; }
.float.heal { color: #69f0ae; }
.float.buff { color: #ffd54f; }
.float.shield { color: #40c4ff; }
.float.block { color: #40c4ff; font-size: 1rem; }
.float.cast { color: #b39dff; }
.float.fx-special { font-size: 1.5rem; color: #ffe082; text-shadow: 0 0 14px rgba(255, 213, 79, .95), 0 2px 6px rgba(0,0,0,.85); }
@keyframes floatup {
0% { opacity: 0; transform: translateX(-50%) translateY(6px) scale(.7); }
12% { opacity: 1; transform: translateX(-50%) translateY(-4px) scale(1.15); }
30% { transform: translateX(-50%) translateY(-12px) scale(1); }
100% { opacity: 0; transform: translateX(-50%) translateY(-52px) scale(1); }
}
.cast-tag {
position: absolute; top: -22px; left: 50%; transform: translateX(-50%); z-index: 9;
font-size: .68rem; font-weight: 800; white-space: nowrap; pointer-events: none;
color: #06131a; background: linear-gradient(135deg, #b39dff, #4dd0e1);
padding: 3px 10px; border-radius: 999px;
box-shadow: 0 3px 10px rgba(0, 0, 0, .6);
animation: tagin .25s ease;
}
@keyframes tagin { from { opacity: 0; transform: translateX(-50%) translateY(6px); } }
.burst {
position: absolute; inset: -6px; z-index: 7; pointer-events: none;
border: 3px solid rgba(255, 213, 79, .9); border-radius: 50%;
animation: burst .7s ease-out forwards;
}
@keyframes burst { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.shake { animation: shake .26s ease; }
.shake-big { animation: shake-big .38s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
@keyframes shake-big { 20% { transform: translate(-9px, 2px); } 40% { transform: translate(9px, -2px); } 60% { transform: translate(-6px, 1px); } 80% { transform: translate(6px, -1px); } }
.zone-flash { animation: zoneflash .65s ease; }
@keyframes zoneflash { 0% { background: rgba(255, 82, 82, .35); } 100% { background: transparent; } }
#log { min-height: 30px; font-size: .82rem; margin: 8px 0; }
.logline.win { color: #69f0ae; }
.logline.lose { color: #ff8a9e; }

.banner {
position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 60;
font-size: 1.35rem; font-weight: 900; text-align: center; max-width: 88vw;
padding: 16px 26px; border-radius: 16px; pointer-events: none;
animation: bannerin .45s cubic-bezier(.2, 1.4, .4, 1);
}
.banner.win { color: #06131a; background: linear-gradient(135deg, #69f0ae, #26a69a); box-shadow: 0 8px 30px rgba(38, 166, 154, .6); }
.banner.lose { color: #1a0505; background: linear-gradient(135deg, #ff8a9e, #ff5252); box-shadow: 0 8px 30px rgba(255, 82, 82, .6); }
.banner.out { animation: bannerout .8s ease forwards; }
@keyframes bannerin { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }
@keyframes bannerout { to { opacity: 0; transform: translate(-50%, -64%) scale(1.05); } }

.special-overlay {
position: fixed; inset: 0; z-index: 70; pointer-events: none;
display: flex; align-items: flex-start; justify-content: center;
padding-top: 9dvh;
animation: fadein .2s ease;
}
.special-overlay.out { animation: fadeout .35s ease forwards; }
@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
.special-flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.5), transparent 60%); animation: sflash .7s ease-out forwards; }
@keyframes sflash { from { opacity: 1; } to { opacity: 0; } }
.special-card {
position: relative; z-index: 2; width: min(330px, 88vw);
display: flex; align-items: center; gap: 10px; text-align: left;
border-radius: 14px; padding: 8px 12px;
background: linear-gradient(180deg, rgba(26, 33, 51, .97), rgba(13, 17, 24, .97));
border: 2px solid rgba(255, 213, 79, .6);
box-shadow: 0 0 40px rgba(255, 213, 79, .3);
animation: specialin .45s cubic-bezier(.2, 1.3, .4, 1);
}
.special-txt { min-width: 0; }
@keyframes specialin { from { transform: scale(.7); opacity: 0; } }
.special-art { position: relative; flex: 0 0 92px; width: 92px; height: 116px; border-radius: 10px; overflow: hidden; background: #0d1119; }
.special-art .glyph { font-size: 4rem; }
.special-title { margin-top: 0; font-size: .66rem; font-weight: 800; letter-spacing: .18em; color: #ffd54f; }
.special-name { font-size: 1.02rem; font-weight: 900; margin-top: 1px; }
.special-owner { margin-top: 1px; font-size: .78rem; color: #93a0b5; }

.line { margin: 14px 0; }
.line .row { justify-content: center; }
.team-switch { display: inline-flex; align-items: center; gap: 10px; margin-left: 6px; vertical-align: middle; }
.team-switch .btn { padding: 3px 12px; }
.slot {
position: relative; flex: 0 1 128px; width: min(128px, calc((100% - 32px) / 5)); aspect-ratio: 5 / 7;
border-radius: 12px; border: 2px dashed rgba(77, 208, 225, .3);
display: flex; align-items: center; justify-content: center;
}
.slot.empty::after { content: "＋"; font-size: 1.4rem; color: rgba(77, 208, 225, .4); }
.slot .card { width: 100%; height: 100%; cursor: grab; }
.slot.empty .card { display: none; }
.syn-panel {
margin: 14px 0; padding: 10px 14px; border-radius: 14px;
background: rgba(16, 21, 33, .8); border: 1px solid rgba(77, 208, 225, .22);
}
.syn { margin: 5px 0; padding: 6px 10px; border-radius: 10px; font-size: .84rem; background: rgba(77, 208, 225, .07); }
.syn.t1 { border-left: 3px solid #4dd0e1; }
.syn.t2 { border-left: 3px solid #ffd54f; background: rgba(255, 213, 79, .08); }
.filters { margin: 10px 0; }
.fgroup { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip {
display: inline-block; cursor: pointer; font-size: .76rem; font-weight: 700;
padding: 4px 11px; border-radius: 999px;
background: rgba(26, 34, 51, .9); border: 1px solid rgba(77, 208, 225, .28); color: #aeb9cc;
}
.chip.on { color: #06131a; background: linear-gradient(135deg, #4dd0e1, #26a69a); border-color: transparent; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 10px; margin: 10px 0 18px; }
.gcell { position: relative; cursor: pointer; }
.gcell .card { cursor: pointer; }
/* correctifs lot 4 : boutons d'action explicites sur les cellules (fiche ℹ️, ajouter ＋, retirer −/✕) */
.cell-actions { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; z-index: 3; }
.cell-btn { width: 32px; height: 32px; padding: 0; border-radius: 8px; border: 1px solid rgba(212, 175, 55, .65); background: rgba(16, 21, 33, .88); color: #ffd97a; font-size: .95rem; font-weight: 700; line-height: 1; cursor: pointer; }
.cell-btn:active { transform: scale(.92); }
.slot { position: relative; }
.slot .cell-btn.slot-out { position: absolute; top: 4px; right: 4px; z-index: 3; color: #ff9a9a; }
.empty-collection { padding: 18px; text-align: center; }

.fam {
margin: 14px 0; padding: 12px 14px; border-radius: 16px;
background: rgba(16, 21, 33, .72); border: 1px solid rgba(124, 77, 255, .18);
}
.race-band {
margin: 26px 0 6px; padding: 8px 14px; border-radius: 12px; font-size: 1.05rem;
background: linear-gradient(90deg, rgba(124, 77, 255, .22), rgba(16, 21, 33, .6));
border: 1px solid rgba(124, 77, 255, .35);
}
.fam-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px; margin: 10px 0; }
.fam-card { position: relative; width: 96px; flex: 0 0 auto; cursor: pointer; }
.fam-card.mystery {
aspect-ratio: 5 / 7; border-radius: 11px; border: 2px dashed rgba(147, 160, 181, .35);
background: linear-gradient(180deg, #141a29, #0d1119);
display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
padding: 6px; text-align: center; cursor: default;
}
.mystery-glyph { font-size: 1.7rem; filter: grayscale(1) brightness(.75); }
.mystery-rar { font-size: .62rem; font-weight: 800; color: #9aa5b5; letter-spacing: .06em; }
.mystery-name { font-size: .62rem; color: #93a0b5; line-height: 1.2; }
.fam-hint { font-size: .8em; }
.evo-arrow { color: #93a0b5; font-weight: 900; font-size: 1rem; }

.modal-overlay {
position: fixed; inset: 0; z-index: 80; padding: 16px;
display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
background: rgba(5, 7, 12, .78); backdrop-filter: blur(4px);
animation: fadein .18s ease;
}
.modal {
position: relative; width: min(660px, 100%); margin: 5vh auto 40px;
display: grid; grid-template-columns: 232px 1fr; gap: 16px;
border-radius: 18px; padding: 18px;
background: linear-gradient(180deg, #161d2c, #0e131d);
border: 1px solid rgba(77, 208, 225, .25);
box-shadow: 0 20px 60px rgba(0, 0, 0, .7);
}
.modal-syn { grid-template-columns: 1fr; }
.modal-close {
position: fixed; top: 10px; right: 10px; z-index: 95;
width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
background: rgba(26, 34, 51, .95); color: #ff8a9e; font-size: .95rem; font-weight: 800;
}
.modal-card { display: flex; justify-content: center; align-items: flex-start; }
.modal-info { min-width: 0; padding-right: 10px; }

.modal-info .lvl-chip { position: static; display: inline-block; vertical-align: middle; margin-left: 6px; }
.statline { margin: 6px 0; }
.spells { margin: 6px 0; }
.spell {
padding: 7px 10px; margin: 6px 0; border-radius: 10px;
background: rgba(77, 208, 225, .07); border-left: 3px solid #4dd0e1;
display: flex; flex-direction: column; gap: 1px;
}
.spell b { font-size: .88rem; }
.spell-desc { font-size: .8em; }
.spell-cat { font-size: .72em; border: 1px solid #4dd0e144; border-radius: 8px; padding: 1px 6px; color: #4dd0e1; vertical-align: middle; white-space: nowrap; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.modal-feedback { min-height: 1.4em; margin-top: 10px; font-weight: 700; color: #69f0ae; }
.evo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; margin: 8px 0; }
.evo-step {
display: inline-flex; flex-direction: column; align-items: center; gap: 3px;
width: 74px; padding: 6px 4px; border-radius: 12px; cursor: pointer;
background: rgba(26, 34, 51, .8); border: 1px solid rgba(77, 208, 225, .22);
font: inherit; color: inherit;
}
.evo-step.current { border-color: #ffd54f; box-shadow: 0 0 10px rgba(255, 213, 79, .4); }
.evo-step.mystery, .evo-step.locked { opacity: .62; }
.evo-art {
position: relative; width: 60px; height: 60px; border-radius: 9px; overflow: hidden;
background: #0d1119; display: flex; align-items: center; justify-content: center;
}

.evo-art { position: relative; }
.locked-art { font-size: 1.4rem; filter: grayscale(1) brightness(.7); }
.evo-rar { font-size: .6rem; font-weight: 800; letter-spacing: .08em; color: #9aa5b5; }
.evo-name { font-size: .6rem; color: #cfd8e6; text-align: center; line-height: 1.2; }
.fusion-list { display: flex; flex-direction: column; gap: 8px; margin: 10px 0; }
.fusion-list .btn { width: 100%; }
.syn.t1 b { color: #4dd0e1; }

.shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 14px 0; }
.shop-card {
padding: 16px; border-radius: 16px; text-align: center;
background: rgba(16, 21, 33, .8); border: 1px solid rgba(77, 208, 225, .22);
}
.shop-card.premium { border-color: rgba(255, 213, 79, .5); box-shadow: 0 0 24px rgba(255, 213, 79, .12); }
.pack-mini { margin: 0 auto 8px; width: 84px; aspect-ratio: 5 / 7; }
.pack-mini img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; box-shadow: 0 4px 14px rgba(0, 0, 0, .6); }
.price { font-size: 1.05rem; font-weight: 900; color: #ffd54f; margin: 8px 0; }
.price b { color: #06131a; background: linear-gradient(135deg, #69f0ae, #26a69a); padding: 2px 10px; border-radius: 999px; }

.packzone { display: flex; flex-direction: column; align-items: center; margin: 14px 0; }
.packstage { position: relative; width: min(280px, 84vw); margin: 0 auto; text-align: center; }
.packwrap { position: relative; }

.packbig {
position: relative; aspect-ratio: 5 / 7; border-radius: 16px; overflow: hidden;
cursor: grab; touch-action: none;
animation: packfloat 3.4s ease-in-out infinite;
}
@keyframes packfloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.pack-half {
position: absolute; left: 0; width: 100%; height: 50.5%; overflow: hidden;
background-repeat: no-repeat; background-size: 100% 200%;
}
.pack-top { top: 0; background-position: center top; }
.pack-bottom { bottom: 0; background-position: center bottom; }
.pack-tear { position: absolute; top: 50%; left: 0; right: 0; height: 3px; z-index: 3; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .5), transparent); }
.pack-glow {
position: absolute; inset: -8%; z-index: 1; pointer-events: none;
background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .28) 50%, transparent 70%);
animation: packshine 3.2s linear infinite;
}
@keyframes packshine { from { transform: translateX(-70%); } to { transform: translateX(70%); } }

.packwrap.tearing .packbig { animation: none; }
.packwrap.tearing .pack-top { animation: flytop 1.1s cubic-bezier(.3, .5, .4, 1) forwards; }
.packwrap.tearing .pack-bottom { animation: fallbottom 1.1s cubic-bezier(.3, .5, .4, 1) forwards; }
@keyframes flytop { to { transform: translateY(-130%) rotate(14deg); opacity: 0; } }
@keyframes fallbottom { to { transform: translateY(130%) rotate(-10deg); opacity: 0; } }
.packwrap.tearing::after {
content: ""; position: absolute; inset: 40% -10%; z-index: 4; pointer-events: none;
background: radial-gradient(ellipse, rgba(255, 255, 255, .95), rgba(255, 213, 79, .5) 55%, transparent 75%);
animation: tearflash 1s ease-out forwards;
}
@keyframes tearflash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: 0; } }

.slide-wrap { position: absolute; top: 46%; left: 0; right: 0; z-index: 5; padding: 0 14px; }
.slide-track {
position: relative; height: 56px; border-radius: 999px;
background: rgba(8, 11, 17, .72); border: 1px solid rgba(255, 255, 255, .25);
display: flex; align-items: center; justify-content: center;
transition: box-shadow .2s ease, background .2s ease;
}
.slide-track.armed { background: rgba(38, 166, 154, .35); box-shadow: 0 0 22px rgba(105, 240, 174, .8); }
.slide-track.nudge { animation: shake .5s ease; }
.slide-knob {
position: absolute; left: 6px; top: 6px; width: 44px; height: 44px; border-radius: 50%;
display: flex; align-items: center; justify-content: center;
background: linear-gradient(135deg, #4dd0e1, #7c4dff); color: #fff;
font-weight: 900; font-size: 1.1rem; cursor: grab; touch-action: none;
box-shadow: 0 3px 10px rgba(0, 0, 0, .6);
transition: transform .12s ease;
}
.slide-knob.dragging { transform: scale(1.12); cursor: grabbing; }
.slide-hint { font-size: .78rem; font-weight: 700; color: rgba(232, 236, 244, .85); pointer-events: none; }

.reveal-zone { margin-top: 14px; width: 100%; display: flex; flex-direction: column; align-items: center; }
.reveal-grid {
display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
margin: 12px 0; width: 100%; max-width: 640px;
}
.reveal-cell { width: min(170px, 46%); perspective: 800px; cursor: pointer; }
.flip-inner { position: relative; width: 100%; aspect-ratio: 5 / 7; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3, 1.2, .4, 1); }
.reveal-cell.flipped .flip-inner { transform: rotateY(180deg); }
.flip-back, .flip-front {
position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
border-radius: 11px; overflow: hidden;
}
.flip-back {
display: flex; align-items: center; justify-content: center;
background: linear-gradient(160deg, #1a2133, #0d1119);
border: 2px solid rgba(124, 77, 255, .5);
}
.flip-back .qmark { font-size: 1.8rem; font-weight: 900; color: rgba(179, 157, 255, .9); }
.flip-front { transform: rotateY(180deg); }
.reveal-cell.dramatic { animation: dramatic .8s ease; }
@keyframes dramatic {
0%, 100% { transform: scale(1); filter: brightness(1); }
30% { transform: scale(1.12); filter: brightness(1.7) saturate(1.4); }
60% { transform: scale(1.04); filter: brightness(1.25); }
}
.summary {
margin: 12px 0; padding: 12px 16px; border-radius: 14px; text-align: center;
background: rgba(16, 21, 33, .85); border: 1px solid rgba(105, 240, 174, .3);
}

.modal.end-modal { grid-template-columns: 1fr; text-align: center; }
.modal.end-modal h3 { font-size: 1.25rem; margin: 4px 0 8px; }
.modal.end-modal p { color: #aeb9cc; line-height: 1.45; margin: 0 0 14px; }
.modal.end-modal .btn { margin: 0 auto; }
.modal-hero { position: relative; height: 176px; margin: 0 0 10px; border-radius: 12px; overflow: hidden; background: #0d1119; display: flex; align-items: center; justify-content: center; }
.modal-hero .art-img { width: 100%; height: 100%; object-fit: contain; }
.modal-hero .glyph { font-size: 4.4rem; }

/* fiche plein cadre v2 : l'illustration couvre toute la carte verticale */
.modal-hero.full {
height: 300px; border: 2px solid rgba(255, 213, 79, .55); border-radius: 14px;
}
.modal-hero.full .art-img { object-fit: cover; }
.modal-hero.full .glyph { font-size: 6rem; }
.hero-veil {
position: absolute; inset: 0;
background: linear-gradient(180deg, transparent 40%, rgba(8, 11, 17, .92));
}
.hero-text { position: absolute; left: 10px; right: 10px; bottom: 8px; text-align: left; }
.hero-name { font-size: 1.05rem; font-weight: 800; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
.hero-sub { font-size: .74rem; color: #c7cfdd; margin-top: 1px; }
.hero-stats { display: flex; gap: 10px; margin-top: 4px; font-size: .8rem; font-weight: 700; }
.hero-stats .hp { color: #ff8a9e; }
.hero-stats .mana { color: #b39dff; }
.hero-stats .atk { color: #e8ecf4; }
@media (max-width: 639px) { .modal-hero.full { height: 240px; } }

.in-team {
position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 4;
font-size: .58rem; font-weight: 800; white-space: nowrap;
padding: 1px 7px; border-radius: 999px;
color: #ffd54f; background: rgba(8, 11, 17, .85); border: 1px solid rgba(255, 213, 79, .45);
}
.feed-note { font-size: .72rem; margin: 2px 0 6px; }

.dungeon-grid { display: grid; grid-template-columns: 1fr; gap: 16px; margin: 14px 0; }
.dungeon-card {

background: rgba(16, 21, 33, .8); border: 1px solid var(--dcolor, rgba(79, 195, 247, .4));

.dungeon-art { flex: 0 0 120px; aspect-ratio: 5 / 7; border-radius: 12px; overflow: hidden; }

.dungeon-body { flex: 1; min-width: 0; }

.dungeon-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }

.checkpoint-btn { background: rgba(26, 34, 51, .9); }

.hero {
margin: 16px 0; padding: 26px 20px; border-radius: 22px; text-align: center;
background: linear-gradient(180deg, rgba(38, 166, 154, .13), rgba(124, 77, 255, .13)), rgba(13, 17, 24, .8);
border: 1px solid rgba(77, 208, 225, .25);

.hero-inner { max-width: 520px; margin: 0 auto; }
.hero-glyph { font-size: 3rem; margin-bottom: 8px; filter: drop-shadow(0 4px 18px rgba(77, 208, 225, .6)); }
.hero h2 { font-size: 1.45rem; }
.steps { text-align: left; margin: 14px auto; max-width: 460px; padding-left: 22px; display: grid; gap: 8px; }
.home-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0; }
.stat { padding: 10px 6px; border-radius: 12px; background: rgba(8, 11, 17, .55); border: 1px solid rgba(255, 255, 255, .07); }
.stat b { display: block; font-size: 1.15rem; }
.stat span { font-size: .68rem; }
.home-team { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 10px 0; }
.home-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 14px 0 8px; }

.toast-host {
position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 90;
display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none;

.toast {

}

.bulkwrap { padding: 26px 0 40px; }
.bulk-stack { position: relative; width: min(240px, 62vw); margin: 0 auto; }
.bulk-pack {

position: absolute; top: 0; left: 0;
transform: translate(calc(var(--i) * 9px), calc(var(--i) * -7px)) rotate(calc(var(--i) * 1.6deg));

}
.bulk-count {

// src/validate.js : le contrat de donnees (spec section 4), messages en francais
function validate(data, errors) {
  const push = (msg, ref) => errors.push(`${msg} (${ref})`);
  const cards = [...(data.cards ?? []), ...(data.monsters ?? [])];
  const ids = new Set(cards.map((c) => c.id));
  if (ids.size !== cards.length) push('des cartes partagent le meme id', 'EXI-DATA-3');
  // charte des nommees : une nommee (nom complet "prenom, titre") = un meme personnage sur
  // toute sa lignee. Le nom complet des nommees doit donc etre unique (arbitrage 10/11/2026) ;
  // les prenoms repetes a titres differents (deux branches d'une meme lignee) et les titres
  // generiques sans prenom restent hors regle.
  const nomsComplets = new Map();
  for (const c of cards) {
    if (typeof c.name !== 'string' || !c.name.includes(',')) continue;
    if (nomsComplets.has(c.name)) push(`deux cartes portent le meme nom de nommee : ${c.name} (${nomsComplets.get(c.name)} et ${c.id})`, 'EXI-DATA-3');
    else nomsComplets.set(c.name, c.id);
  }
  for (const m of data.monsters ?? []) {
    for (const s of m.spells ?? []) {
      if (!s.nom && !s.name) push(`le monstre ${m.id} porte un sort sans nom`, 'EXI-DATA-1');
    }
  }
  const cardIds = new Set((data.cards ?? []).map((c) => c.id));
  const monsterIds = new Set((data.monsters ?? []).map((m) => m.id));
  const allIds = new Set([...cardIds, ...monsterIds]);
  for (const c of data.cards ?? []) {
    if (c.family && !(data.families ?? {})[c.family]) {
      push(`la carte ${c.id} reference la famille inconnue ${c.family}`, 'EXI-DATA-1');
    }
  }
  for (const [fam, f] of Object.entries(data.families ?? {})) {
    for (const step of [...(f.steps ?? []), ...(f.future ?? [])]) {
      if (!cardIds.has(step)) push(`la famille ${fam} reference la carte inconnue ${step}`, 'EXI-DATA-1');
    }
  }
  for (const [from, choices] of Object.entries(data.evolutions ?? {})) {
    if (!allIds.has(from)) push(`l'evolution depuis ${from} part d'une carte inconnue`, 'EXI-DATA-1');
    for (const ch of choices ?? []) {
      if (!allIds.has(ch.to)) push(`l'evolution de ${from} mene a la carte inconnue ${ch.to}`, 'EXI-DATA-1');
    }
  }
  const dungeonIds = new Set([...(data.dungeons ?? []).map((d) => d.id), ...Object.keys(data['monster-families'] ?? {})]);
  for (const m of data.monsters ?? []) {
    if (m.dungeon && !dungeonIds.has(m.dungeon)) {
      push(`le monstre ${m.id} appartient au donjon inconnu ${m.dungeon}`, 'EXI-DATA-1');
    }
  }
  for (const [from, to] of Object.entries(data['solo-steps'] ?? {})) {
    if (!allIds.has(from)) push(`le solo-step depuis ${from} part d'une carte inconnue`, 'EXI-DATA-1');
    if (!allIds.has(to)) push(`le solo-step de ${from} mene a la carte inconnue ${to}`, 'EXI-DATA-1');
  }
  for (const [biome, fams] of Object.entries(data['monster-families'] ?? {})) {
    if (!dungeonIds.has(biome)) push(`les familles de monstres du biome inconnu ${biome}`, 'EXI-DATA-1');
    for (const fam of fams ?? []) {
      const entrees = [...(fam.lines ?? []), ...(fam.side ?? [])].map((l) => (Array.isArray(l) ? l : [l]));
      for (const line of entrees) {
        for (const id of [...line, fam.mythic].filter(Boolean)) {
          if (!monsterIds.has(id)) push(`la famille ${fam.name} reference le monstre inconnu ${id}`, 'EXI-DATA-1');
        }
      }
    }
  }
  // arbres de race (EXI-P1-1) : refs, crans 10/20/30, noms d'éveils uniques, remplace exige disparait
  const nomsEveils = new Set();
  for (const [race, tree] of Object.entries(data.trees ?? {})) {
    for (const [cran, pct] of Object.entries(tree.crans ?? {})) {
      if (![0, 10, 20, 30].includes(pct)) push(`la race ${race} a un cran ${cran} à ${pct} % (attendu 0/10/20/30)`, 'EXI-P1-1');
    }
    for (const ev of tree.eveils ?? []) {
      if (!allIds.has(ev.de)) push(`l'éveil de ${race} part de la carte inconnue ${ev.de}`, 'EXI-P1-1');
      if (!allIds.has(ev.vers)) push(`l'éveil de ${race} mène à la carte inconnue ${ev.vers}`, 'EXI-P1-1');
      const nom = (cards.find((c) => c.id === ev.vers)?.name ?? '') + '|' + ev.de;
      if (nomsEveils.has(nom)) push(`doublon d'éveil ${ev.de} -> ${ev.vers} dans ${race}`, 'EXI-P1-2');
      nomsEveils.add(nom);
      if (ev.effet === 'remplace' && !ev.disparait) push(`l'éveil ${ev.de} -> ${ev.vers} est "remplace" sans disparait`, 'EXI-P1-2');
      if (ev.disparait && !allIds.has(ev.disparait)) push(`l'éveil ${ev.de} -> ${ev.vers} fait disparaître la carte inconnue ${ev.disparait}`, 'EXI-P1-2');
      for (const p of ev.portes ?? []) {
        if (!p.id || !p.nom) push(`la porte d'un éveil de ${race} manque id ou nom`, 'EXI-P1-1');
      }
    }
  }
  // noms de cartes : pas de collision Ange Éveillé / Éveillé du Seuil (EXI-P1-2)
  const noms = (data.cards ?? []).map((c) => c.name);
  if (new Set(noms).size !== noms.length) push('des cartes partagent le meme nom', 'EXI-P1-2');
  // zones (EXI-P1-4, EXI-P4-1, EXI-P4-2) : cadence, drops N, rencontres, récoltes, enseignements
  const gemTiers = new Set(data.engine?.GEM_TIERS ?? []);
  const sortsEcoleIds = new Set((data.grimoire?.ecole ?? []).map((s) => s.id));
  for (const z of data.zones ?? []) {
    if (z.cadence !== 'zone') push(`la zone ${z.id} n'a pas la cadence "zone"`, 'EXI-P4-2');
    if (z.apres !== 'donjon') push(`la zone ${z.id} n'est pas suivie d'un donjon (jamais deux zones consécutives)`, 'EXI-P4-2');
    for (const id of z.poolN ?? []) {
      if (!allIds.has(id)) push(`la zone ${z.id} référence la naissance inconnue ${id}`, 'EXI-P1-4');
    }
    for (const id of z.rencontres ?? []) {
      if (!monsterIds.has(id)) push(`la zone ${z.id} a une rencontre inconnue ${id}`, 'EXI-P4-1');
    }
    for (const tier of z.recoltes?.eclats?.tiers ?? []) {
      if (!gemTiers.has(tier)) push(`la zone ${z.id} récolte un éclat de tier inconnu ${tier}`, 'EXI-P4-1');
    }
    const taux = z.drops?.N;
    if (taux !== undefined && (typeof taux !== 'number' || taux < 0 || taux > 1)) {
      push(`la zone ${z.id} a un taux N invalide (${taux})`, 'EXI-P1-4');
    }
    for (const tauxR of [z.recoltes?.eclats?.taux, z.recoltes?.jetons?.taux]) {
      if (tauxR !== undefined && (typeof tauxR !== 'number' || tauxR < 0 || tauxR > 1)) {
        push(`la zone ${z.id} a un taux de récolte hors bornes (${tauxR})`, 'EXI-P4-1');
      }
    }
    // boucle v2 lot 3 : taux de recrutement naturel calibré par zone, jamais en dur
    const tauxRec = z.recrute?.taux;
    if (tauxRec !== undefined && (typeof tauxRec !== 'number' || tauxRec < 0 || tauxRec > 1)) {
      push(`la zone ${z.id} a un taux de recrue hors bornes (${tauxRec})`, 'EXI-DATA-1');
    }
    for (const e of z.ecolages ?? []) {
      if (!sortsEcoleIds.has(e.sort)) push(`la zone ${z.id} enseigne le sort inconnu ${e.sort}`, 'EXI-P4-1');
      else if (!(data.grimoire.ecole.find((s) => s.id === e.sort)?.crans ?? {})[e.cran]) {
        push(`la zone ${z.id} enseigne le cran inconnu ${e.cran} de ${e.sort}`, 'EXI-P4-1');
      }
    }
  }
  // sorts d'école (EXI-P2-2, ACC-2-1) : école existante, 4 marches ou vide motivé,
  // coûts strictement croissants, taux décroissants quand la largeur monte
  const ecoles = data.schools ?? {};
  const largeurRang = (l) => (l === 'equipe' || l === 'equipe-renforcee' ? 4 : l === 'tous' ? 5 : Number(l) || 0);
  const tousSortsEcole = [...(data.grimoire?.ecole ?? []), ...(data.grimoire?.entrees ?? [])];
  const idsSorts = new Set();
  for (const s of [...tousSortsEcole, ...(data.grimoire?.communs ?? []), ...(data.grimoire?.race ?? []), ...(data.grimoire?.uniques ?? [])]) {
    if (idsSorts.has(s.id)) push(`doublon de sort ${s.id}`, 'EXI-DATA-3');
    idsSorts.add(s.id);
    if (s.ecole && !ecoles[s.ecole]) push(`le sort ${s.id} référence l'école inconnue ${s.ecole}`, 'EXI-P2-1');
  }
  for (const s of data.grimoire?.ecole ?? []) {
    const crans = Object.entries(s.crans ?? {});
    if (crans.length !== 4) push(`le sort ${s.id} n'a pas 4 crans`, 'EXI-P2-2');
    let prevCout = 0, prevTaux = 1, prevLarg = 0;
    for (const [nom, c] of crans) {
      if (c.vide) { if (!c.raison) push(`le cran ${nom} de ${s.id} est vide sans raison`, 'EXI-P2-2'); continue; }
      if (!(c.cout > prevCout)) push(`les coûts du sort ${s.id} ne sont pas strictement croissants (${nom})`, 'EXI-P2-2');
      prevCout = c.cout;
      const larg = largeurRang(c.largeur);
      if (c.taux !== undefined) {
        if (larg > prevLarg && !(c.taux < prevTaux)) push(`les taux de ${s.id} ne baissent pas quand la largeur monte (${nom})`, 'EXI-DATA-4');
        prevTaux = c.taux;
      }
      prevLarg = larg;
    }
  }
  // fusion (EXI-P2-3, EXI-P2-4) : un biome marqué trié couvre 100 % de ses signatures
  for (const [biome, b] of Object.entries(data['fusion-map'] ?? {})) {
    const sigsBiome = [
      ...(data.monsters ?? []).filter((m) => m.dungeon === biome).map((m) => m.id),
      ...(data.cards ?? []).filter((c) => c.biome === biome).map((c) => c.id),
    ];
    if (!b.trie) continue;
    for (const id of sigsBiome) {
      const entry = (b.signatures ?? {})[id];
      if (!entry) { push(`le biome ${biome} est trié mais la signature ${id} n'est pas couverte`, 'EXI-P2-3'); continue; }
      const cible = entry.unique ?? entry.fusion;
      if (!idsSorts.has(cible) && !(data.grimoire?.entrees ?? []).some((e) => e.id === cible)) {
        push(`la signature ${id} fond vers le sort inconnu ${cible}`, 'EXI-P2-3');
      }
    }
  }
  // tri d'homogénéité (T2.7, ACTÉ) : aucun sort strictement dominé au même coût,
  // même école + même rôle, sans particularité (effet/delta), même base de comparaison
  const largRang2 = (l) => (l === 'equipe' || l === 'equipe-renforcee' ? 4 : l === 'tous' ? 5 : Number(l) || 0);
  const plat = [];
  for (const s of data.grimoire?.ecole ?? []) {
    for (const [cran, c] of Object.entries(s.crans ?? {})) {
      if (c.vide) continue;
      plat.push({ id: s.id + ' ' + cran, ecole: s.ecole, role: s.role, cout: c.cout, mult: c.mult ?? 0, taux: c.taux ?? 0, larg: largRang2(c.largeur), fx: s.effet ?? null });
    }
  }
  for (const e of [...(data.grimoire?.entrees ?? []), ...(data.grimoire?.communs ?? []), ...(data.grimoire?.race ?? [])]) {
    plat.push({ id: e.id, ecole: e.ecole, role: e.role, cout: e.cout, mult: e.mult ?? 0, taux: 0, larg: largRang2(e.cible), fx: e.effet ?? null });
  }
  const byKey = new Map();
  for (const s of plat) {
    const k = s.ecole + '|' + s.role + '|' + s.cout;
    if (!byKey.has(k)) byKey.set(k, []);
    byKey.get(k).push(s);
  }
  for (const [k, arr] of byKey) {
    for (const a of arr) for (const b of arr) {
      if (a === b || a.fx || b.fx) continue;
      const aT = a.taux > 0, bT = b.taux > 0;
      if (aT !== bT) continue;
      const pa = aT ? a.taux : a.mult, pb = aT ? b.taux : b.mult;
      if (pa > pb && a.larg >= b.larg) push(`le sort ${b.id} est strictement dominé par ${a.id} au même coût (${k})`, 'EXI-T-3');
    }
  }
  // difficultés (boucle v2 lot 2) : bande de rareté valide et cohérente, boss dans la bande
  const ranks = new Set(Object.keys(data.engine?.RANK ?? {}));
  for (const d of data.difficulties ?? []) {
    const b = d.bande ?? null;
    if (!Array.isArray(b) || b.length !== 2 || !ranks.has(b[0]) || !ranks.has(b[1])) {
      push(`la difficulté ${d.id} a une bande invalide (${JSON.stringify(b)})`, 'EXI-DATA-1');
      continue;
    }
    if (d.minR !== b[0] || d.mobCap !== b[1]) push(`la difficulté ${d.id} : minR/mobCap ne suivent pas la bande`, 'EXI-DATA-1');
    if (!ranks.has(d.boss5) || !ranks.has(d.boss10)) push(`la difficulté ${d.id} a un boss hors rang connu`, 'EXI-DATA-1');
    else if (!(data.engine.RANK[d.boss5] < data.engine.RANK[d.boss10])) push(`la difficulté ${d.id} : boss5 >= boss10`, 'EXI-DATA-1');
  }
  // boucle v2 lot 3 : propositions de départ = 4 novices d'autant de races, tous existants
  for (const id of data.engine?.DEPART_CHOIX ?? []) {
    const c = cardIds.has(id) ? (data.cards ?? []).find((x) => x.id === id) : null;
    if (!c) push(`le départ propose la carte inconnue ${id}`, 'EXI-DATA-1');
    else if (!c.raciale) push(`la proposition de départ ${id} n'est pas une naissance`, 'EXI-DATA-1');
  }
  // équipement (boucle v2 lot 4) : slots valides, arme typée par classe, rareté connue, bonus positif
  const eqIds = new Set();
  const eqSets = new Set(Object.keys(data.equipment?.sets ?? {}));
  const classesConnues = new Set((data.engine?.CLASSES ?? []));
  for (const p of data.equipment?.pieces ?? []) {
    if (eqIds.has(p.id)) push(`doublon de pièce ${p.id}`, 'EXI-DATA-3');
    eqIds.add(p.id);
    if (!['arme', 'armure', 'equipe'].includes(p.slot)) push(`la pièce ${p.id} a un slot invalide (${p.slot})`, 'EXI-DATA-1');
    if (p.slot === 'arme' && !classesConnues.has(p.classe)) push(`l'arme ${p.id} a une classe inconnue (${p.classe})`, 'EXI-DATA-1');
    if (p.slot !== 'arme' && p.classe) push(`la pièce ${p.id} porte une classe hors arme`, 'EXI-DATA-1');
    if (!ranks.has(p.rarity)) push(`la pièce ${p.id} a une rareté inconnue (${p.rarity})`, 'EXI-DATA-1');
    if (p.set && !eqSets.has(p.set)) push(`la pièce ${p.id} référence le set inconnu ${p.set}`, 'EXI-DATA-1');
    if (p.bonus?.stat === 'manaRegen') { if (!(Number.isInteger(p.bonus.n) && p.bonus.n > 0)) push(`la pièce ${p.id} a un bonus mana invalide`, 'EXI-DATA-1'); }
    else if (!(typeof p.bonus?.pct === 'number' && p.bonus.pct > 0)) push(`la pièce ${p.id} a un pourcentage invalide`, 'EXI-DATA-1');
  }
  // zones lot 4 : matériau de zone et matière de boss
  for (const z of data.zones ?? []) {
    if (!z.materiau?.id || !z.materiau?.nom) push(`la zone ${z.id} n'a pas de matériau`, 'EXI-DATA-1');
    else if (!(typeof z.materiau.taux === 'number' && z.materiau.taux >= 0 && z.materiau.taux <= 1)) push(`la zone ${z.id} a un taux de matériau hors bornes`, 'EXI-DATA-1');
    if (!z.matiereBoss?.id || !z.matiereBoss?.nom) push(`la zone ${z.id} n'a pas de matière de boss`, 'EXI-DATA-1');
  }
  // potions (boucle v2 lot 1) : id unique, genre soin/mana, pourcentage et prix valides
  const potionIds = new Set();
  for (const [pid, p] of Object.entries(data.potions ?? {})) {
    if (potionIds.has(p.id ?? pid)) push(`doublon de potion ${p.id ?? pid}`, 'EXI-DATA-3');
    potionIds.add(p.id ?? pid);
    if (p.id !== pid) push(`la potion ${pid} porte un id différent (${p.id})`, 'EXI-DATA-3');
    if (!['soin', 'mana'].includes(p.genre)) push(`la potion ${pid} a un genre invalide (${p.genre})`, 'EXI-DATA-1');
    if (!(typeof p.pct === 'number' && p.pct > 0 && p.pct <= 1)) push(`la potion ${pid} a un pourcentage hors bornes (${p.pct})`, 'EXI-DATA-1');
    if (!(Number.isInteger(p.prix) && p.prix > 0)) push(`la potion ${pid} a un prix invalide (${p.prix})`, 'EXI-DATA-1');
  }
  return errors;
}

// src/engine/stats.js : extrait du monolithe (phase 0, comportement inchange)
let rollFn = Math.random;
function setRoll(fn) { rollFn = fn; }
function roll() { return rollFn(); }

function mulberry32(seed) {
let state = seed | 0;
return function () {
state = (state + 0x6d2b79f5) | 0;
let t = Math.imul(state ^ (state >>> 15), 1 | state);
t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
}

function countTypes(units) {
  const byType = new Map();
  for (const u of units) {
    for (const t of [u.classe, u.element]) {
      if (!byType.has(t)) byType.set(t, new Set());
      byType.get(t).add(u.cardId);
    }
  }
  return byType;
}

function activeTiers(units) {
  const tiers = new Map();
  for (const [type, ids] of countTypes(units)) {
    const n = ids.size;
    if (!SYNERGIES[type]) continue;
    if (n >= PALIERS[1]) tiers.set(type, 2);
    else if (n >= PALIERS[0]) tiers.set(type, 1);
  }
  return tiers;
}

function tierLabel(tier) {
  return tier === 2 ? 'Palier 2' : tier === 1 ? 'Palier 1' : '';
}

const classeMods = (u) => CLASSE_MODS[u && u.classe] || CLASSE_DEFAULT;

function raceOfCard(c) {
  if (!c) return 'humaine';
  if (RACE_DIVINE_IDS.has(c.id)) return 'divine';
  if (RACE_MYSTIQUE_IDS.has(c.id)) return 'mystique';
  if (RACE_MONSTRE_IDS.has(c.id)) return 'monstre';
  if (!c.dungeon) return 'humaine';
  if (RACE_HUMAINE_DUNGEON_IDS.has(c.id)) return 'humaine';
  return 'monstre';
}

function elementMult(atkEl, defEl) {
  if (!atkEl || !defEl) return 1;
  return BEATS[atkEl] === defEl ? 1 + OPP_BONUS : 1;
}

function elementTag(atkEl, defEl) {
  if (!atkEl || !defEl) return null;
  return BEATS[atkEl] === defEl ? 'fort' : null;
}

function cardPower(card, lvl) {
  const st = statsAt(card, lvl, 0);
  const spellsN = (card.spells ?? []).length;
  return (st.atk * M.POWER_ATK_WEIGHT + st.hp * M.POWER_HP_WEIGHT) * (RARITY_POWER[card.rarity] ?? 1) * (1 + M.POWER_SPELL_STEP * Math.max(0, spellsN - 1));
}

function statsAt(card, lvl, asc = 0) {
  const m = 1 + LEVEL_BONUS * ((lvl ?? 1) - 1);
  const a = 1 + (asc ?? 0) / 100;
  return { atk: Math.max(1, Math.round(card.atk * m * a)), hp: Math.max(1, Math.round(card.hp * m * a)) };
}

function monstersOf(dungeonId) {
  return MONSTERS.filter((m) => m.dungeon === dungeonId);
}

function allMonsters() {
  return MONSTERS;
}

function forgeOnly(c) {
  return !!(c.branch || c.evolved);
}

function byId(id) {
  const c = CATALOG.find((c) => c.id === id);
  if (!c) throw new Error(`Carte inconnue : ${id}`);
  return c;
}

function monsterNextLine(id) {
  for (const dk of Object.keys(MONSTER_FAMS)) {
    for (const fam of MONSTER_FAMS[dk]) {
      for (const line of fam.lines) {
        const i = line.indexOf(id);
        if (i >= 0 && i < line.length - 1) return { nextId: line[i + 1], famName: fam.name };
      }
    }
  }
  return null;
}

// mode RPG (phase 3) : stat principale par profil et seuils, en données (EXI-P3-1, EXI-P3-5)
function statPrincipaleOf(classe) {
  return (DATA.engine.profils ?? {})[classe]?.stat ?? 'atk';
}
function statOf(u) {
  const s = statPrincipaleOf(u.classe);
  return u[s] ?? u.atk ?? 1;
}
function seuilOf(u) {
  const s = DATA.engine.seuils ?? {};
  const palier = RANK[u.rarity] ?? 0;
  // T4.5 : seuil de résistance = palier de la cible + moitié de son intelligence (données)
  return (s.parPalier?.[palier] ?? 0) + (s.parCamp?.[u.race] ?? 0) + (u.int ?? 0) * M.SEUIL_PER_INT;
}

// src/engine/spells.js : extrait du monolithe (phase 0, comportement inchange)

// refonte IA lot 2 : avec un contexte (état public : alliés, ennemis), le choix de sort lit la situation
// (soin si un allié est sous le seuil, contrôle/malus sur la menace, burst si un kill est possible,
// sinon le plus efficace au coût) avec hystérésis anti flip-flop. Sans contexte : chemin historique.
function pickSpell(u, ctx = null) {
  u.mana = Math.min(u.manaMax, u.mana + u.manaRegen);
  const affordable = (u.spells ?? []).filter((s) => s.cost <= u.mana);
  if (!affordable.length) return null;
  if (!ctx) {
    let best = null;
    for (const s of affordable) if (!best || s.cost > best.cost) best = s;
    if (u.spells.length > 1) {
      const top = u.spells[u.spells.length - 1];
      if (top.cost > u.mana && top.cost <= u.manaMax && top.cost <= u.mana + 2 * u.manaRegen) {
        return null;
      }
    }
    u.mana -= best.cost;
    return best;
  }
  const foes = (ctx.foes ?? []).filter((f) => f && f.alive);
  const allies = [...((ctx.allies ?? {}).avant ?? []), ...((ctx.allies ?? {}).arriere ?? [])].filter((x) => x && x.alive);
  const stat = statOf(u);
  const seuil = M.SPELL_HEAL_THRESHOLD;
  const hurtAlly = allies.some((a) => a.hp < a.maxHp * seuil);
  const killable = (s) => !!s.mult && foes.some((f) => f.hp <= Math.max(1, Math.round(stat * s.mult)));
  const score = (s) => {
    let sc = ((s.mult ?? 1) / s.cost) * 100;
    if (s.role === 'soin' && hurtAlly) sc += M.SPELL_HEAL_BONUS;
    if ((s.role === 'controle' || s.role === 'malus') && foes.length) sc += M.SPELL_CONTROL_BONUS;
    if (killable(s)) sc += M.SPELL_KILL_BONUS;
    return sc;
  };
  const ranked = affordable
    .map((s) => ({ item: s, score: score(s) }))
    .sort((a, b) => b.score - a.score);
  let best = ranked[0].item;
  const bestScore = ranked[0].score;
  const st = ctx.state ?? null;
  if (st) {
    const last = st.lastSpell ? st.lastSpell[u.uid] : null;
    const prev = last ? affordable.find((s) => s.name === last) : null;
    if (prev && score(prev) >= bestScore - M.SPELL_HYSTERESIS) best = prev;
    // lot 3 : profil de difficulté — une part des choix est volontairement sous-optimale
    const sub = st.iaProfile ? st.iaProfile.suboptimal ?? 0 : 0;
    if (sub > 0 && st.iaRng && ranked.length > 1 && st.iaRng() < sub) {
      best = ranked[1].item;
    }
    st.lastSpell = st.lastSpell ?? {};
    st.lastSpell[u.uid] = best.name;
  }
  if (u.spells.length > 1) {
    const top = u.spells[u.spells.length - 1];
    if (top.cost > u.mana && top.cost <= u.manaMax && top.cost <= u.mana + 2 * u.manaRegen) {
      return null;
    }
  }
  u.mana -= best.cost;
  return best;
}

// retour terrain (10/11) : un sort hostile (role degats/controle/malus ou cible ennemi/zone/tous)
// se resout sur les ennemis, meme lance depuis la ligne support : un sort est un sort
function foeFacingSpell(spell) {
  const sd = spellSideOf(spell);
  return sd === 'enemy' || sd === 'zone' || sd === 'all'

// la frappe simple de la ligne support : stat principale au rendement de la classe,

function strikeFoe(s, foes, mods, events, side, st, targetUid = null) {
  const vivantes = foes.filter((f) => f.alive);
  const t = targetUid != null
    ? (vivantes.find((f) => f.uid === targetUid) ?? vivantes[0])
    : vivantes.reduce((a, b) => (a.hp <= b.hp ? a : b), vivantes[0]);

  const rage = st && st.turn > M.RAGE_TURN ? 1 + M.RAGE_RATE * (st.turn - M.RAGE_TURN) : 1;
  const dodgeT = Math.min(M.DODGE_CAP, (classeMods(t).dodge || 0) + Math.max(0, (s.agi - t.agi)) * M.DODGE_PER_AGI);

function castFoeSpell(s, spell, foes, mods, events, side, st, action = null) {

    ? (vivantes.find((f) => f.uid === anchorUid) ?? vivantes[0])
    : vivantes.reduce((a, b) => (a.hp <= b.hp ? a : b), vivantes[0]);

      const ai = ligne.findIndex((u) => u.uid === anchorUid);

    const dodgeT = Math.min(M.DODGE_CAP, (classeMods(t).dodge || 0) + Math.max(0, (s.agi - t.agi)) * M.DODGE_PER_AGI);
    if (st && st.rng && dodgeT > 0 && st.rng() < dodgeT) {

function applySupport(s, allies, mods, events, side, foes = [], st = null, action = null) {
  
  let spell = null;
  if (action && action.kind === 'pass') {
    s.mana = Math.min(s.manaMax, s.mana + s.manaRegen);
    events.push({ type: 'status', side, targetId: s.uid, kind: 'tactical', value: 'attente' });
    return;
  } else if (action && action.kind === 'attack' && foes.length) {
    // retour terrain : la ligne support frappe aussi (frappe simple, ennemi designe ou plus faible)
    s.mana = Math.min(s.manaMax, s.mana + s.manaRegen);
    strikeFoe(s, foes, mods, events, side, st, action.targetUid ?? null);
    return;
  } else if (action && action.kind === 'basic') {
    s.mana = Math.min(s.manaMax, s.mana + s.manaRegen);
  } else if (action && action.kind === 'cast') {
    s.mana = Math.min(s.manaMax, s.mana + s.manaRegen);
    const cand = (s.spells ?? [])[action.idx ?? 0];
    if (cand && cand.cost <= s.mana) {
      spell = cand;
      s.mana -= cand.cost;
    }
  } else {
    spell = pickSpell(s, { state: st, allies, foes, side });
  }
  if (st && spell && side === 'enemies') st.lastEnemySpell = { name: spell.name, mult: spell.mult, cost: spell.cost, big: !!spell.big };
  // retour terrain : un sort hostile se resout sur les ennemis, quelle que soit la ligne qui le lance
  if (spell && foes.length && foeFacingSpell(spell)) {
    events.push({ type: 'cast', side, sourceId: s.uid, name: spell.name, big: !!spell.big || spell.cost >= 5, fx: 'atk', mana: s.mana });
    castFoeSpell(s, spell, foes, mods, events, side, st, action);
    return;
  }
  // correctifs ciblage lot 3 + refonte IA lot 0 : un sort allié de lignée (soin/boost/bouclier)
  // depuis une carte sans effet se résout par son rôle, comme le T0.2 côté avant — en Tactique
  // (action présent, allié désigné) comme en Auto (soigne le plus blessé, buffer/bouclier l'avant).
  if (spell && !s.effect && !foeFacingSpell(spell)) {
    const sd = spellSideOf(spell);
    const role = spell.role ?? null;
    if ((sd === 'self' || sd === 'ally' || sd === 'team') && (role === 'soin' || role === 'boost' || role === 'bouclier')) {
      const alliesAlive = [...allies.avant, ...allies.arriere].filter((u) => u.alive);
      let t = s;
      if (sd === 'self') t = s;
      else if (action && action.allyUid) t = alliesAlive.find((x) => x.uid === action.allyUid) ?? t;
      else if (role === 'soin') t = [...alliesAlive].sort((a, b) => a.hp - b.hp)[0] ?? s;
      else t = allies.avant.filter((u) => u.alive)[0] ?? alliesAlive[0] ?? s;
      const big = !!spell.big || spell.cost >= 5;
      if (role === 'soin') {
        const amount = Math.min(Math.max(1, Math.round(statOf(s) * (spell.mult ?? 1))), Math.max(0, t.maxHp - t.hp));
        events.push({ type: 'cast', side, sourceId: s.uid, name: spell.name, big, fx: 'heal', mana: s.mana });
        if (amount > 0) {
          t.hp += amount;
          events.push({ type: 'heal', side, sourceId: s.uid, targetId: t.uid, amount, kind: 'special' });
        }
      } else if (role === 'bouclier') {
        const amount = Math.min(Math.round(statOf(s) * (spell.mult ?? 1)), Math.round(t.maxHp * M.HEAL_CAP_RATIO));
        events.push({ type: 'cast', side, sourceId: s.uid, name: spell.name, big, fx: 'atk', mana: s.mana });
        t.shield += amount;
        events.push({ type: 'shield', side, sourceId: s.uid, targetId: t.uid, amount, kind: 'special' });
      } else {
        const value = Math.max(0, (spell.mult ?? 1) - 1);
        events.push({ type: 'cast', side, sourceId: s.uid, name: spell.name, big, fx: 'atk', mana: s.mana });
        t.atkBuff = (t.atkBuff ?? 0) + value;
        events.push({ type: 'buff', side, sourceId: s.uid, targetId: t.uid, kind: 'atk', value, kindTag: 'special' });
      }
      return;
    }

  if (spell) {
    events.push({ type: 'cast', side, sourceId: s.uid, name: spell.name, big: !!spell.big || spell.cost >= 5, fx, mana: s.mana });
  }

  const kind = spell ? 'special' : 'basic';
  const aliveAllies = [...allies.avant, ...allies.arriere].filter((u) => u.alive);
  const hurt = aliveAllies.filter((u) => u.hp < u.maxHp).sort((a, b) => a.hp - b.hp);
  if (action && action.allyUid) {
    const k = hurt.findIndex((u) => u.uid === action.allyUid);
    if (k > 0) hurt.unshift(hurt.splice(k, 1)[0]);
  }
  const n = side === 'team' && mods.dualSupport ? 2 : 1;
  
  
  
  
  
  
  const cap = (t) => Math.round(t.maxHp * M.HEAL_CAP_RATIO);
  const effKind = s.effect ? s.effect.kind : null;
  if (effKind === 'heal') {
    const value = Math.round(s.effect.value * (1 + (side === 'team' ? mods.healPct || 0 : 0)) * mult);
    for (const t of hurt.slice(0, n)) {
      const amount = Math.min(value, t.maxHp - t.hp);

        events.push({ type: 'heal', side, sourceId: s.uid, targetId: t.uid, amount, kind });
        const p = t.linkedTo ? aliveAllies.find((a) => a.uid === t.linkedTo) : null;
        if (p) {

          if (share > 0) {

            events.push({ type: 'heal', side, sourceId: s.uid, targetId: p.uid, amount: share, kind: 'link' });
          }

      }
    }

      events.push({ type: 'buff', side, sourceId: s.uid, targetId: t.uid, kind: 'atk', value, kindTag: kind });
      const p = t.linkedTo ? aliveAllies.find((a) => a.uid === t.linkedTo) : null;
      if (p) {
        p.atkBuff += value * M.LINK_BUFF_SHARE;
        events.push({ type: 'buff', side, sourceId: s.uid, targetId: p.uid, kind: 'atk', value: value * M.LINK_BUFF_SHARE, kindTag: 'link' });
      }
    }
  } else if (effKind === 'shield') {
    const value = Math.round(s.effect.value * mult);
    for (const t of allies.avant.filter((u) => u.alive).slice(0, n)) {
      const amount = Math.min(value, cap(t));
      t.shield += amount;
      events.push({ type: 'shield', side, sourceId: s.uid, targetId: t.uid, amount, kind });
    }
  } else if (effKind === 'stun') {
    if (!spell) return;
    const count = s.effect.count ?? 1;
    for (const t of [...foes].sort((a, b) => b.atk - a.atk).slice(0, count)) {
      t.status.stun = (t.status.stun ?? 0) + 1;
      events.push({ type: 'status', side, sourceId: s.uid, targetId: t.uid, kind: 'stun', value: 1 });
    }
  } else if (effKind === 'slow') {
    if (!spell) return;
    for (const f of foes) {
      f.status.slow = Math.max(f.status.slow ?? 0, 2);
      events.push({ type: 'status', side, sourceId: s.uid, targetId: f.uid, kind: 'slow', value: 2 });
    }
  } else if (effKind === 'dot') {
    if (!spell) return;
    for (const f of foes) {
      f.status.dot = {
        dmg: Math.max(1, Math.round(s.atk * (s.effect.pct ?? M.DOT_EFFECT_DEFAULT) * mult)),
        turns: s.effect.turns ?? 2,

      events.push({ type: 'status', side, sourceId: s.uid, targetId: f.uid, kind: 'dot', value: f.status.dot.dmg });
    }
  } else if (effKind === 'reflect') {
    if (!spell) return;
    for (const t of aliveAllies) {
      t.status.reflect = { pct: s.effect.value ?? M.REFLECT_DEFAULT_PCT, turns: s.effect.turns ?? 2 };
      events.push({ type: 'status', side, sourceId: s.uid, targetId: t.uid, kind: 'reflect', value: t.status.reflect.pct });
    }
  } else if (effKind === 'warcry') {
    if (!spell) return;
    const value = s.effect.value ?? M.WARCRY_DEFAULT;
    for (const t of allies.avant.filter((u) => u.alive)) {
      t.atkBuff += value;
      t.status.dmgRed = { pct: s.effect.red ?? M.DMGRED_DEFAULT, turns: 1 };
      events.push({ type: 'buff', side, sourceId: s.uid, targetId: t.uid, kind: 'atk', value, kindTag: kind });
    }

    if (!spell) return;

  } else if (effKind === 'curse') {
    if (!spell) return;
    for (const f of foes) {
      const value = (s.effect.value ?? M.CURSE_DEFAULT) * (1 + (side === 'team' ? mods.cursePct || 0 : 0)) * (f.boss ? M.CURSE_BOSS_FACTOR : 1);
      f.status.curse = { value, turns: s.effect.turns ?? 2 };
      events.push({ type: 'status', side, sourceId: s.uid, targetId: f.uid, kind: 'curse', value: Math.round(value * 100) / 100 });
    }
  } else if (effKind === 'revive') {
    if (!spell) return;
    const dead = [...allies.avant, ...allies.arriere].filter((u) => !u.alive && !(u.status && u.status.reviving));

      events.push({ type: 'status', side, sourceId: s.uid, targetId: a.uid, kind: 'link', value: b.uid });

// grimoire à crans (phase 2) : la résolution lit les données, jamais de sort en dur
function getSchoolSpell(spellId) {
  return (DATA.grimoire?.ecole ?? []).find((s) => s.id === spellId) ?? null;
}
function getEntree(spellId) {
  return (DATA.grimoire?.entrees ?? []).find((s) => s.id === spellId) ?? null;
}
function getSpellDef(spellId) {
  return getSchoolSpell(spellId) ?? getEntree(spellId)
    ?? (DATA.grimoire?.communs ?? []).find((s) => s.id === spellId)
    ?? (DATA.grimoire?.race ?? []).find((s) => s.id === spellId)
    ?? (DATA.grimoire?.uniques ?? []).find((s) => s.id === spellId) ?? null;
}
function cranOf(spellId, cran) {
  const s = getSchoolSpell(spellId);

}

// ou {sort, unique} ; il se r\u00e9sout ici en fiche compl\u00e8te (nom, co\u00fbt, mult, taux, cible) pour l'affichage
// et le moteur. L'entr\u00e9e brute reste en sauvegarde : la r\u00e9solution est sans perte et idempotente.
function resolveSpellEntry(sp) {
  if (!sp) return null;
  if (typeof sp.name === 'string') return sp;
  if (typeof sp.sort !== 'string') return null;
  const def = getSpellDef(sp.sort);
  if (!def) return null;
  const c = def.crans
    ? (sp.cran != null ? (def.crans[sp.cran] ?? null) : (Object.values(def.crans).find((x) => !x.vide) ?? null))
    : def;
  if (!c || c.vide) return null;
  const larg = c.largeur ?? def.largeur ?? 1;
  const cible = typeof def.cible === 'string' && def.cible
    ? def.cible
    : (def.role === 'degats' || def.role === 'controle' || def.role === 'malus')
      ? (Number(larg) === 5 ? 'tous les ennemis' : Number(larg) === 3 ? 'zone' : Number(larg) === 2 ? '2 ennemis' : '1 ennemi')
      : (larg === 'equipe' || larg === 'equipe-renforcee' ? 'l\u2019\u00e9quipe' : '1 alli\u00e9');
  return {
    name: def.nom,
    cost: c.cout ?? def.cout ?? 1,
    mult: c.mult ?? def.mult ?? null,
    taux: c.taux ?? def.taux ?? null,
    tours: c.tours ?? def.tours ?? null,
    role: def.role,
    ecole: def.ecole,
    cible,
    desc: c.desc ?? def.desc ?? '',
    cat: sp.unique ? 'unique' : 'ecole',
    sort: sp.sort,
    ...(sp.cran != null ? { cran: sp.cran } : {}),
    ...(larg != null ? { largeur: larg } : {}),

// cle d'unicite d'un sort pour dédoublonner : nom résolu, sinon id de sort + cran
function spellKeyOf(sp) {
  if (!sp) return null;
  if (typeof sp.name === 'string') return 'n:' + sp.name;
  if (typeof sp.sort === 'string') return 's:' + sp.sort + ':' + (sp.cran ?? '');
  return null;
}

// correctif terrain : on ne cumule dans acc que les sorts inconnus de la nouvelle forme
// (et pas déjà présents dans acc) — sinon la fusion acc + sorts de la forme ferait des doublons
function unknownSpellsOf(oldSpells, newFormSpells, acc) {
  const known = new Set((newFormSpells ?? []).map(spellKeyOf).filter(Boolean));
  for (const sp of acc ?? []) { const k = spellKeyOf(sp); if (k) known.add(k); }
  return (oldSpells ?? []).filter((sp) => { const k = spellKeyOf(sp); return k != null && !known.has(k); });
}

function largeurCibles(ligne, largeur, choix = null) {
  const n = (largeur === 'equipe' || largeur === 'equipe-renforcee') ? ligne.length : Number(largeur) || 1;
  const vivantes = ligne.filter((u) => u.hp > 0);
  if (n >= vivantes.length) return vivantes;
  if (n === 3) return pickZoneTargets(vivantes, choix);
  return vivantes.slice(0, n);

// castSpell(data, spellId, cran, contexte) : résout largeur, coût, mult, taux depuis les données
function castSpell(data, spellId, cran, contexte = {}) {
  void data;
  const def = getSpellDef(spellId);
  if (!def) throw new Error(`sort inconnu : ${spellId}`);
  const c = def.crans ? def.crans[cran] : def;
  if (!c || c.vide) return null;
  const { lanceur = null, cibles = [], events = [], side = 'enemies' } = contexte;
  const res = { sort: spellId, cran, ecole: def.ecole, role: def.role, cout: c.cout, largeur: c.largeur, mult: c.mult ?? null, taux: c.taux ?? null };
  if (def.role === 'degats' && c.mult) {
    const base = lanceur ? statOf(lanceur) : 1;
    const targets = largeurCibles(cibles, c.largeur, contexte.choix ?? null);
    const dmg = Math.max(1, Math.round(base * c.mult));
    for (const t of targets) {
      events.push({ type: 'attack', sourceId: lanceur?.uid ?? null, targetId: t.uid, amount: dmg, sort: spellId, cran });
      applyDamage(t, dmg, events, side);
    }
    res.cibles = targets.map((t) => t.uid);
    res.degats = dmg;
  }
  if (c.taux !== undefined && typeof contexte.rng === 'function') {
    const targets = largeurCibles(cibles, c.largeur, contexte.choix ?? null);
    for (const t of targets) {

      if (contexte.rng() < c.taux - seuil) {

        t.status.stun = { tours: c.tours ?? 1 };

// la fusion (phase 2) : une signature de monstre se résout en cran ou unique selon fusion-map
function resolveSignature(ownerId) {
