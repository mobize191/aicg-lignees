<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>⚔ Fondations Cards</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
color: #e8ecf4;
background:
radial-gradient(1100px 500px at 80% -10%, rgba(38, 166, 154, .22), transparent 60%),
radial-gradient(900px 500px at -10% 110%, rgba(124, 77, 255, .20), transparent 55%),
radial-gradient(700px 400px at 110% 90%, rgba(52, 168, 83, .10), transparent 55%),
#0b0e14;
min-height: 100vh;
line-height: 1.45;
}
h2 { font-size: 1.25rem; margin: 14px 0 8px; letter-spacing: .02em; }
h3 { font-size: 1.05rem; margin: 12px 0 6px; }
h4 { font-size: .95rem; margin: 12px 0 4px; color: #bfe8ff; }
p { margin: 6px 0; }
a { color: #4dd0e1; text-decoration: none; }
ul { list-style: none; }
.muted { color: #93a0b5; font-size: .84em; }
.vspace { height: 18px; }

header {
position: sticky; top: 0; z-index: 40;
display: flex; align-items: center; justify-content: space-between;
padding: 10px 16px;
background: rgba(10, 14, 22, .92);
border-bottom: 1px solid rgba(77, 208, 225, .22);
backdrop-filter: blur(6px);
}
.brand { font-weight: 800; letter-spacing: .04em; }
.pts-badge {
font-weight: 700; font-size: .85rem; color: #ffd54f;
background: rgba(255, 213, 79, .12);
border: 1px solid rgba(255, 213, 79, .4);
border-radius: 999px; padding: 4px 12px;
}
nav {
position: sticky; top: 45px; z-index: 39;
display: flex; gap: 2px; padding: 6px 6px;
background: rgba(10, 14, 22, .92);
border-bottom: 1px solid rgba(124, 77, 255, .22);
}
nav a {
flex: 1 1 0; padding: 7px 3px; border-radius: 10px; text-align: center;
color: #aeb9cc; font-size: .78rem; font-weight: 600; white-space: nowrap;
}
nav a.on { color: #06131a; background: linear-gradient(135deg, #4dd0e1, #7c4dff); box-shadow: 0 0 12px rgba(77, 208, 225, .45); }
#app { max-width: 760px; margin: 0 auto; padding: 12px 14px 60px; }

.btn {
display: inline-block; cursor: pointer; user-select: none;
padding: 9px 16px; border-radius: 12px; border: 1px solid rgba(77, 208, 225, .35);
background: linear-gradient(180deg, #1a2233, #131927);
color: #cfe9f2; font-weight: 700; font-size: .9rem; text-align: center;
transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: scale(.97); }
.btn:disabled, .btn.off { opacity: .45; cursor: not-allowed; }
.btn.big {
padding: 12px 22px; font-size: 1rem; border: none;
background: linear-gradient(135deg, #ff9f43, #ff6b6b);
color: #1a0c05; box-shadow: 0 4px 18px rgba(255, 122, 51, .35);
}
.btn.gold { background: linear-gradient(135deg, #ffd54f, #ff9f43); color: #241303; border: none; }
.btn.small { padding: 6px 10px; font-size: .8rem; border-radius: 9px; }
.btn.ctrl { padding: 7px 12px; font-size: .8rem; }
.btn-hero {
display: inline-block; padding: 14px 26px; border-radius: 14px;
background: linear-gradient(135deg, #26a69a, #7c4dff);
color: #fff; font-weight: 800; font-size: 1.02rem;
box-shadow: 0 6px 22px rgba(124, 77, 255, .45);
transition: transform .12s ease;
}
.btn-hero:active { transform: scale(.97); }
.btn-link { background: none; border: none; color: #4dd0e1; cursor: pointer; font-size: .85em; text-decoration: underline; padding: 0 4px; }
.end-action { display: block; margin: 14px auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }

.card {
position: relative; width: 100%;
aspect-ratio: 5 / 7;
border-radius: 11px;
background: linear-gradient(180deg, #1a2133, #10151f 60%, #0d1118);
box-shadow: 0 3px 10px rgba(0, 0, 0, .5), inset 0 0 0 1.5px rgba(255, 255, 255, .06);
border: 2px solid #4a5468;
overflow: hidden;
display: flex; flex-direction: column;
transition: transform .15s ease, box-shadow .15s ease, filter .2s ease;
}

.card.o-Feu { border-color: #ff7043; }
.card.o-Eau { border-color: #4fc3f7; }
.card.o-Terre { border-color: #66bb6a; }
.card.o-Ombre { border-color: #9575cd; }
.card.o-Lumière { border-color: #ffd54f; }

.card.t-Guerrier { box-shadow: 0 3px 10px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255, 138, 101, .35); }
.card.t-Mage { box-shadow: 0 3px 10px rgba(0,0,0,.5), inset 0 0 0 3px rgba(77, 208, 225, .35); }
.card.t-Prêtre { box-shadow: 0 3px 10px rgba(0,0,0,.5), inset 0 0 0 3px rgba(174, 213, 129, .35); }
.card.t-Assassin { box-shadow: 0 3px 10px rgba(0,0,0,.5), inset 0 0 0 3px rgba(206, 147, 216, .35); }

.card.r-C { filter: saturate(.92); }

.card.r-UC { box-shadow: 0 3px 12px rgba(97, 214, 145, .28), inset 0 0 0 1.5px rgba(140, 240, 180, .08); }
.card.r-R { box-shadow: 0 3px 12px rgba(63, 140, 255, .30), inset 0 0 0 1.5px rgba(255,255,255,.06); border-width: 2px; }
.card.r-SR { box-shadow: 0 4px 16px rgba(176, 107, 255, .42), inset 0 0 0 1.5px rgba(255,255,255,.08); }
.card.r-UR { box-shadow: 0 5px 20px rgba(255, 159, 67, .5), inset 0 0 0 1.5px rgba(255,220,150,.25); }
.card.r-L {
border-color: #ffd54f;
box-shadow: 0 6px 24px rgba(255, 213, 79, .55), inset 0 0 22px rgba(255, 213, 79, .18);
animation: holo 3.2s ease-in-out infinite;
}
@keyframes holo {
0%, 100% { filter: saturate(1) brightness(1); }
50% { filter: saturate(1.25) brightness(1.12); }
}
.art { position: relative; height: 56%; overflow: hidden; background: #0d1119; }
.art-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.glyph {
position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
font-size: 2.1rem; opacity: .92;
background: radial-gradient(circle at 50% 40%, rgba(77, 208, 225, .14), transparent 70%);
}
.rar-chip {
position: absolute; top: 5px; left: 5px; z-index: 3;
font-size: .62rem; font-weight: 800; letter-spacing: .06em;
padding: 2px 7px; border-radius: 999px;
background: rgba(8, 11, 17, .82); border: 1px solid rgba(255, 255, 255, .14);
}
.r-C .rar-chip { color: #9aa5b5; }
.r-UC .rar-chip { color: #61d691; }
.r-R .rar-chip { color: #45a3ff; }
.r-SR .rar-chip { color: #b06bff; }
.r-UR .rar-chip { color: #ff9f43; }
.r-L .rar-chip { color: #ffd54f; }
.lvl-chip {
position: absolute; top: 5px; right: 5px; z-index: 3;
font-size: .62rem; font-weight: 800;
padding: 2px 7px; border-radius: 999px;
color: #06131a; background: linear-gradient(135deg, #ffd54f, #ff9f43);
}
.badge {
position: absolute; z-index: 3; font-size: .6rem; font-weight: 800;
padding: 2px 8px; border-radius: 999px;
top: 26px; left: 50%; transform: translateX(-50%);
background: rgba(8, 11, 17, .85); border: 1px solid rgba(255, 255, 255, .16);
}
.badge.boss { color: #241303; background: linear-gradient(135deg, #ffd54f, #ff9f43); border: none; }
.owned-badge {
position: absolute; top: 0; left: 50%; transform: translate(-50%, -50%); z-index: 5;
font-size: .64rem; font-weight: 800;
padding: 2px 8px; border-radius: 999px;
color: #06131a; background: linear-gradient(135deg, #4dd0e1, #26a69a);
box-shadow: 0 2px 8px rgba(0, 0, 0, .5);
}
.cardbody { padding: 5px 7px 2px; text-align: center; }
.name { font-size: .74rem; font-weight: 800; line-height: 1.15; }
.meta { display: flex; justify-content: center; gap: 6px; font-size: .6rem; color: #93a0b5; margin-top: 2px; flex-wrap: wrap; }
/* v0.35 : .role-chip supprim\u00e9 \u2014 fin de la m\u00e9canique support/attaque */
.role-chip-x {
display: inline-block; margin-top: 3px; font-size: .58rem; font-weight: 700;
padding: 1px 7px; border-radius: 999px; border: 1px solid;
}
.cardfoot {
margin-top: auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 3px 7px;
padding: 4px 6px 6px; font-size: .66rem; font-weight: 700;
}
.cardfoot .hp { color: #ff8a9e; }
.cardfoot .sh { color: #40c4ff; }
.cardfoot .mana { color: #b39dff; }

.card.unit-art .art { position: absolute; inset: 0; height: 100%; z-index: 0; }
body.in-combat .card.unit-art .art { filter: brightness(1.12) contrast(1.04); }
.card.unit-art .cardbody {
position: relative; z-index: 2;
background: linear-gradient(180deg, transparent, rgba(8, 11, 17, .88) 45%);
padding-top: 30px;
}
.card.unit-art .cardfoot {
position: relative; z-index: 2;
background: linear-gradient(180deg, rgba(8, 11, 17, .55), rgba(8, 11, 17, .95));
}

.card.battle .meta { display: none; }
.card.battle .name { font-size: .7rem; }
.card.battle.unit-art .cardbody {
margin-top: auto;
background: linear-gradient(180deg, transparent, rgba(8, 11, 17, .92));
padding-top: 14px;
}
.card.battle.unit-art .cardfoot { margin-top: 0; }
.card.big { width: 190px; }
.card.locked, .card.mystery { filter: grayscale(1) brightness(.6); }
.unit.ko .card { filter: grayscale(1) brightness(.45); opacity: .55; transform: scale(.96); }
.dragged { opacity: .45; }

#controls {
display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
margin: 10px 0; padding: 8px; border-radius: 12px;
background: rgba(16, 21, 33, .75); border: 1px solid rgba(77, 208, 225, .18);
}
#controls label { font-size: .8rem; color: #93a0b5; display: flex; gap: 6px; align-items: center; }
#controls input { width: 64px; background: #0d1119; color: #e8ecf4; border: 1px solid #2a3242; border-radius: 8px; padding: 5px 7px; }
#controls #fight { margin-left: auto; }
.enemy-zone, .team-zone { margin: 8px 0; }
.enemy-zone { border-radius: 14px; padding: 6px; background: rgba(124, 77, 255, .05); }
.team-zone { border-radius: 14px; padding: 6px; background: rgba(38, 166, 154, .07); }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 6px 0; min-height: 60px; }
.unit { flex: 0 0 auto; width: clamp(84px, 16vw, 112px); position: relative; cursor: pointer; }
.unit .card { width: 100%; }
.unit.boss { flex: 0 0 auto; width: clamp(112px, 22vw, 148px); }
.unit.casting { z-index: 5; }
.unit.casting .card { transform: scale(1.08); box-shadow: 0 0 22px rgba(255, 213, 79, .8); }
.unit.targeted .card { box-shadow: 0 0 0 3px #ffd54f, 0 0 18px rgba(255, 213, 79, .6); }
.unit.targeted::after {
content: "🎯"; position: absolute; top: -8px; left: -6px; z-index: 6;
font-size: .95rem; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .6));
animation: bop .6s ease infinite alternate;
}
@keyframes bop { from { transform: translateY(0); } to { transform: translateY(-3px); } }

.float {
position: absolute; top: 12%; left: 50%; transform: translateX(-50%); z-index: 8;
font-size: 1.15rem; font-weight: 900; pointer-events: none; white-space: nowrap;
text-shadow: 0 2px 6px rgba(0, 0, 0, .85);
animation: floatup 1.5s ease-out forwards;
}
.float.dmg { color: #ff5252; }
.float.heal { color: #69f0ae; }
.float.buff { color: #ffd54f; }
.float.shield { color: #40c4ff; }
.float.block { color: #40c4ff; font-size: 1rem; }
.float.cast { color: #b39dff; }
.float.fx-special { font-size: 1.5rem; color: #ffe082; text-shadow: 0 0 14px rgba(255, 213, 79, .95), 0 2px 6px rgba(0,0,0,.85); }
@keyframes floatup {
0% { opacity: 0; transform: translateX(-50%) translateY(6px) scale(.7); }
12% { opacity: 1; transform: translateX(-50%) translateY(-4px) scale(1.15); }
30% { transform: translateX(-50%) translateY(-12px) scale(1); }
100% { opacity: 0; transform: translateX(-50%) translateY(-52px) scale(1); }
}
.cast-tag {
position: absolute; top: -22px; left: 50%; transform: translateX(-50%); z-index: 9;
font-size: .68rem; font-weight: 800; white-space: nowrap; pointer-events: none;
color: #06131a; background: linear-gradient(135deg, #b39dff, #4dd0e1);
padding: 3px 10px; border-radius: 999px;
box-shadow: 0 3px 10px rgba(0, 0, 0, .6);
animation: tagin .25s ease;
}
@keyframes tagin { from { opacity: 0; transform: translateX(-50%) translateY(6px); } }
.burst {
position: absolute; inset: -6px; z-index: 7; pointer-events: none;
border: 3px solid rgba(255, 213, 79, .9); border-radius: 50%;
animation: burst .7s ease-out forwards;
}
@keyframes burst { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
.shake { animation: shake .26s ease; }
.shake-big { animation: shake-big .38s ease; }
@keyframes shake { 25% { transform: translateX(-5px); } 50% { transform: translateX(5px); } 75% { transform: translateX(-3px); } }
@keyframes shake-big { 20% { transform: translate(-9px, 2px); } 40% { transform: translate(9px, -2px); } 60% { transform: translate(-6px, 1px); } 80% { transform: translate(6px, -1px); } }
.zone-flash { animation: zoneflash .65s ease; }
@keyframes zoneflash { 0% { background: rgba(255, 82, 82, .35); } 100% { background: transparent; } }
#log { min-height: 30px; font-size: .82rem; margin: 8px 0; }
.logline.win { color: #69f0ae; }
.logline.lose { color: #ff8a9e; }

.banner {
position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); z-index: 60;
font-size: 1.35rem; font-weight: 900; text-align: center; max-width: 88vw;
padding: 16px 26px; border-radius: 16px; pointer-events: none;
animation: bannerin .45s cubic-bezier(.2, 1.4, .4, 1);
}
.banner.win { color: #06131a; background: linear-gradient(135deg, #69f0ae, #26a69a); box-shadow: 0 8px 30px rgba(38, 166, 154, .6); }
.banner.lose { color: #1a0505; background: linear-gradient(135deg, #ff8a9e, #ff5252); box-shadow: 0 8px 30px rgba(255, 82, 82, .6); }
.banner.out { animation: bannerout .8s ease forwards; }
@keyframes bannerin { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }
@keyframes bannerout { to { opacity: 0; transform: translate(-50%, -64%) scale(1.05); } }

.special-overlay {
position: fixed; inset: 0; z-index: 70; pointer-events: none;
display: flex; align-items: flex-start; justify-content: center;
padding-top: 9dvh;
animation: fadein .2s ease;
}
.special-overlay.out { animation: fadeout .35s ease forwards; }
@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
.special-flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,255,255,.5), transparent 60%); animation: sflash .7s ease-out forwards; }
@keyframes sflash { from { opacity: 1; } to { opacity: 0; } }
.special-card {
position: relative; z-index: 2; width: min(330px, 88vw);
display: flex; align-items: center; gap: 10px; text-align: left;
border-radius: 14px; padding: 8px 12px;
background: linear-gradient(180deg, rgba(26, 33, 51, .97), rgba(13, 17, 24, .97));
border: 2px solid rgba(255, 213, 79, .6);
box-shadow: 0 0 40px rgba(255, 213, 79, .3);
animation: specialin .45s cubic-bezier(.2, 1.3, .4, 1);
}
.special-txt { min-width: 0; }
@keyframes specialin { from { transform: scale(.7); opacity: 0; } }
.special-art { position: relative; flex: 0 0 92px; width: 92px; height: 116px; border-radius: 10px; overflow: hidden; background: #0d1119; }
.special-art .glyph { font-size: 4rem; }
.special-title { margin-top: 0; font-size: .66rem; font-weight: 800; letter-spacing: .18em; color: #ffd54f; }
.special-name { font-size: 1.02rem; font-weight: 900; margin-top: 1px; }
.special-owner { margin-top: 1px; font-size: .78rem; color: #93a0b5; }

.line { margin: 14px 0; }
.line .row { justify-content: center; }
.team-switch { display: inline-flex; align-items: center; gap: 10px; margin-left: 6px; vertical-align: middle; }
.team-switch .btn { padding: 3px 12px; }
.slot {
position: relative; flex: 0 1 128px; width: min(128px, calc((100% - 32px) / 5)); aspect-ratio: 5 / 7;
border-radius: 12px; border: 2px dashed rgba(77, 208, 225, .3);
display: flex; align-items: center; justify-content: center;
}
.slot.empty::after { content: "＋"; font-size: 1.4rem; color: rgba(77, 208, 225, .4); }
.slot .card { width: 100%; height: 100%; cursor: grab; }
.slot.empty .card { display: none; }
.syn-panel {
margin: 14px 0; padding: 10px 14px; border-radius: 14px;
background: rgba(16, 21, 33, .8); border: 1px solid rgba(77, 208, 225, .22);
}
.syn { margin: 5px 0; padding: 6px 10px; border-radius: 10px; font-size: .84rem; background: rgba(77, 208, 225, .07); }
.syn.t1 { border-left: 3px solid #4dd0e1; }
.syn.t2 { border-left: 3px solid #ffd54f; background: rgba(255, 213, 79, .08); }
.filters { margin: 10px 0; }
.fgroup { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.chip {
display: inline-block; cursor: pointer; font-size: .76rem; font-weight: 700;
padding: 4px 11px; border-radius: 999px;
background: rgba(26, 34, 51, .9); border: 1px solid rgba(77, 208, 225, .28); color: #aeb9cc;
}
.chip.on { color: #06131a; background: linear-gradient(135deg, #4dd0e1, #26a69a); border-color: transparent; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 10px; margin: 10px 0 18px; }
.gcell { position: relative; cursor: pointer; }
.gcell .card { cursor: pointer; }
.empty-collection { padding: 18px; text-align: center; }

.fam {
margin: 14px 0; padding: 12px 14px; border-radius: 16px;
background: rgba(16, 21, 33, .72); border: 1px solid rgba(124, 77, 255, .18);
}
.race-band {
margin: 26px 0 6px; padding: 8px 14px; border-radius: 12px; font-size: 1.05rem;
background: linear-gradient(90deg, rgba(124, 77, 255, .22), rgba(16, 21, 33, .6));
border: 1px solid rgba(124, 77, 255, .35);
}
.fam-chain { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 8px; margin: 10px 0; }
.fam-card { position: relative; width: 96px; flex: 0 0 auto; cursor: pointer; }
.fam-card.mystery {
aspect-ratio: 5 / 7; border-radius: 11px; border: 2px dashed rgba(147, 160, 181, .35);
background: linear-gradient(180deg, #141a29, #0d1119);
display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
padding: 6px; text-align: center; cursor: default;
}
.mystery-glyph { font-size: 1.7rem; filter: grayscale(1) brightness(.75); }
.mystery-rar { font-size: .62rem; font-weight: 800; color: #9aa5b5; letter-spacing: .06em; }
.mystery-name { font-size: .62rem; color: #93a0b5; line-height: 1.2; }
.fam-hint { font-size: .8em; }
.evo-arrow { color: #93a0b5; font-weight: 900; font-size: 1rem; }

.modal-overlay {
position: fixed; inset: 0; z-index: 80; padding: 16px;
display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
background: rgba(5, 7, 12, .78); backdrop-filter: blur(4px);
animation: fadein .18s ease;
}
.modal {
position: relative; width: min(660px, 100%); margin: 5vh auto 40px;
display: grid; grid-template-columns: 232px 1fr; gap: 16px;
border-radius: 18px; padding: 18px;
background: linear-gradient(180deg, #161d2c, #0e131d);
border: 1px solid rgba(77, 208, 225, .25);
box-shadow: 0 20px 60px rgba(0, 0, 0, .7);
}
.modal-syn { grid-template-columns: 1fr; }
.modal-close {
position: fixed; top: 10px; right: 10px; z-index: 95;
width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer;
background: rgba(26, 34, 51, .95); color: #ff8a9e; font-size: .95rem; font-weight: 800;
}
.modal-card { display: flex; justify-content: center; align-items: flex-start; }
.modal-info { min-width: 0; padding-right: 10px; }

.modal-info .lvl-chip { position: static; display: inline-block; vertical-align: middle; margin-left: 6px; }
.statline { margin: 6px 0; }
.spells { margin: 6px 0; }
.spell {
padding: 7px 10px; margin: 6px 0; border-radius: 10px;
background: rgba(77, 208, 225, .07); border-left: 3px solid #4dd0e1;
display: flex; flex-direction: column; gap: 1px;
}
.spell b { font-size: .88rem; }
.spell-desc { font-size: .8em; }
.spell-cat { font-size: .72em; border: 1px solid #4dd0e144; border-radius: 8px; padding: 1px 6px; color: #4dd0e1; vertical-align: middle; white-space: nowrap; }
.modal-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.modal-feedback { min-height: 1.4em; margin-top: 10px; font-weight: 700; color: #69f0ae; }
.evo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 6px; margin: 8px 0; }
.evo-step {
display: inline-flex; flex-direction: column; align-items: center; gap: 3px;
width: 74px; padding: 6px 4px; border-radius: 12px; cursor: pointer;
background: rgba(26, 34, 51, .8); border: 1px solid rgba(77, 208, 225, .22);
font: inherit; color: inherit;
}
.evo-step.current { border-color: #ffd54f; box-shadow: 0 0 10px rgba(255, 213, 79, .4); }

.act-modal { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 10px 12px 14px; background: rgba(10, 14, 22, .97); border-top: 2px solid rgba(77, 208, 225, .35); border-radius: 16px 16px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, .5); }
.act-head { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
.act-art { position: relative; flex: 0 0 76px; width: 76px; height: 95px; border-radius: 10px; overflow: hidden; background: #0d1119; display: flex; align-items: center; justify-content: center; }
.act-art .art-img { width: 100%; height: 100%; object-fit: contain; }
.act-art .glyph { font-size: 2.4rem; }
.act-title { font-size: .92rem; line-height: 1.3; }
.act-stats { font-size: .8rem; color: #9fd8a8; }
.act-zone { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
.act-lab { width: 100%; margin: 0 0 2px; font-size: .82rem; }
.act-target { max-width: 46vw; }
.tac-btn.off { opacity: .45; }
.tac-head { font-weight: 600; color: #d9b45a; margin: 4px 0; }
.tac-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid rgba(255,255,255,.12); border-radius: 10px; margin: 4px 0; background: rgba(255,255,255,.04); }
.tac-row.armed { border-color: #d9b45a; box-shadow: 0 0 0 1px #d9b45a; }
.tac-name { min-width: 110px; font-weight: 600; font-size: .85rem; }
.tac-acts { display: flex; flex-wrap: wrap; gap: 4px; }
.tac-btn { padding: 4px 8px; font-size: .78rem; }
.tac-btn.on { border-color: #d9b45a; background: rgba(217,180,90,.18); }
.tac-target { margin-left: auto; font-size: .8rem; color: #9fd8a8; }
.tac-target.armed { color: #d9b45a; font-weight: 700; }

/* ==== v0.44 : le combat tient sur un écran, sans scroll (retour terrain) ==== */
body.in-combat { overflow: hidden; height: 100dvh; display: flex; flex-direction: column; }
body.in-combat header, body.in-combat nav { flex: 0 0 auto; position: static; }
body.in-combat nav.open { position: fixed; top: 55px; left: 0; right: 0; z-index: 60; max-height: 72dvh; overflow-y: auto; background: rgba(10, 14, 22, .98); border-bottom: 1px solid rgba(124, 77, 255, .35); box-shadow: 0 18px 40px rgba(0, 0, 0, .55); }
body.in-combat #app { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; box-sizing: border-box; }
body.in-combat #app > h2 { font-size: .92rem; margin: 0 0 2px; }
body.in-combat #controls { margin: 2px 0; padding: 5px; gap: 4px; }
body.in-combat #controls .btn.ctrl { padding: 4px 8px; font-size: .7rem; }
body.in-combat .enemy-zone, body.in-combat .team-zone { flex: 0 0 auto; }
body.in-combat .row { margin: 2px 0; gap: 6px; min-height: 0; }
body.in-combat .unit { width: clamp(96px, 22vw, 128px); }
body.in-combat .unit.boss { width: clamp(122px, 28vw, 162px); }
body.in-combat .card.battle { aspect-ratio: 5 / 6; }
body.in-combat .card.battle .name { font-size: .62rem; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.in-combat .card.battle .cardbody { padding: 2px 4px 0; }
body.in-combat .card.battle .cardfoot { padding: 2px 4px 4px; font-size: .62rem; gap: 2px 5px; }
body.in-combat .card.battle .rar-chip, body.in-combat .card.battle .lvl-chip, body.in-combat .card.battle .badge { font-size: .55rem; padding: 1px 5px; }
body.in-combat .act-modal { max-height: 56dvh; overflow-y: auto; }
body.in-combat .tac-head { margin: 2px 0; font-size: .8rem; }
body.in-combat .tac-row { padding: 3px 6px; gap: 4px; margin: 3px 0; }
body.in-combat .tac-name { min-width: 78px; font-size: .72rem; }
body.in-combat .tac-btn { padding: 3px 6px; font-size: .68rem; }
body.in-combat #log { min-height: 20px; max-height: 20dvh; overflow: hidden; margin: 4px 0; font-size: .74rem; }

/* v0.42 : la carte du modificateur de run */
.run-mod-card { display: flex; align-items: center; gap: 14px; border: 1px solid #d9b45a; border-radius: 12px; padding: 12px 16px; margin: 10px 0; background: rgba(217,180,90,.08); }
.run-mod-glyph { font-size: 2rem; }

/* ==== v0.33.1 : lisibilite — cartes plus grandes, badge nouvelle carte ==== */
#app { max-width: 840px; }
.slot { flex: 0 1 156px; width: min(156px, calc((100% - 32px) / 5)); }
.grid { grid-template-columns: repeat(auto-fill, minmax(186px, 1fr)); }
.fam-card { width: 118px; }
.cardfoot { font-size: .74rem; }
.forge-card { position: relative; }
.new-badge {
position: absolute; top: 4px; right: 4px; z-index: 5;
background: radial-gradient(circle, #ffd54f, #ff9f43); color: #241303;
border-radius: 999px; width: 22px; height: 22px;
display: flex; align-items: center; justify-content: center;
font-size: .8rem; box-shadow: 0 0 10px rgba(255, 213, 79, .8);
animation: newpulse 1.6s infinite;
}
@keyframes newpulse {
0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(255, 213, 79, .7); }
50% { transform: scale(1.15); box-shadow: 0 0 16px rgba(255, 213, 79, .95); }
}
.filters-box { max-width: 560px; }
/* v0.33.2 : appui long fiable sur mobile (pas de s\u00e9lection/zoom qui annule le pointer) */
.gcell, .slot .card { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.gcell.dimmed { cursor: pointer; }
/* v0.33.2 : r\u00e9v\u00e9lation de carte g\u00e9n\u00e9r\u00e9e (jeton, autel, \u00e9volution) */
.reveal-stage { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin: 18px 0; perspective: 900px; }
.reveal-card { width: 172px; height: 248px; cursor: pointer; border-radius: 12px; transition: box-shadow .5s; }
.reveal-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.2,.8,.3,1); }
.reveal-card.flipped .reveal-inner { transform: rotateY(180deg); }
.reveal-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.reveal-back { background: linear-gradient(150deg, #232a4d, #0d0f1e 60%, #2a1e4a); border: 1px solid #4a5b8f; box-shadow: 0 0 22px rgba(90,120,255,.25); }
.reveal-sigil { font-size: 46px; filter: drop-shadow(0 0 10px rgba(140,170,255,.8)); animation: revealPulse 1.6s ease-in-out infinite; }
.reveal-backlabel { margin-top: 6px; color: #9fb0d8; font-size: 12px; letter-spacing: 2px; }
.reveal-front { transform: rotateY(180deg); }
.reveal-front .card { width: 100%; height: 100%; }
.reveal-card.r-C.flipped { box-shadow: 0 0 26px rgba(160,160,160,.5); }
.reveal-card.r-UC.flipped { box-shadow: 0 0 26px rgba(80,200,120,.5); }
.reveal-card.r-R.flipped { box-shadow: 0 0 26px rgba(80,150,255,.6); }
.reveal-card.r-SR.flipped { box-shadow: 0 0 30px rgba(200,120,255,.65); }
.reveal-card.r-UR.flipped { box-shadow: 0 0 32px rgba(255,190,80,.7); }
.reveal-card.r-L.flipped { box-shadow: 0 0 38px rgba(255,220,120,.9); }
.reveal-card.r-M.flipped { box-shadow: 0 0 42px rgba(255,80,80,.95); }
@keyframes revealPulse { 0%, 100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
.reveal-modal { text-align: center; }
</style>

const index = (arr) => Object.fromEntries((arr ?? []).map((x) => [x.id ?? x.key, x]));
const IDX = {
  cards: index(DATA.cards), monsters: index(DATA.monsters),
  families: Object.fromEntries(Object.entries(DATA.families ?? {})),
  schools: index(DATA.schools), grimoire: index(DATA.grimoire?.spells),
  trees: index(DATA.trees), zones: index(DATA.zones),
};
const getCard = (id) => IDX.cards[id];
const getMonster = (id) => IDX.monsters[id];
const getSpell = (id) => IDX.grimoire[id];
const getSchool = (id) => IDX.schools[id];
const getFamily = (id) => IDX.families[id];
const getTree = (id) => IDX.trees[id];
const getZone = (id) => IDX.zones[id];

// src/validate.js : le contrat de donnees (spec section 4), messages en francais
function validate(data, errors) {
  const push = (msg, ref) => errors.push(`${msg} (${ref})`);
  const cards = [...(data.cards ?? []), ...(data.monsters ?? [])];
  const ids = new Set(cards.map((c) => c.id));
  if (ids.size !== cards.length) push('des cartes partagent le meme id', 'EXI-DATA-3');
  for (const m of data.monsters ?? []) {
    for (const s of m.spells ?? []) {
      if (!s.nom && !s.name) push(`le monstre ${m.id} porte un sort sans nom`, 'EXI-DATA-1');
    }
  }
  const cardIds = new Set((data.cards ?? []).map((c) => c.id));
  const monsterIds = new Set((data.monsters ?? []).map((m) => m.id));
  const allIds = new Set([...cardIds, ...monsterIds]);
  for (const c of data.cards ?? []) {
    if (c.family && !(data.families ?? {})[c.family]) {
      push(`la carte ${c.id} reference la famille inconnue ${c.family}`, 'EXI-DATA-1');
    }
  }
  for (const [fam, f] of Object.entries(data.families ?? {})) {
    for (const step of [...(f.steps ?? []), ...(f.future ?? [])]) {
      if (!cardIds.has(step)) push(`la famille ${fam} reference la carte inconnue ${step}`, 'EXI-DATA-1');
    }
  }
  for (const [from, choices] of Object.entries(data.evolutions ?? {})) {
    if (!allIds.has(from)) push(`l'evolution depuis ${from} part d'une carte inconnue`, 'EXI-DATA-1');
    for (const ch of choices ?? []) {
      if (!allIds.has(ch.to)) push(`l'evolution de ${from} mene a la carte inconnue ${ch.to}`, 'EXI-DATA-1');
    }
  }
  const dungeonIds = new Set([...(data.dungeons ?? []).map((d) => d.id), ...Object.keys(data['monster-families'] ?? {})]);
  for (const m of data.monsters ?? []) {
    if (m.dungeon && !dungeonIds.has(m.dungeon)) {
      push(`le monstre ${m.id} appartient au donjon inconnu ${m.dungeon}`, 'EXI-DATA-1');
    }
  }
  for (const [from, to] of Object.entries(data['solo-steps'] ?? {})) {
    if (!allIds.has(from)) push(`le solo-step depuis ${from} part d'une carte inconnue`, 'EXI-DATA-1');
    if (!allIds.has(to)) push(`le solo-step de ${from} mene a la carte inconnue ${to}`, 'EXI-DATA-1');
  }
  for (const [biome, fams] of Object.entries(data['monster-families'] ?? {})) {
    if (!dungeonIds.has(biome)) push(`les familles de monstres du biome inconnu ${biome}`, 'EXI-DATA-1');
    for (const fam of fams ?? []) {
      const entrees = [...(fam.lines ?? []), ...(fam.side ?? [])].map((l) => (Array.isArray(l) ? l : [l]));
      for (const line of entrees) {
        for (const id of [...line, fam.mythic].filter(Boolean)) {
          if (!monsterIds.has(id)) push(`la famille ${fam.name} reference le monstre inconnu ${id}`, 'EXI-DATA-1');
        }
      }
    }
  }
  return errors;
}
