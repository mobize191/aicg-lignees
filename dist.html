// src/validate.js : le contrat de donnees (spec section 4), messages en francais
function validate(data, errors) {
  const push = (msg, ref) => errors.push(`${msg} (${ref})`);
  const cards = [...(data.cards ?? []), ...(data.monsters ?? [])];
  const ids = new Set(cards.map((c) => c.id));
  if (ids.size !== cards.length) push('des cartes partagent le meme id', 'EXI-DATA-3');
  for (const m of data.monsters ?? []) {
    for (const s of m.spells ?? []) {
      if (!s.nom && !s.name) push(`le monstre ${m.id} porte un sort sans nom`, 'EXI-DATA-1');
    }
  }
  const cardIds = new Set((data.cards ?? []).map((c) => c.id));
  const monsterIds = new Set((data.monsters ?? []).map((m) => m.id));
  const allIds = new Set([...cardIds, ...monsterIds]);
  for (const c of data.cards ?? []) {
    if (c.family && !(data.families ?? {})[c.family]) {
      push(`la carte ${c.id} reference la famille inconnue ${c.family}`, 'EXI-DATA-1');
    }
  }
  for (const [fam, f] of Object.entries(data.families ?? {})) {
    for (const step of [...(f.steps ?? []), ...(f.future ?? [])]) {
      if (!cardIds.has(step)) push(`la famille ${fam} reference la carte inconnue ${step}`, 'EXI-DATA-1');
    }
  }
  for (const [from, choices] of Object.entries(data.evolutions ?? {})) {
    if (!allIds.has(from)) push(`l'evolution depuis ${from} part d'une carte inconnue`, 'EXI-DATA-1');
    for (const ch of choices ?? []) {
      if (!allIds.has(ch.to)) push(`l'evolution de ${from} mene a la carte inconnue ${ch.to}`, 'EXI-DATA-1');
    }
  }
  const dungeonIds = new Set([...(data.dungeons ?? []).map((d) => d.id), ...Object.keys(data['monster-families'] ?? {})]);
  for (const m of data.monsters ?? []) {
    if (m.dungeon && !dungeonIds.has(m.dungeon)) {
      push(`le monstre ${m.id} appartient au donjon inconnu ${m.dungeon}`, 'EXI-DATA-1');
    }
  }
  for (const [from, to] of Object.entries(data['solo-steps'] ?? {})) {
    if (!allIds.has(from)) push(`le solo-step depuis ${from} part d'une carte inconnue`, 'EXI-DATA-1');
    if (!allIds.has(to)) push(`le solo-step de ${from} mene a la carte inconnue ${to}`, 'EXI-DATA-1');
  }
  for (const [biome, fams] of Object.entries(data['monster-families'] ?? {})) {
    if (!dungeonIds.has(biome)) push(`les familles de monstres du biome inconnu ${biome}`, 'EXI-DATA-1');
    for (const fam of fams ?? []) {
      const entrees = [...(fam.lines ?? []), ...(fam.side ?? [])].map((l) => (Array.isArray(l) ? l : [l]));
      for (const line of entrees) {
        for (const id of [...line, fam.mythic].filter(Boolean)) {
          if (!monsterIds.has(id)) push(`la famille ${fam.name} reference le monstre inconnu ${id}`, 'EXI-DATA-1');
        }
      }
    }
  }
  // arbres de race (EXI-P1-1) : refs, crans 10/20/30, noms d'éveils uniques, remplace exige disparait
  const nomsEveils = new Set();
  for (const [race, tree] of Object.entries(data.trees ?? {})) {
    for (const [cran, pct] of Object.entries(tree.crans ?? {})) {
      if (![0, 10, 20, 30].includes(pct)) push(`la race ${race} a un cran ${cran} à ${pct} % (attendu 0/10/20/30)`, 'EXI-P1-1');
    }
    for (const ev of tree.eveils ?? []) {
      if (!allIds.has(ev.de)) push(`l'éveil de ${race} part de la carte inconnue ${ev.de}`, 'EXI-P1-1');
      if (!allIds.has(ev.vers)) push(`l'éveil de ${race} mène à la carte inconnue ${ev.vers}`, 'EXI-P1-1');
      const nom = (cards.find((c) => c.id === ev.vers)?.name ?? '') + '|' + ev.de;
      if (nomsEveils.has(nom)) push(`doublon d'éveil ${ev.de} -> ${ev.vers} dans ${race}`, 'EXI-P1-2');
      nomsEveils.add(nom);
      if (ev.effet === 'remplace' && !ev.disparait) push(`l'éveil ${ev.de} -> ${ev.vers} est "remplace" sans disparait`, 'EXI-P1-2');
      if (ev.disparait && !allIds.has(ev.disparait)) push(`l'éveil ${ev.de} -> ${ev.vers} fait disparaître la carte inconnue ${ev.disparait}`, 'EXI-P1-2');
      for (const p of ev.portes ?? []) {
        if (!p.id || !p.nom) push(`la porte d'un éveil de ${race} manque id ou nom`, 'EXI-P1-1');
      }
    }
  }
  // noms de cartes : pas de collision Ange Éveillé / Éveillé du Seuil (EXI-P1-2)
  const noms = (data.cards ?? []).map((c) => c.name);
  if (new Set(noms).size !== noms.length) push('des cartes partagent le meme nom', 'EXI-P1-2');
  // zones (EXI-P1-4, EXI-P4-1, EXI-P4-2) : cadence, drops N, rencontres, récoltes, enseignements
  const gemTiers = new Set(data.engine?.GEM_TIERS ?? []);
  const sortsEcoleIds = new Set((data.grimoire?.ecole ?? []).map((s) => s.id));
  for (const z of data.zones ?? []) {
    if (z.cadence !== 'zone') push(`la zone ${z.id} n'a pas la cadence "zone"`, 'EXI-P4-2');
    if (z.apres !== 'donjon') push(`la zone ${z.id} n'est pas suivie d'un donjon (jamais deux zones consécutives)`, 'EXI-P4-2');
    for (const id of z.poolN ?? []) {
      if (!allIds.has(id)) push(`la zone ${z.id} référence la naissance inconnue ${id}`, 'EXI-P1-4');
    }
    for (const id of z.rencontres ?? []) {
      if (!monsterIds.has(id)) push(`la zone ${z.id} a une rencontre inconnue ${id}`, 'EXI-P4-1');
    }
    for (const tier of z.recoltes?.eclats?.tiers ?? []) {
      if (!gemTiers.has(tier)) push(`la zone ${z.id} récolte un éclat de tier inconnu ${tier}`, 'EXI-P4-1');
    }
    const taux = z.drops?.N;
    if (taux !== undefined && (typeof taux !== 'number' || taux < 0 || taux > 1)) {
      push(`la zone ${z.id} a un taux N invalide (${taux})`, 'EXI-P1-4');
    }
    for (const tauxR of [z.recoltes?.eclats?.taux, z.recoltes?.jetons?.taux]) {
      if (tauxR !== undefined && (typeof tauxR !== 'number' || tauxR < 0 || tauxR > 1)) {
        push(`la zone ${z.id} a un taux de récolte hors bornes (${tauxR})`, 'EXI-P4-1');
      }
    }
    for (const e of z.ecolages ?? []) {
      if (!sortsEcoleIds.has(e.sort)) push(`la zone ${z.id} enseigne le sort inconnu ${e.sort}`, 'EXI-P4-1');
      else if (!(data.grimoire.ecole.find((s) => s.id === e.sort)?.crans ?? {})[e.cran]) {
        push(`la zone ${z.id} enseigne le cran inconnu ${e.cran} de ${e.sort}`, 'EXI-P4-1');
      }
    }
  }
  // sorts d'école (EXI-P2-2, ACC-2-1) : école existante, 4 marches ou vide motivé,
  // coûts strictement croissants, taux décroissants quand la largeur monte
  const ecoles = data.schools ?? {};
  const largeurRang = (l) => (l === 'equipe' || l === 'equipe-renforcee' ? 4 : l === 'tous' ? 5 : Number(l) || 0);
  const tousSortsEcole = [...(data.grimoire?.ecole ?? []), ...(data.grimoire?.entrees ?? [])];
  const idsSorts = new Set();
  for (const s of [...tousSortsEcole, ...(data.grimoire?.communs ?? []), ...(data.grimoire?.race ?? []), ...(data.grimoire?.uniques ?? [])]) {
    if (idsSorts.has(s.id)) push(`doublon de sort ${s.id}`, 'EXI-DATA-3');
    idsSorts.add(s.id);
    if (s.ecole && !ecoles[s.ecole]) push(`le sort ${s.id} référence l'école inconnue ${s.ecole}`, 'EXI-P2-1');
  }
  for (const s of data.grimoire?.ecole ?? []) {
    const crans = Object.entries(s.crans ?? {});
    if (crans.length !== 4) push(`le sort ${s.id} n'a pas 4 crans`, 'EXI-P2-2');
    let prevCout = 0, prevTaux = 1, prevLarg = 0;
    for (const [nom, c] of crans) {
      if (c.vide) { if (!c.raison) push(`le cran ${nom} de ${s.id} est vide sans raison`, 'EXI-P2-2'); continue; }
      if (!(c.cout > prevCout)) push(`les coûts du sort ${s.id} ne sont pas strictement croissants (${nom})`, 'EXI-P2-2');
      prevCout = c.cout;
      const larg = largeurRang(c.largeur);
      if (c.taux !== undefined) {
        if (larg > prevLarg && !(c.taux < prevTaux)) push(`les taux de ${s.id} ne baissent pas quand la largeur monte (${nom})`, 'EXI-DATA-4');
        prevTaux = c.taux;
      }
      prevLarg = larg;
    }
  }
  // fusion (EXI-P2-3, EXI-P2-4) : un biome marqué trié couvre 100 % de ses signatures
  for (const [biome, b] of Object.entries(data['fusion-map'] ?? {})) {
    const sigsBiome = (data.monsters ?? []).filter((m) => m.dungeon === biome).map((m) => m.id);
    if (!b.trie) continue;
    for (const id of sigsBiome) {
      const entry = (b.signatures ?? {})[id];
      if (!entry) { push(`le biome ${biome} est trié mais la signature ${id} n'est pas couverte`, 'EXI-P2-3'); continue; }
      const cible = entry.unique ?? entry.fusion;
      if (!idsSorts.has(cible) && !(data.grimoire?.entrees ?? []).some((e) => e.id === cible)) {
        push(`la signature ${id} fond vers le sort inconnu ${cible}`, 'EXI-P2-3');
      }
    }
  }
  return errors;
}

// src/engine/stats.js : extrait du monolithe (phase 0, comportement inchange)
let rollFn = Math.random;
function setRoll(fn) { rollFn = fn; }
function roll() { return rollFn(); }

function mulberry32(seed) {
let state = seed | 0;
return function () {
state = (state + 0x6d2b79f5) | 0;
let t = Math.imul(state ^ (state >>> 15), 1 | state);
t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
}

function countTypes(units) {
  const byType = new Map();
  for (const u of units) {
    for (const t of [u.classe, u.element]) {
      if (!byType.has(t)) byType.set(t, new Set());
      byType.get(t).add(u.cardId);
    }
  }
  return byType;
}

function activeTiers(units) {
  const tiers = new Map();
  for (const [type, ids] of countTypes(units)) {
    const n = ids.size;
    if (!SYNERGIES[type]) continue;
    if (n >= PALIERS[1]) tiers.set(type, 2);
    else if (n >= PALIERS[0]) tiers.set(type, 1);
  }
  return tiers;
}

function tierLabel(tier) {
  return tier === 2 ? 'Palier 2' : tier === 1 ? 'Palier 1' : '';
}

const classeMods = (u) => CLASSE_MODS[u && u.classe] || CLASSE_DEFAULT;

function raceOfCard(c) {
  if (!c) return 'humaine';
  if (RACE_DIVINE_IDS.has(c.id)) return 'divine';
  if (RACE_MYSTIQUE_IDS.has(c.id)) return 'mystique';
  if (RACE_MONSTRE_IDS.has(c.id)) return 'monstre';
  if (!c.dungeon) return 'humaine';
  if (RACE_HUMAINE_DUNGEON_IDS.has(c.id)) return 'humaine';
  return 'monstre';
}

function elementMult(atkEl, defEl) {
  if (!atkEl || !defEl) return 1;
  return BEATS[atkEl] === defEl ? 1 + OPP_BONUS : 1;
}

function elementTag(atkEl, defEl) {
  if (!atkEl || !defEl) return null;
  return BEATS[atkEl] === defEl ? 'fort' : null;
}

function cardPower(card, lvl) {
  const st = statsAt(card, lvl, 0);
  const spellsN = (card.spells ?? []).length;
  return (st.atk * M.POWER_ATK_WEIGHT + st.hp * M.POWER_HP_WEIGHT) * (RARITY_POWER[card.rarity] ?? 1) * (1 + M.POWER_SPELL_STEP * Math.max(0, spellsN - 1));
}

function statsAt(card, lvl, asc = 0) {
  const m = 1 + LEVEL_BONUS * ((lvl ?? 1) - 1);
  const a = 1 + (asc ?? 0) / 100;
  return { atk: Math.max(1, Math.round(card.atk * m * a)), hp: Math.max(1, Math.round(card.hp * m * a)) };
}

function monstersOf(dungeonId) {
  const pool = MONSTERS.filter((m) => m.dungeon === dungeonId);
  return {
    attaque: pool.filter((m) => m.role === 'attaque'),
    support: pool.filter((m) => m.role === 'support'),
  };
}

function allMonsters() {
  return MONSTERS;
}

function forgeOnly(c) {
  return !!(c.branch || c.evolved);
}

function byId(id) {
  const c = CATALOG.find((c) => c.id === id);
  if (!c) throw new Error(`Carte inconnue : ${id}`);
  return c;
}

function monsterNextLine(id) {
  for (const dk of Object.keys(MONSTER_FAMS)) {
    for (const fam of MONSTER_FAMS[dk]) {
      for (const line of fam.lines) {
        const i = line.indexOf(id);
        if (i >= 0 && i < line.length - 1) return { nextId: line[i + 1], famName: fam.name };
      }
    }
  }
  return null;
}

// mode RPG (phase 3) : stat principale par profil et seuils, en données (EXI-P3-1, EXI-P3-5)
function statPrincipaleOf(classe) {
  return (DATA.engine.profils ?? {})[classe]?.stat ?? 'atk';
}
function statOf(u) {
  const s = statPrincipaleOf(u.classe);
  return u[s] ?? u.atk ?? 1;
}
function seuilOf(u) {
  const s = DATA.engine.seuils ?? {};
  const palier = RANK[u.rarity] ?? 0;
  return (s.parPalier?.[palier] ?? 0) + (s.parCamp?.[u.race] ?? 0);
}

// src/engine/spells.js : extrait du monolithe (phase 0, comportement inchange)

function pickSpell(u) {
  u.mana = Math.min(u.manaMax, u.mana + u.manaRegen);
  let best = null;
  for (const s of u.spells) {
    if (s.cost <= u.mana && (!best || s.cost > best.cost)) best = s;
  }
  if (!best) return null;
  if (u.spells.length > 1) {
    const top = u.spells[u.spells.length - 1];
    if (top.cost > u.mana && top.cost <= u.manaMax && top.cost <= u.mana + 2 * u.manaRegen) {
      return null; 
    }
  }
  u.mana -= best.cost;
  return best;
}

function applySupport(s, allies, mods, events, side, foes = [], st = null, action = null) {
  
  let spell = null;
  if (action && action.kind === 'pass') {
    s.mana = Math.min(s.manaMax, s.mana + s.manaRegen);
    events.push({ type: 'status', side, targetId: s.uid, kind: 'tactical', value: 'attente' });
    return;
  } else if (action && action.kind === 'basic') {
    s.mana = Math.min(s.manaMax, s.mana + s.manaRegen);
  } else if (action && action.kind === 'cast') {
    s.mana = Math.min(s.manaMax, s.mana + s.manaRegen);
    const cand = (s.spells ?? [])[action.idx ?? 0];
    if (cand && cand.cost <= s.mana) {
      spell = cand;
      s.mana -= cand.cost;
    }
  } else {
    spell = pickSpell(s);
  }
  if (st && spell) st.lastEnemySpell = { name: spell.name, mult: spell.mult, cost: spell.cost, big: !!spell.big };
  const fx = s.effect ? s.effect.kind : 'heal';
  if (spell) {
    events.push({ type: 'cast', side, sourceId: s.uid, name: spell.name, big: !!spell.big || spell.cost >= 5, fx, mana: s.mana });
  }
  const mult = spell ? spell.mult : 1;
  const kind = spell ? 'special' : 'basic';
  const aliveAllies = [...allies.attaque, ...allies.support].filter((u) => u.alive);
  const hurt = aliveAllies.filter((u) => u.hp < u.maxHp).sort((a, b) => a.hp - b.hp);
  if (action && action.allyUid) {
    const k = hurt.findIndex((u) => u.uid === action.allyUid);
    if (k > 0) hurt.unshift(hurt.splice(k, 1)[0]);
  }
  const n = side === 'team' && mods.dualSupport ? 2 : 1;
  if (side === 'team' && s.effect.kind === 'heal' && hurt.length === 0
      && s.mana >= CROSS.support.cost && foes.length) {
    const t = foes.reduce((a, b) => (a.hp <= b.hp ? a : b));
    s.mana -= CROSS.support.cost;
    events.push({ type: 'cast', side, sourceId: s.uid, name: s.crossName ?? CROSS.support.name, fx: 'atk', mana: s.mana });
    const dmg = Math.max(1, Math.round(s.atk * CROSS.support.base * CROSS.yield * classeMods(s).strike * elementMult(s.element, t.element)));
    events.push({ type: 'attack', sourceId: s.uid, targetId: t.uid, amount: dmg, kind: 'special', mana: s.mana, elem: elementTag(s.element, t.element), side: 'team' });
    applyDamage(t, dmg, events, 'enemies');
    return;
  }
  
  
  
  
  
  
  const cap = (t) => Math.round(t.maxHp * M.HEAL_CAP_RATIO);
  if (s.effect.kind === 'heal') {
    const value = Math.round(s.effect.value * (1 + (side === 'team' ? mods.healPct || 0 : 0)) * mult);
    for (const t of hurt.slice(0, n)) {
      const amount = Math.min(value, t.maxHp - t.hp);
      if (amount > 0) {
        t.hp += amount;
        events.push({ type: 'heal', side, sourceId: s.uid, targetId: t.uid, amount, kind });
        const p = t.linkedTo ? aliveAllies.find((a) => a.uid === t.linkedTo) : null;
        if (p) {
          const share = Math.min(Math.round(amount * M.LINK_SHARE), p.maxHp - p.hp);
          if (share > 0) {
            p.hp += share;
            events.push({ type: 'heal', side, sourceId: s.uid, targetId: p.uid, amount: share, kind: 'link' });
          }
        }
      }
    }
  } else if (s.effect.kind === 'atkBuff') {
    const value = s.effect.value * mult;
    for (const t of allies.attaque.filter((u) => u.alive).slice(0, n)) {
      t.atkBuff += value;
      events.push({ type: 'buff', side, sourceId: s.uid, targetId: t.uid, kind: 'atk', value, kindTag: kind });
      const p = t.linkedTo ? aliveAllies.find((a) => a.uid === t.linkedTo) : null;
      if (p) {
        p.atkBuff += value * M.LINK_BUFF_SHARE;
        events.push({ type: 'buff', side, sourceId: s.uid, targetId: p.uid, kind: 'atk', value: value * M.LINK_BUFF_SHARE, kindTag: 'link' });
      }
    }
  } else if (s.effect.kind === 'shield') {
    const value = Math.round(s.effect.value * mult);
    for (const t of allies.attaque.filter((u) => u.alive).slice(0, n)) {
      const amount = Math.min(value, cap(t));
      t.shield += amount;
      events.push({ type: 'shield', side, sourceId: s.uid, targetId: t.uid, amount, kind });
    }
  } else if (s.effect.kind === 'stun') {
    if (!spell) return;
    const count = s.effect.count ?? 1;
    for (const t of [...foes].sort((a, b) => b.atk - a.atk).slice(0, count)) {
      t.status.stun = (t.status.stun ?? 0) + 1;
      events.push({ type: 'status', side, sourceId: s.uid, targetId: t.uid, kind: 'stun', value: 1 });
    }
  } else if (s.effect.kind === 'slow') {
    if (!spell) return;
    for (const f of foes) {
      f.status.slow = Math.max(f.status.slow ?? 0, 2);
      events.push({ type: 'status', side, sourceId: s.uid, targetId: f.uid, kind: 'slow', value: 2 });
    }
  } else if (s.effect.kind === 'dot') {
    if (!spell) return;
    for (const f of foes) {
      f.status.dot = {
        dmg: Math.max(1, Math.round(s.atk * (s.effect.pct ?? M.DOT_EFFECT_DEFAULT) * mult)),
        turns: s.effect.turns ?? 2,
      };
      events.push({ type: 'status', side, sourceId: s.uid, targetId: f.uid, kind: 'dot', value: f.status.dot.dmg });
    }
  } else if (s.effect.kind === 'reflect') {
    if (!spell) return;
    for (const t of aliveAllies) {
      t.status.reflect = { pct: s.effect.value ?? M.REFLECT_DEFAULT_PCT, turns: s.effect.turns ?? 2 };
      events.push({ type: 'status', side, sourceId: s.uid, targetId: t.uid, kind: 'reflect', value: t.status.reflect.pct });
    }
  } else if (s.effect.kind === 'warcry') {
    if (!spell) return;
    const value = s.effect.value ?? M.WARCRY_DEFAULT;
    for (const t of allies.attaque.filter((u) => u.alive)) {
      t.atkBuff += value;
      t.status.dmgRed = { pct: s.effect.red ?? M.DMGRED_DEFAULT, turns: 1 };
      events.push({ type: 'buff', side, sourceId: s.uid, targetId: t.uid, kind: 'atk', value, kindTag: kind });
    }
  } else if (s.effect.kind === 'summon') {
    if (!spell) return;
    castSummon(s, allies, mods, events, side);
  } else if (s.effect.kind === 'curse') {
    if (!spell) return;
    for (const f of foes) {
      const value = (s.effect.value ?? M.CURSE_DEFAULT) * (1 + (side === 'team' ? mods.cursePct || 0 : 0)) * (f.boss ? M.CURSE_BOSS_FACTOR : 1);
      f.status.curse = { value, turns: s.effect.turns ?? 2 };
      events.push({ type: 'status', side, sourceId: s.uid, targetId: f.uid, kind: 'curse', value: Math.round(value * 100) / 100 });
    }
  } else if (s.effect.kind === 'revive') {
    if (!spell) return;
    const dead = [...allies.attaque, ...allies.support].filter((u) => !u.alive && !(u.status && u.status.reviving));
    if (dead.length) {
      const t = dead.sort((a, b) => b.maxHp - a.maxHp)[0];
      t.hp = Math.max(1, Math.round(t.maxHp * (s.effect.value ?? M.REVIVE_DEFAULT)));
      t.alive = true;
      events.push({ type: 'revive', side, sourceId: s.uid, targetId: t.uid, amount: t.hp });
    }
  } else if (s.effect.kind === 'link') {
    if (!spell) return;
    for (const u of allies.attaque.filter((u) => u.alive && u.linkedTo)) u.linkTtl = 2;
    const cands = allies.attaque.filter((u) => u.alive && !u.linkedTo);
    if (cands.length >= 2) {
      const [a, b] = cands;
      a.linkedTo = b.uid; a.linkTtl = 2;
      b.linkedTo = a.uid; b.linkTtl = 2;
      events.push({ type: 'status', side, sourceId: s.uid, targetId: a.uid, kind: 'link', value: b.uid });
    }
  }
}

// grimoire à crans (phase 2) : la résolution lit les données, jamais de sort en dur
function getSchoolSpell(spellId) {
  return (DATA.grimoire?.ecole ?? []).find((s) => s.id === spellId) ?? null;
}
function getEntree(spellId) {
  return (DATA.grimoire?.entrees ?? []).find((s) => s.id === spellId) ?? null;
}
function getSpellDef(spellId) {
  return getSchoolSpell(spellId) ?? getEntree(spellId)
    ?? (DATA.grimoire?.communs ?? []).find((s) => s.id === spellId)
    ?? (DATA.grimoire?.race ?? []).find((s) => s.id === spellId)
    ?? (DATA.grimoire?.uniques ?? []).find((s) => s.id === spellId) ?? null;
}
function cranOf(spellId, cran) {
  const s = getSchoolSpell(spellId);
  return s?.crans?.[cran] ?? null;
}
function largeurCibles(ligne, largeur, choix = null) {
  const n = (largeur === 'equipe' || largeur === 'equipe-renforcee') ? ligne.length : Number(largeur) || 1;
  const vivantes = ligne.filter((u) => u.hp > 0);
  if (n >= vivantes.length) return vivantes;
  if (n === 3) return pickZoneTargets(vivantes, choix);
  return vivantes.slice(0, n);
}
// castSpell(data, spellId, cran, contexte) : résout largeur, coût, mult, taux depuis les données
function castSpell(data, spellId, cran, contexte = {}) {
  void data;
  const def = getSpellDef(spellId);
  if (!def) throw new Error(`sort inconnu : ${spellId}`);
  const c = def.crans ? def.crans[cran] : def;
  if (!c || c.vide) return null;
  const { lanceur = null, cibles = [], events = [], side = 'enemies' } = contexte;
  const res = { sort: spellId, cran, ecole: def.ecole, role: def.role, cout: c.cout, largeur: c.largeur, mult: c.mult ?? null, taux: c.taux ?? null };
  if (def.role === 'degats' && c.mult) {
    const base = lanceur ? statOf(lanceur) : 1;
    const targets = largeurCibles(cibles, c.largeur, contexte.choix ?? null);
    const dmg = Math.max(1, Math.round(base * c.mult));
    for (const t of targets) {
      events.push({ type: 'attack', sourceId: lanceur?.uid ?? null, targetId: t.uid, amount: dmg, sort: spellId, cran });
      applyDamage(t, dmg, events, side);
    }
    res.cibles = targets.map((t) => t.uid);
    res.degats = dmg;
  }
  if (c.taux !== undefined && typeof contexte.rng === 'function') {
    const targets = largeurCibles(cibles, c.largeur, contexte.choix ?? null);
    for (const t of targets) {
      const seuil = seuilOf(t);
      if (contexte.rng() < c.taux - seuil) {
        t.status = t.status ?? {};
        t.status.stun = { tours: c.tours ?? 1 };
        events.push({ type: 'stun', sourceId: lanceur?.uid ?? null, targetId: t.uid, sort: spellId, cran, taux: c.taux });
      }
    }
    res.tauxApplique = true;
  }
  return res;
}
// la fusion (phase 2) : une signature de monstre se résout en cran ou unique selon fusion-map
function resolveSignature(monsterId) {
  const biome = (DATA.monsters ?? []).find((m) => m.id === monsterId)?.dungeon;
  const entry = FUSION_MAP[biome]?.signatures?.[monsterId];
  if (!entry) return null;
  return entry.unique ? { unique: entry.unique } : { sort: entry.fusion, cran: entry.cran };
}

// src/engine/combat.js : extrait du monolithe (phase 0, comportement inchange)

function makeUnit(card, uid = card.id, level = null) {
  
  
  const lvl = level ?? card.level ?? 1;
  const m = 1 + LEVEL_BONUS * (lvl - 1);
  const cm = classeMods(card);
  const cranPct = cranPctOfRace(raceOfCard(card));
  const u = {
    uid, cardId: card.id, name: card.name, rarity: card.rarity,
    classe: card.classe, element: card.element, role: card.role, race: raceOfCard(card),
    cranPct,
    atk: Math.max(1, Math.round(card.atk * m * (1 + cm.atkPct) * (1 + cranPct / 100))),
    hp: Math.max(1, Math.round(card.hp * m * (1 + cm.hpPct) * (1 + cranPct / 100))),
    maxHp: Math.max(1, Math.round(card.hp * m * (1 + cm.hpPct) * (1 + cranPct / 100))),
    agi: Math.max(1, Math.round((card.agi ?? Math.round(card.atk * M.AGI_RATIO)) * m * (1 + cranPct / 100))),
    int: Math.max(1, Math.round((card.int ?? Math.round(card.atk * M.INT_RATIO)) * m * (1 + cranPct / 100))),
    level: lvl,
    shield: 0, atkBuff: 0, alive: true,
    effect: card.effect ? { ...card.effect } : null,
    spells: (card.spells ?? []).map((s) => ({ ...s })),
    crossName: card.soloSpell ?? null,
    mana: Math.round((card.mana ?? SOLO_MANA.max) * M.MANA_START_RATIO),
    manaMax: card.mana ?? SOLO_MANA.max,
    manaRegen: (card.manaRegen ?? 2) + (card.gimmick === 'prestige' ? 2 : 0),
    boss: !!card.boss,
    final: !!card.final,
    gimmick: card.gimmick ?? null,
    ronde: 0,
    status: card.effect && card.effect.kind === 'copy' ? { copy: { spell: null, expiry: 0 } } : {},
    linkedTo: null,
    linkTtl: 0,
  };
  if (card.phoenix) u.status.phoenix = { ...card.phoenix };
  return u;
}

function teamModifiers(units) {
  const tiers = activeTiers(units);
  const mods = { tiers };
  for (const [type, tier] of tiers) {
    for (const [k, v] of Object.entries(SYNERGIES[type][tier])) {
      if (k === 'desc') continue;
      if (typeof v === 'boolean') mods[k] = mods[k] || v;
      else mods[k] = (mods[k] ?? 0) + v;
    }
  }
  
  const divines = units.filter((u) => u && u.race === 'divine');
  if (divines.length >= 2) {
    mods.dmgPct = (mods.dmgPct ?? 0) + M.DIVINE_PAIR_BONUS;
    mods.healPct = (mods.healPct ?? 0) + M.DIVINE_PAIR_BONUS;
  }
  return mods;
}

function levelFor(levels, id, i) {
  void i;
  const lv = levels ? levels[id] : undefined;
  return Number.isFinite(lv) && lv >= 1 ? Math.floor(lv) : 1;
}

function initCombat(teamCards, enemyCards, seed, levels = {}) {
  const team = {
    attaque: teamCards.attaque.map((c, i) => makeUnit(c, `${c.id}.a${i}`, c.level ?? levelFor(levels, c.id, i))),
    support: teamCards.support.map((c, i) => makeUnit(c, `${c.id}.s${i}`, c.level ?? levelFor(levels, c.id, i))),
  };
  const flat = Array.isArray(enemyCards)
    ? enemyCards
    : [...(enemyCards.attaque ?? []), ...(enemyCards.support ?? [])];
  const enemies = {
    attaque: flat.filter((c) => c.role !== 'support').map((c, i) => makeUnit({ ...c }, `e.a${i}`)),
    support: flat.filter((c) => c.role === 'support').map((c, i) => makeUnit({ ...c }, `e.s${i}`)),
  };
  const all = [...team.attaque, ...team.support];
  const mods = teamModifiers(all);
  if (mods.hpPct) {
    for (const u of all) {
      const bonus = Math.round(u.maxHp * mods.hpPct);
      u.maxHp += bonus;
      u.hp += bonus;
    }
  }
  if (mods.shieldPct) for (const u of all) u.shield = Math.round(u.maxHp * mods.shieldPct);
  for (const u of all) {
    if (u.gimmick === 'cale') u.shield += Math.round(u.maxHp * M.GIMMICK_CALE_SHIELD);
    if (u.gimmick === 'litiere') for (const a of all) a.shield += Math.round(a.maxHp * M.GIMMICK_LITIERE_SHIELD);
  }
  return { rng: mulberry32(seed), turn: 0, team, enemies, mods, winner: null };
}

function applyDamage(target, dmg, events, side, reviveCtx = null, isHit = false) {
  let rest = dmg;
  if (target.shield > 0) {
    const absorbed = Math.min(target.shield, rest);
    target.shield -= absorbed;
    rest -= absorbed;
    
    
    
    
    if (absorbed > 0) events.push({ type: 'block', side, targetId: target.uid, amount: absorbed });
  }
  target.hp -= rest;
  events.push({ type: 'damage', side, targetId: target.uid, amount: rest });
  if (rest <= 0) return false;
  if (isHit && target.alive) {
    const shieldOnHit = classeMods(target).shieldOnHit;
    if (shieldOnHit > 0) {
      const amount = Math.round(target.maxHp * shieldOnHit);
      target.shield += amount;
      events.push({ type: 'shield', side, sourceId: target.uid, targetId: target.uid, amount, kind: 'passif' });
    }
  }
  if (target.hp <= 0) {
    target.hp = 0;
    target.alive = false;
    events.push({ type: 'ko', side, targetId: target.uid });
    const phx = target.status ? target.status.phoenix : null;
    if (reviveCtx && phx && phx.delay > 0
        && reviveCtx.allies.some((a) => a.uid !== target.uid && a.alive)) {
      target.status.reviving = phx.delay;
      events.push({ type: 'phoenix', side, targetId: target.uid, turns: phx.delay });
    }
    return true;
  }
  return false;
}

function tickStatuses(state, events) {
  const groups = [
    ['team', state.team.attaque, state.team.support],
    ['enemies', state.enemies.attaque, state.enemies.support],
  ];
  for (const [side, arrA, arrS] of groups) {
    const units = [...arrA, ...arrS];
    for (const u of units) {
      const st = u.status;
      if (!st) continue;
      const others = () => units.filter((x) => x.uid !== u.uid);
      if (st.reviving) {
        st.reviving -= 1;
        if (st.reviving <= 0) {
          delete st.reviving;
          u.hp = Math.max(1, Math.round(u.maxHp * M.PHOENIX_REVIVE_RATIO));
          u.alive = true;
          events.push({ type: 'revive', side, targetId: u.uid, amount: u.hp });
        }
      }
      if (!u.alive) continue;
      if (st.dot) {
        const d = st.dot;
        const amount = Math.max(1, Math.round(d.dmg));
        events.push({ type: 'dot', side, targetId: u.uid, amount });
        applyDamage(u, amount, events, side, { allies: others() });
        d.turns -= 1;
        if (d.turns <= 0) delete st.dot;
      }
      if (st.copy && st.copy.spell) {
        st.copy.expiry -= 1;
        if (st.copy.expiry <= 0) st.copy.spell = null;
      }
      if (st.dmgRed) {
        st.dmgRed.turns -= 1;
        if (st.dmgRed.turns <= 0) delete st.dmgRed;
      }
      if (st.reflect) {
        st.reflect.turns -= 1;
        if (st.reflect.turns <= 0) delete st.reflect;
      }
      if (st.slow) {
        st.slow -= 1;
        if (st.slow <= 0) delete st.slow;
      }
      if (st.curse) {
        st.curse.turns -= 1;
        if (st.curse.turns <= 0) delete st.curse;
      }
      if (st.ttl) {
        st.ttl -= 1;
        if (st.ttl <= 0 && u.alive) {
          u.alive = false;
          u.hp = 0;
          events.push({ type: 'expire', side, targetId: u.uid });
        }
      }
      if (u.linkTtl) {
        u.linkTtl -= 1;
        if (u.linkTtl <= 0) {
          u.linkedTo = null;
          u.linkTtl = 0;
        }
      }
    }
  }
}

function beginRound(state) {
  const events = [];
  state.turn += 1;
  events.push({ type: 'turn', n: state.turn });
  tickStatuses(state, events);
  const { team, enemies, mods } = state;
  const rage = state.turn > M.RAGE_TURN ? 1 + M.RAGE_RATE * (state.turn - M.RAGE_TURN) : 1;
  const alive = (arr) => arr.filter((u) => u.alive);
  const enemyAll = () => alive([...enemies.attaque, ...enemies.support]);
  const teamAll = () => alive([...team.attaque, ...team.support]);
  const reduction = (side) => (side === 'team' ? Math.min(DMG_REDUCTION_MAX, mods.dmgReduction || 0) : 0);
  const ctx = { state, events, rage, alive, enemyAll, teamAll, reduction, frontEmpty: false, firstAttack: true, finish: null };
  const finish = (winner) => { state.winner = winner; ctx.events.push({ type: 'end', winner }); return ctx.events; };
  ctx.finish = finish;
  if (mods.regen) {
    for (const u of teamAll()) {
      const amount = Math.min(Math.round(u.maxHp * mods.regen), u.maxHp - u.hp);
      if (amount > 0) {
        u.hp += amount;
        events.push({ type: 'heal', side: 'team', sourceId: 'regen', targetId: u.uid, amount });
      }
    }
  }
  if (teamAll().some((u) => u.gimmick === 'ronde')) {
    for (const u of teamAll()) u.ronde = (u.ronde ?? 0) + 1;
  }
  const frontEmpty = alive(team.attaque).length === 0;
  ctx.frontEmpty = frontEmpty;
  const strikers = frontEmpty ? [...team.support] : [...team.attaque];
  const eFrontEmpty = alive(enemies.attaque).length === 0;
  const eStrikers = eFrontEmpty ? [...enemies.support] : [...enemies.attaque];
  const items = [];
  strikers.forEach((u, i) => { if (u.alive) items.push({ u, side: 'team', kind: 'strike', idx: i }); });
  team.support.forEach((s, si) => { if (s.alive) items.push({ u: s, side: 'team', kind: 'support', idx: si }); });
  eStrikers.forEach((e, ei) => { if (e.alive) items.push({ u: e, side: 'enemies', kind: 'strike', idx: ei }); });
  enemies.support.forEach((es, si) => { if (es.alive) items.push({ u: es, side: 'enemies', kind: 'support', idx: si }); });
  items.sort((a, b) => (b.u.agi - a.u.agi) || (a.side === b.side ? 0 : (a.side === 'team' ? -1 : 1)));
  state.round = { items, i: 0, ctx };
  return events;
}

function peekRound(state) {
  const r = state.round;
  if (!r) return null;
  const ctx = r.ctx;
  while (r.i < r.items.length) {
    const it = r.items[r.i];
    if (!it.u.alive) { r.i += 1; continue; }
    if (it.side === 'team' && it.kind === 'strike' && !ctx.enemyAll().length) { r.i += 1; continue; }
    if (it.side === 'enemies' && it.kind === 'strike' && !ctx.teamAll().length) { r.i += 1; continue; }
    return it;
  }
  return null;
}

function actTeamStriker(u, i, ctx, step) {
  const { team, enemies, mods } = ctx.state;
  const tacAct = step && step.tacAct ? step.tacAct : null;
  const foes = ctx.enemyAll();
  if (!foes.length) return false;
  if (u.status && u.status.stun > 0) {
    ctx.events.push({ type: 'status', side: 'team', targetId: u.uid, kind: 'stun', value: u.status.stun });
    u.status.stun -= 1;
    if (u.status.stun <= 0) delete u.status.stun;
    return false;
  }
  if (tacAct && tacAct.kind === 'pass') {
    u.mana = Math.min(u.manaMax, u.mana + u.manaRegen);
    ctx.events.push({ type: 'status', side: 'team', targetId: u.uid, kind: 'tactical', value: 'attente' });
    return false;
  }
  if (tacAct && tacAct.kind === 'cross') {
    u.mana = Math.min(u.manaMax, u.mana + u.manaRegen);
    if (u.mana >= CROSS.attaque.cost) {
      u.mana -= CROSS.attaque.cost;
      const wounded2 = ctx.teamAll().filter((a) => a.hp < a.maxHp).sort((a, b) => a.hp - b.hp);
      const t = (tacAct.allyUid && wounded2.find((a) => a.uid === tacAct.allyUid)) ?? wounded2[0];
      ctx.events.push({ type: 'cast', side: 'team', sourceId: u.uid, name: CROSS.attaque.name, fx: 'heal', mana: u.mana });
      if (t) {
        const amount = Math.min(Math.round(u.atk * CROSS.yield * (1 + (mods.healPct || 0))), t.maxHp - t.hp);
        if (amount > 0) {
          t.hp += amount;
          ctx.events.push({ type: 'heal', side: 'team', sourceId: u.uid, targetId: t.uid, amount, kind: 'special' });
        }
      }
    } else {
      ctx.events.push({ type: 'status', side: 'team', targetId: u.uid, kind: 'tactical', value: 'mana' });
    }
    if (!ctx.enemyAll().length) { ctx.finish('team'); return true; }
    return false;
  }
  if (!tacAct && u.role === 'attaque') {
    const wounded = ctx.teamAll().filter((a) => a.hp < a.maxHp * CROSS.healThreshold).sort((a, b) => a.hp - b.hp);
    if (wounded.length && u.mana + u.manaRegen >= CROSS.attaque.cost) {
      u.mana = Math.min(u.manaMax, u.mana + u.manaRegen) - CROSS.attaque.cost;
      const t = wounded[0];
      ctx.events.push({ type: 'cast', side: 'team', sourceId: u.uid, name: CROSS.attaque.name, fx: 'heal', mana: u.mana });
      const amount = Math.min(Math.round(u.atk * CROSS.yield * (1 + (mods.healPct || 0))), t.maxHp - t.hp);
      if (amount > 0) {
        t.hp += amount;
        ctx.events.push({ type: 'heal', side: 'team', sourceId: u.uid, targetId: t.uid, amount, kind: 'special' });
      }
      ctx.firstAttack = false;
      return false;
    }
  }
  let spell = null;
  if (!mods.aoe || !ctx.firstAttack) {
    if (tacAct && tacAct.kind === 'spell') {
      u.mana = Math.min(u.manaMax, u.mana + u.manaRegen);
      const cand = (u.spells ?? [])[tacAct.idx ?? 0];
      if (cand && cand.cost <= u.mana) {
        u.mana -= cand.cost;
        const side = spellSideOf(cand);
        // T0.2 : un sort de boost vise son camp (soi / 1 allie), pas l'ennemi ; en auto le chemin historique reste un coup
        if (side === 'self' || side === 'ally') {
          const t = side === 'ally' && tacAct.allyUid
            ? (ctx.teamAll().find((a) => a.uid === tacAct.allyUid && a.alive) ?? u)
            : u;
          const value = Math.max(0, (cand.mult ?? 1) - 1);
          t.atkBuff = (t.atkBuff ?? 0) + value;
          ctx.events.push({ type: 'cast', side: 'team', sourceId: u.uid, name: cand.name, big: !!cand.big || cand.cost >= 5, fx: 'atk', mana: u.mana });
          ctx.events.push({ type: 'buff', side: 'team', sourceId: u.uid, targetId: t.uid, kind: 'atk', value, kindTag: 'special' });
          ctx.firstAttack = false;
          return false;
        }
        spell = cand;
      } else {
        ctx.events.push({ type: 'status', side: 'team', targetId: u.uid, kind: 'tactical', value: 'mana' });
      }
    } else if (tacAct && tacAct.kind === 'attack') {
      u.mana = Math.min(u.manaMax, u.mana + u.manaRegen);
    } else {
      const cp = u.status ? u.status.copy : null;
      if (cp && !cp.spell && ctx.state.lastEnemySpell) {
        cp.spell = { ...ctx.state.lastEnemySpell };
        cp.expiry = 2;
        ctx.events.push({ type: 'status', side: 'team', targetId: u.uid, kind: 'copy', value: cp.spell.name });
      }
      if (cp && cp.spell) {
        spell = cp.spell;
        cp.spell = null;
      } else {
        spell = pickSpell(u);
      }
    }
  }
  if (spell) {
    ctx.events.push({ type: 'cast', side: 'team', sourceId: u.uid, name: spell.name, big: !!spell.big || spell.cost >= 5, fx: 'atk', mana: u.mana });
  }
  if (spell && u.classe === 'Invocateur' && u.effect && u.effect.kind === 'summon') {
    if (castSummon(u, team, mods, ctx.events, 'team')) {
      ctx.firstAttack = false;
      return false;
    }
  }
  const cSelf = u.status && u.status.curse ? u.status.curse.value : 0;
  let dmg = Math.max(1, Math.round(u.atk * (1 + (mods.atkPct || 0) + u.atkBuff) * (1 + (mods.dmgPct || 0)) * (spell ? spell.mult : classeMods(u).strike) * (1 - cSelf) * ctx.rage));
  u.atkBuff = 0;
  if (u.ronde) dmg = Math.max(1, Math.round(dmg * (1 + M.RONDE_RATE * Math.min(u.ronde, M.RONDE_CAP))));
  if (u.gimmick === 'belier' && !u.belierUsed) {
    dmg = Math.max(1, Math.round(dmg * M.BELIER_BOOST));
    u.belierUsed = true;
  }
  const kind = spell ? 'special' : 'basic';
  if (mods.aoe && ctx.firstAttack) {
    ctx.events.push({ type: 'attack', sourceId: u.uid, targetId: 'all', amount: dmg, kind, mana: u.mana, elem: null, side: 'team' });
    for (const f of [...foes]) {
      applyDamage(f, Math.max(1, Math.round(dmg * mods.aoe * elementMult(u.element, f.element))), ctx.events, 'enemies');
    }
    ctx.firstAttack = false;
    if (!ctx.enemyAll().length) { ctx.finish('team'); return true; }
    return false;
  }
  if (u.gimmick === 'carrousel' && ctx.state.rng() < M.CARROUSEL_CHANCE) {
    ctx.events.push({ type: 'attack', sourceId: u.uid, targetId: 'all', amount: dmg, kind, mana: u.mana, elem: null, side: 'team' });
    for (const f of [...foes]) applyDamage(f, Math.max(1, Math.round(dmg * M.CARROUSEL_SPLASH)), ctx.events, 'enemies');
    if (!ctx.enemyAll().length) { ctx.finish('team'); return true; }
    ctx.firstAttack = false;
    return false;
  }
  if (!spell && classeMods(u).wave) {
    ctx.events.push({ type: 'attack', sourceId: u.uid, targetId: 'all', amount: dmg, kind, mana: u.mana, elem: null, side: 'team' });
    for (const f of [...foes]) {
      applyDamage(f, Math.max(1, Math.round(dmg * elementMult(u.element, f.element))), ctx.events, 'enemies', null, true);
    }
    if (!ctx.enemyAll().length) { ctx.finish('team'); return true; }
    ctx.firstAttack = false;
    return false;
  }
  const idx = !ctx.frontEmpty && step && step.targetIdx !== null && step.targetIdx !== undefined ? step.targetIdx : null;
  const target = idx !== null && enemies.attaque[idx]?.alive ? enemies.attaque[idx] : foes[0];
  if (mods.weakBonus && target === foes.reduce((a, b) => (a.hp <= b.hp ? a : b))) {
    dmg = Math.round(dmg * (1 + mods.weakBonus));
  }
  const cmU = classeMods(u);
  if (cmU.exec && target.hp < target.maxHp * cmU.execBelow) {
    dmg = Math.max(1, Math.round(dmg * (1 + cmU.exec)));
    ctx.events.push({ type: 'status', side: 'enemies', targetId: target.uid, kind: 'exec', value: cmU.exec });
  }
  const elem = elementTag(u.element, target.element);
  dmg = Math.max(1, Math.round(dmg * elementMult(u.element, target.element)));
  const slowed = foes.some((f) => f.status && f.status.slow > 0);
  const hits = (mods.doubleChance && ctx.state.rng() < mods.doubleChance) || slowed ? 2 : 1;
  for (let h = 0; h < hits; h++) {
    if (!target.alive) break;
    if (classeMods(target).dodge && ctx.state.rng() < classeMods(target).dodge) {
      ctx.events.push({ type: 'dodge', side: 'enemies', targetId: target.uid });
      break;
    }
    ctx.events.push({ type: 'attack', sourceId: u.uid, targetId: target.uid, amount: dmg, kind, mana: u.mana, elem, side: 'team' });
    applyDamage(target, dmg, ctx.events, 'enemies', { allies: foes }, true);
    if (target.alive && spell && spell.dot) {
      target.status.dot = { dmg: Math.max(1, Math.round(dmg * (spell.dot.pct ?? M.DOT_DEFAULT_PCT))), turns: spell.dot.turns ?? 2 };
      ctx.events.push({ type: 'status', side: 'enemies', targetId: target.uid, kind: 'dot', value: target.status.dot.dmg });
    }
    if (target.alive && target.status && target.status.reflect && dmg > 0) {
      const back = Math.max(1, Math.round(dmg * target.status.reflect.pct));
      ctx.events.push({ type: 'attack', sourceId: target.uid, targetId: u.uid, amount: back, kind: 'special', mana: target.mana, elem: null, side: 'enemies' });
      applyDamage(u, back, ctx.events, 'team', { allies: ctx.teamAll() });
    }
  }
  if (!spell && cmU.splash) {
    const ratio = cmU.splash / cmU.strike;
    const others = ctx.enemyAll().filter((f) => f !== target && f.alive);
    for (const f of others) {
      const half = Math.max(1, Math.round(dmg * ratio));
      ctx.events.push({ type: 'attack', sourceId: u.uid, targetId: f.uid, amount: half, kind, mana: u.mana, elem: elementTag(u.element, f.element), side: 'team' });
      applyDamage(f, Math.max(1, Math.round(half * elementMult(u.element, f.element))), ctx.events, 'enemies', null, true);
    }
  }
  if (u.gimmick === 'volee') {
    const others = ctx.enemyAll().filter((f) => f !== target && f.alive);
    if (others.length) {
      const t2 = others[0];
      const half = Math.max(1, Math.round(dmg * M.BELIER_SPLASH));
      ctx.events.push({ type: 'attack', sourceId: u.uid, targetId: t2.uid, amount: half, kind, mana: u.mana, elem: elementTag(u.element, t2.element), side: 'team' });
      applyDamage(t2, Math.max(1, Math.round(half * elementMult(u.element, t2.element))), ctx.events, 'enemies');
    }
  }
  if (!ctx.enemyAll().length) { ctx.finish('team'); return true; }
  ctx.firstAttack = false;
  return false;
}

function actTeamSupport(s, ctx, step) {
  if (!s.alive) return;
  const supAct = step && step.tacAct ? step.tacAct : null;
  applySupport(s, ctx.state.team, ctx.state.mods, ctx.events, 'team', ctx.enemyAll(), null, supAct);
}

function enemyPickTarget(e, targets, dmgBase) {
  const score = (t) => {
    const dmg = Math.max(1, Math.round(dmgBase * elementMult(e.element, t.element)));
    let s = 0;
    if (t.hp <= dmg) s += M.TARGET_KILL_BONUS;
    if (elementTag(e.element, t.element) === 'fort') s += M.ELEMENT_ADVANTAGE_BONUS;
    return s - t.hp;
  };
  return targets.reduce((a, b) => (score(b) > score(a) ? b : a), targets[0]);
}

function actEnemyStriker(e, ctx) {
  const { team, enemies, mods } = ctx.state;
  if (e.status && e.status.stun > 0) {
    ctx.events.push({ type: 'status', side: 'enemies', targetId: e.uid, kind: 'stun', value: e.status.stun });
    e.status.stun -= 1;
    if (e.status.stun <= 0) delete e.status.stun;
    return false;
  }
  const targets = ctx.alive(team.attaque).length ? ctx.alive(team.attaque) : ctx.alive(team.support);
  if (!targets.length) return false;
  const spell = pickSpell(e);
  if (spell) {
    ctx.events.push({ type: 'cast', side: 'enemies', sourceId: e.uid, name: spell.name, big: !!spell.big, fx: 'atk', mana: e.mana });
    ctx.state.lastEnemySpell = { name: spell.name, mult: spell.mult, cost: spell.cost, big: !!spell.big };
  }
  const cmE = classeMods(e);
  if (spell && e.classe === 'Invocateur' && e.effect && e.effect.kind === 'summon') {
    if (castSummon(e, enemies, {}, ctx.events, 'enemies')) {
      return false;
    }
  }
  const belierBoost = e.gimmick === 'belier' && !e.belierUsed ? M.BELIER_BOOST : 1;
  if (belierBoost > 1) e.belierUsed = true;
  const eCurse = e.status && e.status.curse ? e.status.curse.value : 0;
  const dmgBase = Math.max(1, Math.round(e.atk * (1 - ctx.reduction('team')) * (spell ? spell.mult : cmE.strike) * (1 - eCurse) * ctx.rage * belierBoost));
  const kind = spell ? 'special' : 'basic';
  const target = enemyPickTarget(e, targets, dmgBase);
  const gRed = Math.min(DMG_REDUCTION_MAX, mods.dmgReduction || 0);
  const tRed = target.status && target.status.dmgRed ? target.status.dmgRed.pct : 0;
  const redFactor = gRed >= DMG_REDUCTION_MAX ? 1
    : Math.max(0, (1 - Math.min(DMG_REDUCTION_MAX, gRed + tRed)) / (1 - gRed));
  const dmg = Math.max(1, Math.round(dmgBase * redFactor * elementMult(e.element, target.element)));
  const eHits = targets.some((t) => t.status && t.status.slow > 0) ? 2 : 1;
  let dmgFinal = dmg;
  let died = false;
  if (!spell && cmE.wave) {
    for (const t of targets.filter((t) => t !== target)) {
      if (!t.alive) continue;
      const tRed2 = t.status && t.status.dmgRed ? t.status.dmgRed.pct : 0;
      const rf2 = gRed >= DMG_REDUCTION_MAX ? 1
        : Math.max(0, (1 - Math.min(DMG_REDUCTION_MAX, gRed + tRed2)) / (1 - gRed));
      const d2 = Math.max(1, Math.round(dmgBase * rf2 * elementMult(e.element, t.element)));
      ctx.events.push({ type: 'attack', sourceId: e.uid, targetId: t.uid, amount: d2, kind, mana: e.mana, elem: elementTag(e.element, t.element), side: 'enemies' });
      died = applyDamage(t, d2, ctx.events, 'team', { allies: ctx.teamAll() }, true) || died;
      if (t.alive && t.status && t.status.reflect && d2 > 0) {
        const back = Math.max(1, Math.round(d2 * t.status.reflect.pct));
        ctx.events.push({ type: 'attack', sourceId: t.uid, targetId: e.uid, amount: back, kind: 'special', mana: t.mana, elem: null, side: 'team' });
        applyDamage(e, back, ctx.events, 'enemies', { allies: ctx.enemyAll() });
      }
    }
  }
  if (cmE.exec && target.hp < target.maxHp * cmE.execBelow) {
    dmgFinal = Math.max(1, Math.round(dmg * (1 + cmE.exec)));
    ctx.events.push({ type: 'status', side: 'team', targetId: target.uid, kind: 'exec', value: cmE.exec });
  }
  for (let h = 0; h < eHits && target.alive; h++) {
    if (classeMods(target).dodge && ctx.state.rng() < classeMods(target).dodge) {
      ctx.events.push({ type: 'dodge', side: 'team', targetId: target.uid });
      break;
    }
    ctx.events.push({ type: 'attack', sourceId: e.uid, targetId: target.uid, amount: dmgFinal, kind, mana: e.mana, elem: elementTag(e.element, target.element), side: 'enemies' });
    if (target.gimmick === 'voile' && ctx.state.rng() < M.VOILE_CHANCE) {
      ctx.events.push({ type: 'cast', side: 'team', sourceId: target.uid, name: 'Voile de Brume', fx: 'heal', mana: target.mana });
    } else {
      const partner = target.linkedTo ? ctx.teamAll().find((a) => a.uid === target.linkedTo) : null;
      if (partner) {
        const half = Math.max(1, Math.round(dmgFinal / 2));
        ctx.events.push({ type: 'link', side: 'team', sourceId: target.uid, targetId: partner.uid, amount: half });
        died = applyDamage(target, dmgFinal - half, ctx.events, 'team', { allies: ctx.teamAll() }, true) || died;
        applyDamage(partner, half, ctx.events, 'team', { allies: ctx.teamAll() }, true);
      } else {
        died = applyDamage(target, dmgFinal, ctx.events, 'team', { allies: ctx.teamAll() }, true) || died;
      }
      if (target.alive && target.status && target.status.reflect && dmgFinal > 0) {
        const back = Math.max(1, Math.round(dmgFinal * target.status.reflect.pct));
        ctx.events.push({ type: 'attack', sourceId: target.uid, targetId: e.uid, amount: back, kind: 'special', mana: target.mana, elem: null, side: 'team' });
        applyDamage(e, back, ctx.events, 'enemies', { allies: ctx.enemyAll() });
      }
      if (target.alive && target.gimmick === 'mirage' && dmg > 0) {
        const reflet = Math.max(1, Math.round(dmg * M.REFLECT_SHARE));
        ctx.events.push({ type: 'attack', sourceId: target.uid, targetId: e.uid, amount: reflet, kind: 'basic', mana: target.mana, elem: null, side: 'team' });
        applyDamage(e, reflet, ctx.events, 'enemies');
      }
    }
  }
  if (died && target.gimmick === 'benediction') {
    for (const u of ctx.teamAll()) {
      const amount = Math.min(Math.round(u.maxHp * M.BENEDICTION_HEAL), u.maxHp - u.hp);
      if (amount > 0) {
        u.hp += amount;
        ctx.events.push({ type: 'heal', side: 'team', sourceId: target.uid, targetId: u.uid, amount, kind: 'special' });
      }
    }
  }
  if (!ctx.teamAll().length) { ctx.finish('enemies'); return true; }
  if (died && mods.vengeance) {
    for (const u of ctx.teamAll().filter((x) => x.role === 'attaque')) {
      u.atk = Math.round(u.atk * (1 + mods.vengeance));
    }
    ctx.events.push({ type: 'vengeance', value: mods.vengeance });
  }
  return false;
}

function actEnemySupport(es, ctx) {
  if (!es.alive) return;
  applySupport(es, ctx.state.enemies, {}, ctx.events, 'enemies', ctx.teamAll(), ctx.state);
}

function stepRound(state, stepChoice = null) {
  const r = state.round;
  if (!r) return { events: [], done: true };
  const ctx = r.ctx;
  const it = peekRound(state);
  if (!it) {
    const ev = [];
    if (!ctx.enemyAll().length && !state.winner) { state.winner = 'team'; ev.push({ type: 'end', winner: 'team' }); }
    else if (!ctx.teamAll().length && !state.winner) { state.winner = 'enemies'; ev.push({ type: 'end', winner: 'enemies' }); }
    state.round = null;
    return { events: ev, done: true };
  }
  r.i += 1;
  ctx.events = [];
  let tacAct = null;
  let targetIdx = null;
  if (stepChoice) {
    tacAct = { kind: stepChoice.kind, idx: stepChoice.idx, allyUid: stepChoice.allyUid };
    if (stepChoice.targetIdx !== null && stepChoice.targetIdx !== undefined) targetIdx = stepChoice.targetIdx;
    else if (stepChoice.targetUid != null) {
      const ti = state.enemies.attaque.findIndex((x) => x.uid === stepChoice.targetUid);
      if (ti >= 0) targetIdx = ti;
    }
  }
  const step = { tacAct, targetIdx };
  let done = false;
  if (it.side === 'team' && it.kind === 'strike') done = actTeamStriker(it.u, it.idx, ctx, step);
  else if (it.side === 'team' && it.kind === 'support') actTeamSupport(it.u, ctx, step);
  else if (it.side === 'enemies' && it.kind === 'strike') done = actEnemyStriker(it.u, ctx);
  else actEnemySupport(it.u, ctx);
  if (state.winner) done = true;
  if (r.i >= r.items.length) {
    done = true;
    if (!state.winner) {
      if (!ctx.enemyAll().length) { state.winner = 'team'; ctx.events.push({ type: 'end', winner: 'team' }); }
      else if (!ctx.teamAll().length) { state.winner = 'enemies'; ctx.events.push({ type: 'end', winner: 'enemies' }); }
    }
  }
  if (done) state.round = null;
  return { events: ctx.events, done };
}

function resolveTurn(state, choices = null) {
  const events = beginRound(state);
  let guard = 0;
  while (guard++ < 200) {
    const nxt = peekRound(state);
    let sc = null;
    if (choices && nxt) {
      if (nxt.side === 'team' && nxt.kind === 'strike' && choices.actions) {
        const a = choices.actions[nxt.idx] ?? null;
        const t = choices.targets ? (choices.targets[nxt.idx] ?? null) : null;
        sc = a ? { kind: a.kind, idx: a.idx, allyUid: a.allyUid, targetIdx: t } : null;
      } else if (nxt.side === 'team' && nxt.kind === 'support' && choices.support) {
        sc = choices.support[nxt.idx] ?? null;
      }
    }
    const r = stepRound(state, sc);
    events.push(...r.events);
    if (r.done) break;
  }
  state.round = null;
  return events;
}

function playAuto(state, maxTurns = M.MAX_TURNS_AUTO) {
  const log = [];
  while (!state.winner && state.turn < maxTurns) {
    log.push(...resolveTurn(state, null));
  }
  return log;
}

function dungeonById(id) {
  return DUNGEONS.find((d) => d.id === id) ?? DUNGEONS[0];
}

function difficultyById(id) {
  return DIFFICULTIES.find((d) => d.id === id) ?? DIFFICULTIES[0];
}

function shardMult(count) {
  return 1 + SHARD_BONUS * (count ?? 0);
}

function shardPct(count) {
  return Math.round(SHARD_BONUS * (count ?? 0) * 100);
}

function stagesOf(dungeonId) {
  return dungeonById(dungeonId).floors;
}

function levelAt(stage, rarity = 'C', boss = false) {
  
  return 1 + Math.floor(M.LEVEL_STAGE_RATIO * (stage - 1)) + (RANK[rarity] ?? 0) + (boss ? 2 : 0);
}

function levelIn(dungeon, stage, rarity = 'C', boss = false) {
  return levelAt(stage, rarity, boss) + Math.round(dungeon.tier * M.DUNGEON_TIER_LEVEL_MULT);
}

function hashSeed(seed, stage) {
  return (seed ^ Math.imul(stage, 0x9e3779b9)) >>> 0;
}

function wavePower(wave) {
  let p = 0;
  for (const u of [...wave.attaque, ...wave.support]) {
    p += (u.atk + u.hp) * (1 + LEVEL_BONUS * ((u.level ?? 1) - 1));
  }
  return p;
}

function spreadAt(stage) {
  if (stage <= 2) return 1;
  if (stage <= 4) return 2;
  return 3;
}

function makeWave(seed, stage, dungeonId = 'marees', diff = 1, runMod = null) {
  const rng = mulberry32(hashSeed(seed, stage));
  const dungeon = dungeonById(dungeonId);
  const DIFF = difficultyById(diff);
  const minRank = RANK[DIFF.minR];
  const capRank = Math.min(RANK[DIFF.mobCap], minRank + spreadAt(stage));
  const POOL_ATK = monstersOf(dungeon.id).attaque;
  const POOL_SUP = monstersOf(dungeon.id).support;
  const levelFor = (rarity, boss = false) => levelIn(dungeon, stage, rarity, boss);

  const poolOf = (pool, minR = minRank, maxR = capRank) => {
    const p = pool.filter((c) => RANK[c.rarity] >= minR && RANK[c.rarity] <= maxR);
    if (p.length) return p;
    const low = pool.filter((c) => RANK[c.rarity] >= minRank);
    return low.length ? low : pool;
  };
  const scaled = (pool, hpMult = 1, atkMult = 1, minR = minRank, maxR = capRank) => {
    const p = poolOf(pool, minR, maxR);
    const c = p[Math.floor(rng() * p.length)];
    const variance = M.WAVE_VAR_MIN + M.WAVE_VAR_SPAN * rng(); 
    return {
      ...c,
      level: levelFor(c.rarity),
      atk: Math.max(1, Math.round(c.atk * variance * atkMult)),
      hp: Math.max(1, Math.round(c.hp * variance * hpMult)),
    };
  };

  const isFinal = stage === dungeon.floors;
  const isBoss = DIFF.allBoss || stage % 5 === 0;
  let wave;
  if (isBoss) {
    const bossRarity = isFinal ? DIFF.boss10 : DIFF.boss5;
    const [hpMult, atkMult] = isFinal ? [M.FINAL_HP_MULT, M.FINAL_ATK_MULT] : stage % 5 === 0 ? [M.BOSS_HP_MULT, M.BOSS_ATK_MULT] : [M.ELITE_HP_MULT, M.ELITE_ATK_MULT];
    const boss = scaled(POOL_ATK, hpMult, atkMult, RANK[bossRarity], RANK[bossRarity]);
    boss.name = dungeon.bossNames?.[stage] ?? boss.name;
    boss.boss = true;
    boss.final = isFinal;
    boss.level = levelFor(boss.rarity, true);
    const minions = isFinal ? [scaled(POOL_ATK), scaled(POOL_ATK)] : [scaled(POOL_ATK)];
    const supports = isFinal ? [scaled(POOL_SUP), scaled(POOL_SUP)] : [scaled(POOL_SUP)];
    wave = { attaque: [boss, ...minions], support: supports };
  } else {
  const n = 2 + (rng() > M.WAVE_EXTRA_CHANCE ? 1 : 0);
  const supCount = stage >= 2 && rng() > M.WAVE_SUP_CHANCE ? 1 : 0;
  wave = {
    attaque: Array.from({ length: n }, () => scaled(POOL_ATK)),
    support: Array.from({ length: supCount }, () => scaled(POOL_SUP)),
  };
  }

  
  let prev = stage - 1;
  if (prev >= 1) {
    const prevP = wavePower(makeWave(seed, prev, dungeonId, diff)) * M.WAVE_POWER_GROWTH;
    let guard = 0;
    while (wavePower(wave) <= prevP && guard++ < 200) {
      for (const u of [...wave.attaque, ...wave.support]) {
        u.atk = Math.max(1, Math.round(u.atk * M.WAVE_ATK_STEP));
        u.hp = Math.max(1, Math.round(u.hp * M.WAVE_HP_STEP));
      }
    }
  }
  
  if (runMod === 'horde') {
    wave.attaque.push(scaled(POOL_ATK));
  } else if (runMod === 'muraille') {
    for (const u of [...wave.attaque, ...wave.support]) u.hp = Math.max(1, Math.round(u.hp * M.RUNMOD_MURaille_HP));
  } else if (runMod === 'rage') {
    for (const u of [...wave.attaque, ...wave.support]) u.atk = Math.max(1, Math.round(u.atk * M.RUNMOD_RAGE_ATK));
  }
  return wave;
}

function makeDailyWave(seed, lvl = M.DAILY_LEVEL_DEFAULT) {
  const rng = mulberry32(hashSeed(seed, 5));
  const pool = monstersOf('divin');
  const pickN = (list, n) => {
    const copy = [...list];
    const out = [];
    while (out.length < n && copy.length) out.push(copy.splice(Math.floor(rng() * copy.length), 1)[0]);
    return out;
  };
  const lv = Math.max(5, Math.floor(lvl));
  const variance = () => M.DAILY_VAR_MIN + M.DAILY_VAR_SPAN * rng();
  const scaled = (c, boss = false) => ({
    ...c,
    level: lv + (boss ? 2 : 0),
    atk: Math.max(1, Math.round(c.atk * variance())),
    hp: Math.max(1, Math.round(c.hp * variance())),
    boss,
  });
  const atks = pickN(pool.attaque, 3).map((c, i) => scaled(c, i === 0));
  const sups = pickN(pool.support, 2).map((c) => scaled(c));
  return { attaque: atks, support: sups };
}

function drawDailyCommon(rng = roll) {
  const r = rng();
  const race = r < M.DAILY_RACE_HUM ? 'humaine' : r < M.DAILY_RACE_MONSTRE ? 'monstre' : r < M.DAILY_RACE_MYSTIQUE ? 'mystique' : 'divine';
  // rang N (phase 1) : le tirage donne la naissance de la race ; les communes divines restent la porte divine
  const naissRar = (rc) => (rc === 'divine' ? 'C' : 'N');
  const poolFor = (rc) => CATALOG.filter((c) => c.raciale && c.rarity === naissRar(raceOfCard(c)) && raceOfCard(c) === rc && cardAvailable(c) && !c.archived);
  let pool = poolFor(race);
  if (!pool.length) pool = poolFor('humaine');
  const fallback = pool.length ? pool : CATALOG.filter((c) => c.raciale && c.rarity === naissRar(raceOfCard(c)) && cardAvailable(c) && !c.archived);
  return fallback[Math.floor(rng() * fallback.length)];
}

// T1.3 : tirage pur d'une naissance (rang N, porte divine en C tant que l'Esprit Divin n'existe pas)
function drawNaissance(rng = roll, keep = () => true) {
  const pool = CATALOG.filter((c) => c.raciale && !c.archived && c.rarity === (raceOfCard(c) === 'divine' ? 'C' : 'N') && keep(c));
  return pool.length ? pool[Math.floor(rng() * pool.length)] : null;
}

// T1.3 : la rarete du jeton de generation, table en data, communes au taux de reference puis decroissant (decision 8)
function jetonRarityFor(rng = roll, cleared = 0) {
  const tiers = DATA.engine.JETON_RARITY ?? {};
  const keys = Object.keys(tiers).map(Number).filter((k) => cleared >= k).sort((x, y) => y - x);
  return rollRarity(rng, keys.length ? tiers[keys[0]] : [['C', 1]]);
}

function rollRewardRarity(rng) {
  const x = rng();
  let acc = 0;
  for (const [r, p] of REWARD_TABLE) {
    acc += p;
    if (x < acc) return r;
  }
  return 'C';
}

function pickCard(rng, rarity) {
  const pool = CATALOG.filter((c) => c.rarity === rarity && !forgeOnly(c) && !c.monster && !c.archived);
  const fallback = CATALOG.filter((c) => c.rarity === 'C' && !forgeOnly(c) && !c.monster && !c.archived);
  const p = pool.length ? pool : fallback;
  return p[Math.floor(rng() * p.length)].id;
}

function stageRewards(seed, stage, pity = 0, dungeonId = 'marees', diff = 1) {
  const dungeon = dungeonById(dungeonId);
  const DIFF = difficultyById(diff);
  const rng = mulberry32((seed ^ Math.imul(stage * 31 + 7, 0x85ebca6b)) >>> 0);
  
  const boss = DIFF.allBoss || stage % 5 === 0;
  
  return { cards: [], boss, guaranteed: 0, monster: null, shard: null };
}

function rollRarity(rng, table) {
  const x = rng();
  let acc = 0;
  for (const [r, p] of table) {
    acc += p;
    if (x < acc) return r;
  }
  return table[table.length - 1][0];
}

function openDivineBooster(rng) {
  const pool = monstersOf('divin');
  const all = [...pool.attaque, ...pool.support];
  const pull = (table) => {
    const rarity = rollRarity(rng, table);
    const p = all.filter((c) => c.rarity === rarity);
    const fallback = all.filter((c) => RANK[c.rarity] >= RANK[rarity]);
    const q = p.length ? p : (fallback.length ? fallback : all);
    return { ...q[Math.floor(rng() * q.length)] };
  };
  return [
    pull(DIVINE_LOW_SLOT),
    pull(DIVINE_LOW_SLOT),
    pull(DIVINE_LOW_SLOT),
    pull(DIVINE_MID_SLOT),
    pull(DIVINE_TOP_SLOT),
  ];
}

// la zone (phase 3, EXI-P3-3) : 3 cibles contiguës sur 5, centre en auto, sans glissement
function pickZoneTargets(ligne, choix = null) {
  const largeur = 3;
  const debut = choix !== null
    ? Math.max(0, Math.min(choix, ligne.length - largeur))
    : Math.floor((ligne.length - largeur) / 2);
  return ligne.slice(debut, debut + largeur).filter((u) => u.hp > 0);
}

// src/engine/summon.js : extrait du monolithe (phase 0, comportement inchange)

function castSummon(s, allies, mods, events, side) {
  if ((s.summonBudget ?? 3) <= 0) return null;
  const pool = allies.attaque;
  if (pool.filter((u) => u.uid.includes('-inv') && u.alive).length >= 2) return null;
  s.summonBudget = (s.summonBudget ?? 3) - 1;
  const nb = pool.filter((u) => u.uid.includes('-inv')).length + 1;
  const hpBonus = side === 'team' ? (mods && mods.summonHp) || 0 : 0;
  const atkBonus = side === 'team' ? (mods && mods.summonAtk) || 0 : 0;
  const inv = makeUnit({
    id: `${s.cardId}-inv`, name: s.effect.summonName ?? 'Invocation',
    rarity: 'C', classe: s.classe, element: s.element, role: 'attaque',
    atk: Math.max(1, Math.round(s.atk * (s.effect.value ?? M.SUMMON_ATK_DEFAULT) * (1 + atkBonus))),
    hp: Math.max(1, Math.round(s.maxHp * (s.effect.hpPct ?? M.SUMMON_HP_DEFAULT) * (1 + hpBonus))),
  }, `${s.uid}-inv${nb}`);
  inv.spells = [{ ...M.SUMMON_SPELL }];

function progOf(dungeonId, diff = 0) {
  const p = store.progress[dungeonId];
  return p.diffs[diff >= 1 && diff <= 5 ? diff : p.diff];
}

function bestRecord(dungeonId) {
  const p = store.progress[dungeonId];
  return Math.max(...Object.values(p.diffs).map((x) => x.record ?? 0));
}

function diffUnlocked(dungeonId, diff) {
  if (diff <= 1) return true;
  return progOf(dungeonId, diff - 1).record >= dungeonById(dungeonId).floors;
}

function dungeonUnlocked(d) {
  return !d.req || bestRecord(d.req) >= dungeonById(d.req).floors;
}

function premiumUnlocked() {
  return DUNGEONS.some((d) => bestRecord(d.id) >= d.floors);
}

function levelOf(id) {
  const b = bestInstOf(id);
  return b ? Math.min(LEVEL_CAP, Math.max(1, b.lvl)) : 1;
}

function xpOf(id) {
  const b = bestInstOf(id);
  if (!b) return 0;
  const lv = Math.min(b.lvl, LEVEL_CAP);
  return Math.max(0, Math.min(0.999, b.xp / xpToNext(lv)));
}

function addXp(id, gain) {
  const target = bestInstOf(id);
  if (!target || !(gain > 0)) return levelOf(id);
  const r = addXpI(target.iid, gain * xpToNext(Math.min(target.lvl, LEVEL_CAP)));
  save();
  return r.level;
}

function seenCard(id) {
  return store.seen.includes(id);
}

function markSeen(id) {
  if (!seenCard(id)) store.seen.push(id);
}

function snapshot() {

function restore(data) {
  if (!data || typeof data !== 'object' || !Number.isInteger(data.version) || data.version < 1 || data.version > CURRENT_VERSION) return false;
  if (!Array.isArray(data.teams) || data.teams.length !== 3) return false;
  store.teams = data.teams.map((t) => ({
    slots: Array.isArray(t?.slots)
      ? t.slots.filter((x) => typeof x === 'string' || Number.isInteger(x))
      : Array.isArray(t?.attaque) && Array.isArray(t?.support)
        ? [...t.attaque, ...t.support].filter((x) => typeof x === 'string')
        : [],
  }));
  if (!Array.isArray(data.collection)) return false;
  
  store.activeTeam = Number.isInteger(data.activeTeam) && data.activeTeam >= 0 && data.activeTeam < 3
    ? data.activeTeam : 0;
  store.seed = Number.isInteger(data.seed) ? data.seed : 42;
  store.collection = new Map(data.collection);
  store.dungeon = DUNGEONS.some((d) => d.id === data.dungeon) ? data.dungeon : 'marees';
  store.progress = Object.fromEntries(DUNGEONS.map((d) => [d.id, freshProg()]));
  if (data.version >= 4 && data.progress && typeof data.progress === 'object') {
    for (const d of DUNGEONS) {
      const p = data.progress[d.id];
      if (!p || typeof p !== 'object') continue;
      const tgt = store.progress[d.id];
      tgt.diff = Number.isInteger(p.diff) && p.diff >= 1 && p.diff <= 5 ? p.diff : 1;
      if (p.diffs && typeof p.diffs === 'object') {
        for (let n = 1; n <= 5; n++) {
          const q = p.diffs[n];
          if (!q || typeof q !== 'object') continue;
          tgt.diffs[n].stage = Number.isInteger(q.stage) ? Math.min(d.floors, Math.max(1, q.stage)) : 1;
          tgt.diffs[n].record = Number.isInteger(q.record) ? Math.min(d.floors, Math.max(0, q.record)) : 0;
          tgt.diffs[n].pity = typeof q.pity === 'object' && q.pity ? { ...q.pity } : {};
        }
      } else {
        tgt.diffs[1].stage = Number.isInteger(p.stage) ? Math.min(d.floors, Math.max(1, p.stage)) : 1;
        tgt.diffs[1].record = Number.isInteger(p.record) ? Math.min(d.floors, Math.max(0, p.record)) : 0;
        tgt.diffs[1].pity = typeof p.pity === 'object' && p.pity ? { ...p.pity } : {};
      }
    }
  } else if (data.progress && typeof data.progress === 'object') {
    for (const d of DUNGEONS) {
      const p = data.progress[d.id];
      if (!p || typeof p !== 'object') continue;
      const tgt = store.progress[d.id].diffs[1];
      tgt.stage = Number.isInteger(p.stage) ? Math.min(d.floors, Math.max(1, p.stage)) : 1;
      tgt.record = Number.isInteger(p.record) ? Math.min(d.floors, Math.max(0, p.record)) : 0;
      tgt.pity = typeof p.pity === 'object' && p.pity ? { ...p.pity } : {};
    }
  } else {
    const m = store.progress.marees.diffs[1];
    m.stage = Number.isInteger(data.stage) && data.stage >= 1 ? Math.min(10, data.stage) : 1;
    m.record = Number.isInteger(data.record) && data.record >= 0 ? Math.min(10, data.record) : 0;
    m.pity = typeof data.pity === 'object' && data.pity ? data.pity : {};
  }
  
  store.shards = {};
  if (typeof data.shards === 'object' && data.shards) {
    for (const k of Object.keys(FAMILIES)) {
      const v = Number(data.shards[k]);
      if (Number.isInteger(v) && v > 0) store.shards[k] = Math.min(SHARD_MAX, v);
    }
  }
  
  store.instances = [];
  store.instanceSeq = 1;
  store.gems = freshGems();
  store.tokens = [];
  store.fatigue = { day: '', runs: {} };
  store.dropFat = { day: '', dg: {} };
  store.milestones = { clear1: false, boss5: false, diff3: false };
  store.runMod = typeof data.runMod === 'string' && runModById(data.runMod) ? data.runMod : null;
  store.grimoire = Array.isArray(data.grimoire) ? data.grimoire.filter((g) => g && typeof g.sort === 'string') : [];
  store.zonesVisitees = Array.isArray(data.zonesVisitees) ? data.zonesVisitees.filter((z) => typeof z === 'string') : [];
  if (data.version >= 6 && Array.isArray(data.instances)) {
    for (const raw of data.instances) {
      if (!raw || typeof raw.id !== 'string' || !byId(raw.id)) continue;
      const inst = {
        iid: Number.isInteger(raw.iid) && raw.iid > 0 ? raw.iid : store.instanceSeq,
        id: raw.id,
        lvl: Math.min(LEVEL_CAP, Math.max(1, Number.isInteger(raw.lvl) ? raw.lvl : 1)),
        xp: Number.isFinite(raw.xp) ? Math.max(0, raw.xp) : 0,
        asc: Number.isFinite(raw.asc) ? Math.max(0, raw.asc) : 0,
        name: typeof raw.name === 'string' ? raw.name.slice(0, 24) : '',
        acc: Array.isArray(raw.acc) ? raw.acc.filter((sp) => sp && (typeof sp.name === 'string' || typeof sp.sort === 'string')) : [],
        voie: typeof raw.voie === 'string' ? raw.voie : undefined,
        agi: Number.isFinite(raw.agi) ? raw.agi : undefined,
        int: Number.isFinite(raw.int) ? raw.int : undefined,
        isNew: raw.isNew === true,
      };
      store.instanceSeq = Math.max(store.instanceSeq, inst.iid + 1);
      store.instances.push(inst);
    }
    if (data.gems && typeof data.gems === 'object') {
      for (const tier of GEM_TIERS) {
        const src = data.gems[tier];
        if (src && typeof src === 'object') {
          for (const [el, n] of Object.entries(src)) {
            const v = Number(n);
            if (Number.isInteger(v) && v > 0) store.gems[tier][el] = v;
          }
        }
      }
    }
    
    if (data.version < 8) {
      for (const tier of GEM_TIERS) {
        const g = store.gems[tier] ?? {};
        const d = g['Divin'] ?? 0;
        if (d > 0) {
          delete g['Divin'];
          g['Lumière'] = (g['Lumière'] ?? 0) + d;
        }
      }
    }
    store.regEclats = Number.isInteger(data.regEclats) ? Math.max(0, data.regEclats) : 0;
    store.pierres = Number.isInteger(data.pierres) ? Math.max(0, data.pierres) : 0;
    if (Array.isArray(data.tokens)) {
      for (const t of data.tokens) {
        if (t && typeof t === 'object' && typeof t.kind === 'string') store.tokens.push({ rar: t.rar ?? 'C', kind: t.kind });
        else if (t && typeof t === 'object' && typeof t.cat === 'string') store.tokens.push({ rar: t.rar ?? 'C', cat: t.cat });
      }
    }
    for (const [k, subKey] of [['fatigue', 'runs'], ['dropFat', 'dg']]) {
      const src = data[k];
      if (src && typeof src === 'object' && src.day && typeof src.day === 'string') {
        store[k] = { day: src.day };
        const sub = src[subKey];
        store[k][subKey] = {};
        if (sub && typeof sub === 'object') {
          for (const [kk, vv] of Object.entries(sub)) {
            const v = Number(vv);
            if (Number.isFinite(v) && v >= 0) store[k][subKey][kk] = v;
          }
        }
      }
    }
    if (data.milestones && typeof data.milestones === 'object') {
      for (const k of Object.keys(store.milestones)) store.milestones[k] = data.milestones[k] === true;
    }
    
    store.tokenDays = data.tokenDays && typeof data.tokenDays === 'object' ? { ...data.tokenDays } : {};
    store.firstClearTokens = data.firstClearTokens && typeof data.firstClearTokens === 'object' ? { ...data.firstClearTokens } : {};
  } else {
    
    for (const [id, n] of store.collection) {
      if (n <= 0 || !byId(id)) continue;
      let lv = 1;
      if (data.version === 1) {
        lv = 1 + (Number(data.levels?.[id]) || 0);
      } else if (data.version === 2) {
        const arr = data.copies?.[id];
        lv = Array.isArray(arr) && arr.length ? Math.max(1, Math.max(...arr)) : 1;
      } else {
        lv = Number.isInteger(data.levels?.[id]) && data.levels[id] >= 1 ? data.levels[id] : 1;
      }
      lv = Math.min(LEVEL_CAP, lv);
      for (let k = 0; k < n; k += 1) {
        const inst = newInst(id, k === 0 ? lv : 1);
        if (k === 0 && data.version >= 4) {
          const x = Number(data.xp?.[id]);
          if (Number.isFinite(x) && x > 0) inst.xp = Math.min(0.999, x) * xpToNext(lv);
        }
      }
    }
    store.milestones = { clear1: premiumUnlocked(), boss5: false, diff3: false };
  }
  
  {
    const assigned = new Set();
    for (const t of store.teams) {
      const kept = [];
      for (const x of t.slots) {
        if (Number.isInteger(x)) {
          if (byIid(x)) kept.push(x);
          continue;
        }
        const inst = instsOf(x).find((i) => !assigned.has(i.iid));
        if (inst) {
          assigned.add(inst.iid);
          kept.push(inst.iid);
        }
      }
      t.slots = kept;
    }
  }
  
  store.seen = Array.isArray(data.seen) ? [...new Set(data.seen)] : [];
  for (const id of store.collection.keys()) markSeen(id);
  
  if (Number.isInteger(data.points) && data.points >= 0) store.points = data.points;
  else store.points = 25 * Math.max(0, (data.stage ?? 1) - 1);
  store.dailyDone = typeof data.dailyDone === 'string' ? data.dailyDone : '';
  store.dailyLevel = data.dailyLevel && typeof data.dailyLevel === 'object' && Number.isFinite(data.dailyLevel.lvl)
    ? { day: String(data.dailyLevel.day ?? ''), lvl: Math.max(1, Math.round(data.dailyLevel.lvl)) }
    : null;
  store.defiActive = false;
  sanitizeTeams();
  return true;
}

function sanitizeTeams() {
  for (const t of store.teams) {
    const kept = [];
    const perId = new Map();
    const divFams = new Set();
    for (const x of t.slots) {
      if (kept.length >= 5) break;
      const inst = byIid(x);
      if (!inst) continue;
      const n = perId.get(inst.id) ?? 0;
      const owned = store.collection.get(inst.id) ?? 0;
      if (n >= Math.min(2, owned)) continue;
      const c = byId(inst.id);
      if (c && c.dungeon === 'divin') {
        if (divFams.has(c.fam) || divFams.size >= 3) continue;
        divFams.add(c.fam);
      }
      kept.push(x);
      perId.set(inst.id, n + 1);
    }
    t.slots = kept;
  }
}

function save() {
  try {
    const prev = storage.getItem(SAVE_KEY);
    const raw = JSON.stringify(snapshot());
    if (prev && prev !== raw) {
      try { storage.setItem(BAK_KEY, prev); } catch (e2) {  }
    }
    storage.setItem(SAVE_KEY, raw);
    store.saveBroken = false;
  } catch (e) {
    
    store.saveBroken = true;
  }
}

function load() {
  for (const key of [SAVE_KEY, BAK_KEY]) {
    try {
      const raw = storage.getItem(key);
      if (!raw) continue;
      // flux reel : une sauvegarde v8 traverse les migrations v9 -> v12 avant restauration (EXI-SAVE-1)
      if (restore(migrate(JSON.parse(raw)))) return true;
    } catch (e) {
      
    }
  }
  return false;
}

function usedInTeam(id) {
  let n = 0;
  for (const t of store.teams) {
    for (const x of t.slots) {
      const inst = byIid(x);
      if (inst && inst.id === id) n += 1;
    }
  }
  return n;
}

function iidInTeam(iid) {
  for (const t of store.teams) {
    if (t.slots.includes(iid)) return true;
  }
  return false;
}

function freeCopies(id) {
  let n = 0;
  for (const inst of instsOf(id)) {
    if (!iidInTeam(inst.iid)) n += 1;
  }
  return n;
}

function grantCards(ids) {
  for (const id of ids) {
    if (!byId(id)) continue;
    newInst(id);
    markSeen(id);
  }
  save();
}
