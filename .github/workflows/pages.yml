name: CI + Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - run: node --test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site
          cp dist.html site/index.html
          cp assets-v3.json site/assets-v3.json
          cp assets-v3.1.json site/assets-v3.1.json
          cp assets-v32.json site/assets-v32.json
          cp assets-v33.json site/assets-v33.json
          # v3.4 : manifeste genere cote couloir design — copie seulement s'il est present dans le depot
          # (le jeu tolere son absence : bouton grise libelle, version courante inchangee — smoke S27 f)
          if [ -f assets-v34.json ]; then cp assets-v34.json site/assets-v34.json; fi
          cp -r site-assets/fx site/fx
          cp -r site-assets/errance site/errance
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
